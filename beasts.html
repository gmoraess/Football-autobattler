<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>World Cup Beasts — Duelo de Cartas (5v5)</title>
<style>
  :root{
    --bg:#0a0e1a; --panel:#131a2e; --panel2:#1b2540; --line:#2a3556;
    --txt:#e8edf7; --muted:#8a96b8; --gold:#f5c451; --good:#4fd18b; --bad:#ff6b6b;
    --home:#4fb0d1; --away:#d14f4f; --shadow:0 8px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:radial-gradient(120% 80% at 50% 0%,#161d33,#070a14);
    color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow-x:hidden}
  body{display:flex;justify-content:center}
  #app{width:100%;max-width:780px;min-height:100vh;padding:12px 12px 30px;position:relative}
  h1,h2,h3{margin:0 0 .35em;font-weight:800} h1{font-size:26px} h2{font-size:20px}
  p{line-height:1.5;color:var(--muted);margin:.3em 0}
  .center{text-align:center} .muted{color:var(--muted)} .gold{color:var(--gold)}
  .good{color:var(--good)} .bad{color:var(--bad)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(180deg,#2b3a63,#202c4e);color:var(--txt);border:1px solid var(--line);
    padding:11px 16px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
    transition:transform .06s,filter .15s;user-select:none}
  .btn:hover{filter:brightness(1.12)} .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(180deg,#f5c451,#e0a72f);color:#241a00;border-color:#caa033}
  .btn.ghost{background:transparent} .btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
  .btn.full{width:100%}
  .card-ui{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}

  .scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:6px}
  .team{display:flex;flex-direction:column;gap:4px}.team.away{align-items:flex-end}
  .team .nm{font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px}
  .stabar{height:13px;border-radius:8px;background:#2a1414;overflow:hidden;border:1px solid var(--line);width:100%}
  .stabar>div{height:100%;transition:width .5s}
  .team .stabar>div{background:linear-gradient(90deg,#2e9c66,var(--good))}
  .scoremid{text-align:center}.scoremid .sc{font-size:28px;font-weight:900}.scoremid .turn{font-size:12px;color:var(--muted)}

  .zonebar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 0 6px}
  .zcell{position:relative;border:1px solid var(--line);border-radius:9px;padding:5px 2px;text-align:center;
    background:#0e1424;font-size:10px;font-weight:700;color:var(--muted);min-height:34px}
  .zcell .zl{display:block;font-size:9px;opacity:.8}
  .zcell.ball{box-shadow:inset 0 0 0 2px var(--gold)}
  .zcell.shoot{background:#2a2410}
  .zcell .b{font-size:16px;line-height:1}
  .dir{font-size:11px;text-align:center;color:var(--muted);margin-bottom:4px}

  #pitch{width:100%;display:block;border-radius:12px;border:2px solid #0c4a20;
    box-shadow:inset 0 0 50px rgba(0,0,0,.5);margin-bottom:8px;background:#1b6e31}

  .zonelabel{font-size:12px;color:var(--muted);margin:2px 2px 5px;display:flex;justify-content:space-between}
  .playzone{min-height:96px;border:2px dashed var(--line);border-radius:12px;padding:7px;
    display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:#0e142480}
  .playzone.empty::before{content:"Toque nas cartas para montar a jogada";color:#5b6688;font-size:12px;margin:auto}
  .hand{display:flex;gap:7px;overflow-x:auto;padding:8px 2px 2px;scrollbar-width:thin}
  .pcard{flex:0 0 auto;width:96px;min-height:124px;border-radius:11px;border:2px solid var(--line);
    background:linear-gradient(180deg,#1d2742,#161e34);padding:7px 6px;cursor:pointer;position:relative;
    transition:transform .1s,border-color .15s;user-select:none}
  .pcard:hover{transform:translateY(-3px)}
  .pcard .ic{font-size:24px;text-align:center;line-height:1.1}
  .pcard .nm{font-size:11px;font-weight:800;text-align:center;margin-top:2px}
  .pcard .vals{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:4px}
  .pcard .vals b{font-size:8px;font-weight:800;padding:1px 4px;border-radius:5px;background:#0e1830;color:#9cd6ff;border:1px solid #2a3556}
  .pcard .ds{font-size:8.5px;color:var(--muted);line-height:1.25;margin-top:5px;text-align:center}
  .pcard .tag{position:absolute;top:5px;right:5px;font-size:8px;font-weight:800;padding:1px 5px;border-radius:6px}
  .pcard.finish{border-color:#c9803a}.pcard.finish .tag{background:#5a3a1d;color:#ffc890}
  .pcard.support .tag{background:#1d3a4a;color:#9cd6ff}
  .pcard.impact{border-color:#a8403a}.pcard.impact .tag{background:#4a1d1d;color:#ff9c9c}
  .pcard.block .tag,.pcard.tackle .tag,.pcard.pressure .tag{background:#1d4a2c;color:#9cffb6}
  .pcard.mini{width:66px;min-height:82px}.pcard.mini .ic{font-size:20px}.pcard.mini .nm{font-size:9px}.pcard.mini .ds,.pcard.mini .vals{display:none}
  .pcard.disabled{opacity:.32;pointer-events:none;filter:grayscale(.6)}

  #log{height:70px;overflow-y:auto;background:#0c1120;border:1px solid var(--line);border-radius:12px;
    padding:8px;font-size:13px;line-height:1.5;margin-top:8px}
  #log .e{margin-bottom:2px}
  #log .goal{color:var(--gold);font-weight:800}#log .ko{color:var(--bad);font-weight:800}
  #log .good{color:var(--good)}#log .sys{color:#c0a0ff}#log .miss{color:#ffb07a}#log .adv{color:#9cd6ff}

  #banner{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(60% 60% at 50% 50%,rgba(10,14,26,.12),rgba(5,8,15,.86));pointer-events:none}
  #banner .big{text-align:center;animation:zoomin 1s ease both}
  #banner .t1{font-size:13px;letter-spacing:4px;color:var(--muted);font-weight:800}
  #banner .t2{font-size:36px;font-weight:900;text-shadow:0 4px 24px rgba(0,0,0,.8)}
  @keyframes zoomin{0%{transform:scale(2);opacity:0;filter:blur(5px)}40%{transform:scale(1);opacity:1;filter:blur(0)}100%{opacity:.92}}
  .bigtext{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:80;pointer-events:none;
    font-size:64px;font-weight:900;letter-spacing:1px;text-shadow:0 6px 30px rgba(0,0,0,.9);animation:goalpop 1.4s ease both}
  @keyframes goalpop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-8deg);opacity:0}
    25%{transform:translate(-50%,-50%) scale(1.15) rotate(2deg);opacity:1}
    70%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}100%{opacity:0;transform:translate(-50%,-58%) scale(1)}}
  .toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:#000d;border:1px solid var(--gold);
    color:var(--gold);padding:8px 15px;border-radius:10px;font-weight:800;z-index:99;animation:fade .25s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .screen{animation:fade .3s ease}
  .controls{display:flex;gap:8px;margin-top:8px}
  .intent{margin:0 0 8px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:#1a1410;font-size:12px;line-height:1.4}
  .intent .who{font-weight:800;color:#ffcaa0}
  .intent .ic{font-size:16px;margin:0 1px}
  .predict{margin:6px 0 2px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:#0e1626;font-size:12px;line-height:1.5}
  .predict .res{font-weight:800;font-size:14px}
  .predict .res.good{color:var(--good)} .predict .res.bad{color:var(--bad)} .predict .res.gold{color:var(--gold)} .predict .res.warn{color:#ffb07a}
  .predict .chip{display:inline-block;margin:3px 4px 0 0;padding:1px 7px;border-radius:7px;background:#0c1322;border:1px solid var(--line);font-size:11px}
  .predict .ok{color:var(--good)} .predict .no{color:var(--bad)}
  .kit{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:3px}
  .furyrow{display:flex;gap:8px;align-items:center;margin:8px 0 0}
  .furybar{flex:1;height:18px;border-radius:9px;background:#1a1230;border:1px solid var(--line);overflow:hidden;position:relative}
  #furyfill{height:100%;width:0;background:linear-gradient(90deg,#7a3df5,#f5c451);transition:width .35s}
  #furytxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;letter-spacing:2px;color:#fff;text-shadow:0 1px 2px #000}
  #superbtn{padding:8px 12px;font-size:14px;font-weight:800;border-color:#7a3df5;white-space:nowrap}
  #superbtn.ready{background:linear-gradient(180deg,#9a5bff,#7a3df5);color:#fff;border-color:var(--gold);animation:pulse 1s infinite}
  #superbtn.armed{background:linear-gradient(180deg,#f5c451,#e0a72f);color:#241a00;border-color:var(--gold)}
  @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
  /* mapa */
  .mapwrap{position:relative;width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#0c1322;padding:6px}
  .mapnode{position:absolute;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--panel2);
    display:flex;align-items:center;justify-content:center;font-size:18px;cursor:default;transition:transform .1s}
  .mapnode.can{cursor:pointer;border-color:var(--gold);box-shadow:0 0 10px rgba(245,196,81,.5)}
  .mapnode.can:hover{transform:scale(1.12)}
  .mapnode.done{opacity:.4} .mapnode.cur{border-color:#fff;box-shadow:0 0 12px #fff}
  .mapnode.boss{width:46px;height:46px;font-size:22px;border-color:var(--bad)}

  /* =================== HUD da PARTIDA — ARENA GÓTICA (mock) ================= */
  /* paleta quente escopada à tela de partida */
  .mt{--stone:#1a140e;--stone2:#0e0a06;--gold:#d8b25a;--gold2:#f3da93;--bronze:#7a5a26;--bronze2:#3c2b12;
      --rune:#e7d8b4;--rune2:#a8916a;
      display:flex;flex-direction:column;gap:9px;font-family:"Cinzel","Trajan Pro",Georgia,"Times New Roman",serif;
      padding:10px;border-radius:16px;color:var(--rune);
      background:
        radial-gradient(120% 60% at 50% -8%,#3a2c18 0%,transparent 55%),
        radial-gradient(90% 50% at 50% 108%,#241a0e 0%,transparent 60%),
        repeating-linear-gradient(0deg,#15100a 0 2px,#120d08 2px 4px),
        linear-gradient(180deg,#1c150d,#0b0805);
      border:2px solid var(--bronze);box-shadow:0 0 0 1px #000,inset 0 0 60px #000a,0 12px 40px #000a}
  .mt.shk{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  /* moldura de pedra+ouro reutilizável */
  .mt .frame{position:relative;border:2px solid var(--bronze);border-radius:11px;
    background:linear-gradient(180deg,#241a10,#120c07);
    box-shadow:inset 0 0 0 1px #00000088,inset 0 0 22px #0008,inset 0 1px 0 #c9a24e33,0 4px 14px #000a}
  .mt .frame::before,.mt .frame::after{content:"";position:absolute;width:7px;height:7px;border:1px solid var(--gold);background:radial-gradient(var(--gold2),var(--bronze));border-radius:50%;box-shadow:0 0 4px #000}
  .mt .frame::before{top:3px;left:3px} .mt .frame::after{top:3px;right:3px}
  /* livro/engrenagem no topo */
  .mtopbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1px}
  .mtitle{font-size:12px;letter-spacing:3px;color:var(--gold2);text-shadow:0 1px 2px #000;font-weight:700}
  .micons{display:flex;gap:6px}
  .micons span{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;
    border:1px solid var(--bronze);background:linear-gradient(180deg,#2a1f12,#140d07);box-shadow:inset 0 0 6px #000,0 0 3px #c9a24e22;cursor:pointer}
  .micons span:hover{border-color:var(--gold)}
  /* placar superior com minimapa */
  .mtop{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:9px 11px}
  .mteam{display:flex;flex-direction:column;gap:5px;min-width:0}
  .mteam.away{align-items:flex-end}
  .mnm{font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--rune);text-shadow:0 1px 1px #000}
  .folegobar{position:relative;height:15px;width:100%;max-width:170px;border-radius:8px;background:#2a0f0f;
    border:1px solid var(--bronze);overflow:hidden;box-shadow:inset 0 0 7px #000}
  .mteam.away .folegobar{margin-left:auto}
  .folegobar .ff{height:100%;transition:width .4s}
  .folegobar .ff.h,.folegobar .ff.a{background:linear-gradient(180deg,#5fd38f,#1f7a47);box-shadow:0 0 8px #2e9c6688}
  .folegobar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 1px #000}
  .mscore{text-align:center}
  .mscore .sc{font-size:32px;font-weight:900;line-height:1;color:var(--gold2);text-shadow:0 2px 0 #5a3e16,0 3px 6px #000}
  .mscore .sc .muted{color:var(--rune2)}
  .mscore .trn{font-size:9px;color:var(--rune2);margin:3px 0 5px;letter-spacing:2px}
  .minimap{position:relative;width:132px;height:62px;margin:0 auto;border-radius:6px;
    background:repeating-linear-gradient(90deg,#1d5e2c 0 12px,#236e34 12px 24px);
    border:2px solid var(--bronze);box-shadow:inset 0 0 14px #000c,0 0 0 1px #000}
  .minimap::before{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:1px;background:rgba(255,255,255,.4)}
  .minimap::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;border:1px solid rgba(255,255,255,.4);border-radius:50%;transform:translate(-50%,-50%)}
  .mdot{position:absolute;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 1px 2px #000}
  .mdot.h{background:var(--home)} .mdot.a{background:var(--away)}
  .mdot.gk{width:auto;height:auto;font-size:7px;font-weight:800;color:#fff;background:none;box-shadow:none}
  .mball{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 5px #fff;transition:left .4s}
  /* arena central: barras laterais + nichos dos personagens */
  .marena{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
  .mside{display:flex;flex-direction:column;gap:6px}
  .barbox{position:relative;border:1px solid var(--bronze2);border-radius:9px;padding:6px 8px 7px;
    background:linear-gradient(180deg,#1d150c,#100b06);opacity:.42;transition:opacity .25s,border-color .25s,box-shadow .25s}
  .barbox.act{opacity:1;border-color:var(--gold);box-shadow:inset 0 0 0 1px #c9a24e44,inset 0 0 12px #000,0 0 10px #c9a24e22}
  .barhd{display:flex;justify-content:space-between;align-items:center;font-size:9.5px;font-weight:700;margin-bottom:4px}
  .barhd .bn{letter-spacing:.6px;text-shadow:0 1px 1px #000} .barhd .bv{color:var(--rune2);font-variant-numeric:tabular-nums;font-family:Georgia,serif}
  .bn.F{color:#ffba6a} .bn.C{color:#86d8ff} .bn.D{color:#ff8f8f} .bn.E{color:#9cffb6}
  .bar{display:flex;gap:2px;padding:2px;border-radius:4px;background:#0a0704;box-shadow:inset 0 0 5px #000}
  .seg{flex:1;height:9px;border-radius:2px;background:#241a10;box-shadow:inset 0 0 2px #000}
  .seg.on.F{background:linear-gradient(180deg,#ffc070,#e8842a);box-shadow:0 0 5px #ff9d3caa}
  .seg.on.C{background:linear-gradient(180deg,#7fd2ff,#2a8fd8);box-shadow:0 0 5px #3ab6ffaa}
  .seg.on.D{background:linear-gradient(180deg,#ff8585,#d83a3a);box-shadow:0 0 5px #ff5a5aaa}
  .seg.on.E{background:linear-gradient(180deg,#8fe9b3,#2eaa68);box-shadow:0 0 5px #3ad17eaa}
  .bardesc{font-size:8px;color:var(--rune2);margin-top:4px;line-height:1.2;font-family:Georgia,serif;font-style:italic}
  .mcenter{display:flex;flex-direction:column;justify-content:center;gap:20px;min-width:104px;padding:8px 2px}
  .mchar{position:relative;display:flex;flex-direction:column;align-items:center}
  /* nicho gótico de arco pontiagudo */
  .mbeast{position:relative;width:74px;height:88px;display:flex;align-items:center;justify-content:center;font-size:38px;
    border-radius:37px 37px 9px 9px;border:2px solid var(--bronze);
    box-shadow:inset 0 -10px 18px #0009,inset 0 0 0 1px #00000088,inset 0 3px 10px #ffffff14,0 8px 18px #000a;
    text-shadow:0 3px 5px #000}
  .mbeast::after{content:"";position:absolute;inset:-2px;border-radius:37px 37px 9px 9px;
    box-shadow:inset 0 0 0 2px #c9a24e3a;pointer-events:none}
  .mchar.away .mbeast{box-shadow:inset 0 -10px 18px #0009,inset 0 0 0 1px #00000088,inset 0 3px 10px #ffffff14,0 8px 18px #000a,0 0 16px #00000000}
  .possmark{position:absolute;bottom:100%;margin-bottom:6px;white-space:nowrap;font-size:9px;font-weight:700;letter-spacing:1px;
    color:#1a1206;background:linear-gradient(180deg,var(--gold2),var(--gold));border:1px solid #8a6a2a;
    padding:3px 9px;border-radius:4px;box-shadow:0 2px 6px #000a,inset 0 1px 0 #fff6;text-shadow:0 1px 0 #fff5}
  .possmark::before,.possmark::after{content:"";position:absolute;top:50%;width:6px;height:6px;background:var(--gold);transform:translateY(-50%) rotate(45deg);box-shadow:0 0 3px #000}
  .possmark::before{left:-4px} .possmark::after{right:-4px}
  .ballfeet{position:absolute;top:100%;margin-top:2px;font-size:16px;filter:drop-shadow(0 2px 2px #000)}
  .intentbubble{position:absolute;bottom:100%;margin-bottom:6px;width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:18px;
    background:radial-gradient(70% 70% at 50% 35%,#3a2410,#160d05);border:2px solid var(--gold);
    box-shadow:0 0 12px #c9803a88,inset 0 0 6px #000;animation:bob 1.6s ease-in-out infinite}
  .intentbubble::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:var(--gold)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  /* faixa inferior: energia + mão + ações */
  .mbottom{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:stretch;padding:10px}
  .menergybox{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;width:62px;border-radius:10px;
    border:1px solid var(--bronze);background:radial-gradient(70% 70% at 50% 30%,#2b3b6b,#0e1430);box-shadow:inset 0 0 12px #000,0 0 10px #3a6bd033}
  .menergybox::before{content:"";position:absolute;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#bfe6ff,#3a6bd0);filter:blur(7px);opacity:.5;margin-bottom:30px}
  .energ{font-size:26px;font-weight:900;color:#dff1ff;line-height:1;text-shadow:0 0 10px #6fb6ff,0 2px 2px #000;font-family:"Cinzel",Georgia,serif}
  .energ span{font-size:13px;color:#8fb6d8}
  .elabel{font-size:8px;font-weight:700;letter-spacing:2px;color:#a9cdea;margin-top:3px}
  .mhand{display:flex;gap:6px;overflow-x:auto;padding:2px 1px;scrollbar-width:thin}
  .gcard{flex:0 0 auto;width:82px;min-height:108px;border-radius:9px;border:2px solid var(--bronze);position:relative;
    background:linear-gradient(180deg,#2a2012,#15100a);padding:19px 5px 6px;cursor:pointer;
    box-shadow:inset 0 0 0 1px #00000066,inset 0 0 10px #0007,0 3px 8px #000a;transition:transform .1s,border-color .15s,box-shadow .15s;user-select:none}
  .gcard:hover{transform:translateY(-4px);box-shadow:0 8px 16px #000a,0 0 10px #c9a24e44}
  .gcard.noenergy{opacity:.32;filter:grayscale(.7);pointer-events:none}
  .gcard .cost{position:absolute;top:-8px;left:-8px;width:24px;height:24px;border-radius:50%;
    background:radial-gradient(70% 70% at 50% 30%,#5a86e0,#1b2f63);border:1px solid #aecaf2;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;
    box-shadow:0 2px 5px #000c,0 0 8px #3a6bd066;font-family:"Cinzel",Georgia,serif}
  .gcard .cic{font-size:25px;text-align:center;line-height:1;filter:drop-shadow(0 2px 2px #000)}
  .gcard .cnm{font-size:10px;font-weight:700;text-align:center;margin-top:3px;color:var(--rune);text-shadow:0 1px 1px #000}
  .gcard .cds{font-size:8px;color:var(--rune2);text-align:center;line-height:1.25;margin-top:4px;font-family:Georgia,serif}
  .gcard.fin{border-color:#c9803a;box-shadow:inset 0 0 12px #5a2a0a55,0 3px 8px #000a}
  .gcard.con{border-color:#3a78c9;box-shadow:inset 0 0 12px #0a2a5a55,0 3px 8px #000a}
  .gcard.des{border-color:#c93a3a;box-shadow:inset 0 0 12px #5a0a0a55,0 3px 8px #000a}
  .gcard.def{border-color:#3ac96e;box-shadow:inset 0 0 12px #0a4a2a55,0 3px 8px #000a}
  .mactions{display:flex;flex-direction:column;gap:7px;justify-content:center;min-width:100px}
  .superb{padding:8px 10px;font-size:12px;font-weight:700;white-space:nowrap;border-radius:9px;
    border:1px solid #7a3df5;background:linear-gradient(180deg,#2a1f3e,#160d28);color:#d9c8ff;font-family:"Cinzel",Georgia,serif}
  .superb.ready{background:linear-gradient(180deg,#9a5bff,#7a3df5);color:#fff;border-color:var(--gold);animation:pulse 1s infinite}
  .superb.armed{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#241a00;border-color:#fff}
  /* botão estandarte FIM DE TURNO */
  .endturn{font-size:14px;font-weight:700;letter-spacing:1px;padding:12px 12px;border-radius:9px;
    font-family:"Cinzel","Trajan Pro",Georgia,serif;color:#1a1206;border:1px solid #8a6a2a;
    background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#a87f2e);
    box-shadow:inset 0 1px 0 #fff7,inset 0 -2px 6px #00000044,0 4px 10px #000a;text-shadow:0 1px 0 #fff6}
  .endturn:hover{filter:brightness(1.08)}
  .mt #log{background:linear-gradient(180deg,#15100a,#0c0805);border:1px solid var(--bronze2)}
  .mt #quitmatch{color:var(--rune2);font-family:Georgia,serif}
</style>

<body>
<div id="app"></div>
<script>
"use strict";
/* ===========================================================================
   WORLD CUP BEASTS — Duelo de cartas determinístico (5v5, campo animado).
   - Resolução sem sorte: valor vs alvo / X seu vs X do rival. Variância = só o
     sorteio das cartas -> builds funcionam de forma fiável.
   - Campo de futebol normal; a orientação de zona fica na barra acima.
   - A animação da bola é a peça central: passes entre os 5, e no gol há
     zoom + câmera lenta + fogo + a bola estufando a rede.
   Lógica pura separada do render (testável headless).
   ========================================================================= */
const $=(s,el=document)=>el.querySelector(s);
const app=$("#app");
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[ri(0,a.length-1)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ------------------------------- AJUSTES --------------------------------- */
let TURNS=15, STA_MAX=100; const MERCY=5, HAND=5, MAXPLAY=3;
let IMPACT_DMG=4, FATIGUE=1;
const BIGSTEP=6, ADV_TH=7, MOMCAP=6;
const EMPTY=new Set();   // relíquias vazias (partida avulsa)

/* ----------- CARTAS (custo de energia + contribuição às 4 barras) --------- */
// barras: F=Finalização, C=Controle de bola, D=Desarme, E=Defesa · sta=tira fôlego
const CARDS={
  passe   :{id:"passe",mode:"atk",type:"con",nm:"Passe",ic:"⚽",cost:1,C:2,ds:"Passe curto · Controle +2"},
  drible  :{id:"drible",mode:"atk",type:"con",nm:"Drible",ic:"👟",cost:2,C:4,ds:"Controle de bola +4"},
  meialua :{id:"meialua",mode:"atk",type:"con",nm:"Meia-Lua",ic:"🌙",cost:1,C:2,F:1,ds:"Controle +2 · Final. +1"},
  caneta  :{id:"caneta",mode:"atk",type:"con",nm:"Caneta",ic:"🎩",cost:2,C:5,ds:"Controle de bola +5"},
  visao   :{id:"visao",mode:"atk",type:"con",nm:"Visão de Jogo",ic:"🧠",cost:1,C:2,F:1,ds:"Controle +2 · Final. +1"},
  cruzamento:{id:"cruzamento",mode:"atk",type:"fin",nm:"Cruzamento",ic:"📤",cost:1,F:2,ds:"Bola na área · Final. +2"},
  finaliza:{id:"finaliza",mode:"atk",type:"fin",nm:"Finalização",ic:"🎯",cost:2,F:4,ds:"Chute ao gol · Final. +4"},
  lancamento:{id:"lancamento",mode:"atk",type:"fin",nm:"Lançamento",ic:"⚡",cost:2,F:3,C:1,ds:"Final. +3 · Controle +1"},
  colocado:{id:"colocado",mode:"atk",type:"fin",nm:"Chute Colocado",ic:"🪄",cost:2,F:3,pierce:1,ds:"Final. +3 · fura 1 defesa"},
  bicuda  :{id:"bicuda",mode:"atk",type:"fin",nm:"Bicuda",ic:"💥",cost:2,F:5,sta:IMPACT_DMG,ds:"Final. +5 · tira fôlego"},
  voleio  :{id:"voleio",mode:"atk",type:"fin",nm:"Voleio",ic:"🦵",cost:3,F:7,ds:"Final. +7 (caríssimo)"},
  cavadinha:{id:"cavadinha",mode:"atk",type:"fin",nm:"Cavadinha",ic:"🥄",cost:2,F:3,pierce:1,ds:"Final. +3 · fura 1 defesa"},
  desarme :{id:"desarme",mode:"def",type:"des",nm:"Desarme",ic:"🦵",cost:1,D:3,ds:"Desarme +3"},
  carrinho:{id:"carrinho",mode:"def",type:"des",nm:"Carrinho",ic:"🦿",cost:1,D:2,sta:IMPACT_DMG,ds:"Desarme +2 · tira fôlego"},
  botinha :{id:"botinha",mode:"def",type:"des",nm:"Antecipação",ic:"🥷",cost:2,D:4,ds:"Desarme +4"},
  pancada :{id:"pancada",mode:"def",type:"des",nm:"Pancada",ic:"💢",cost:1,D:1,sta:IMPACT_DMG+2,ds:"Desarme +1 · tira muito fôlego"},
  ombro   :{id:"ombro",mode:"def",type:"des",nm:"Ombrada",ic:"🪨",cost:2,D:2,sta:IMPACT_DMG+2,ds:"Desarme +2 · tira fôlego"},
  solada  :{id:"solada",mode:"def",type:"des",nm:"Solada",ic:"🦶",cost:2,D:3,sta:IMPACT_DMG+2,ds:"Desarme +3 · tira fôlego"},
  marcacao:{id:"marcacao",mode:"def",type:"des",nm:"Marcação",ic:"😖",cost:1,D:1,E:1,ds:"Desarme +1 · Defesa +1"},
  defesa  :{id:"defesa",mode:"def",type:"def",nm:"Defesa",ic:"🛡️",cost:1,E:3,ds:"Defesa +3"},
  bloqueio:{id:"bloqueio",mode:"def",type:"def",nm:"Bloqueio",ic:"🧱",cost:1,E:2,ds:"Defesa +2"},
  muralha :{id:"muralha",mode:"def",type:"def",nm:"Muralha",ic:"🏰",cost:2,E:5,ds:"Defesa +5"},
};
const ATK_DECK=[["passe",3],["drible",2],["lancamento",2],["visao",2],["finaliza",2],["colocado",1],["bicuda",1],["pancada",3]];
const DEF_DECK=[["defesa",3],["bloqueio",2],["desarme",3],["marcacao",2],["carrinho",2]];
function buildDeck(spec){const d=[];for(const[id,n]of spec)for(let i=0;i<n;i++)d.push(id);return d;}
function drawHand(deckIds){const deck=shuffle(deckIds.slice());
  return deck.slice(0,HAND).map(id=>({...CARDS[id],uid:Math.random().toString(36).slice(2,8)}));}
const DECK_ATK=buildDeck(ATK_DECK), DECK_DEF=buildDeck(DEF_DECK);   // baralhos padrão (partida avulsa)
const shortName=b=>b.name.split(",")[0];

const BEASTS={
  tatu:{key:"tatu",name:"Couraça, o Tatu de Guerra",crest:"🛡️",color:"#7a6a4a",ATK:5,DEF:5,TEC:4,super:"casco"},
  mino:{key:"mino",name:"Górtax, Minotauro de Ônix",crest:"🐂",color:"#2e3340",ATK:5,DEF:5,TEC:4,super:"bicuda"},
};
/* =================== MOTOR DA PARTIDA — 4 BARRAS + ENERGIA ================ */
/* Barras (por personagem): F=Finalização, C=Controle, D=Desarme, E=Defesa.
   Acumulam entre turnos. F/E disparam ao encher (e zeram); C e D são comparados.
   Posse: quem tem a bola foca F+C; quem não tem foca D+E. Energia 3/turno. */
const opp=s=>s==="home"?"away":"home";
const BARFIN=8, BARDEF=6, CD_CAP=20, ENERGY=3, FMAXCAP=99;
let G=null;
function freshMatch(home,away,diff){
  return {beasts:{home,away},possession:"home",turn:1,suddenDeath:false,over:false,winner:null,reason:null,
    score:{home:0,away:0},sta:{home:STA_MAX,away:STA_MAX},staMax:{home:STA_MAX,away:STA_MAX},
    bars:{home:{F:0,C:0,D:0,E:0},away:{F:0,C:0,D:0,E:0}},
    barMax:{home:{F:Math.round(BARFIN*diff),E:Math.round(BARDEF*diff)},
            away:{F:BARFIN,E:BARDEF}}, saves:{home:0,away:0},_goalH:false,_goalA:false};
}
function finMatch(st,w,r){st.over=true;st.winner=w;st.reason=r;return true;}
function checkEnd(st){
  if(st.sta.away<=0)return finMatch(st,"home","KO");
  if(st.sta.home<=0)return finMatch(st,"away","KO");
  const d=st.score.home-st.score.away;
  if(d>=MERCY)return finMatch(st,"home","GOLEADA");
  if(d<=-MERCY)return finMatch(st,"away","GOLEADA");
  if(st.suddenDeath){ if(st._goalH)return finMatch(st,"home","GOLDEN"); if(st._goalA)return finMatch(st,"away","GOLDEN"); return false; }
  if(st.turn>TURNS){ if(st.score.home!==st.score.away)return finMatch(st,st.score.home>st.score.away?"home":"away","TIME"); st.suddenDeath=true; }
  return false;
}
const SUPERS={casco:{nm:"Casco Imortal"},bicuda:{nm:"Bicuda Imortal"},voo:{nm:"Voo Rasante"},mordida:{nm:"Mordida Selvagem"}};
function superLabel(id){return SUPERS[id]?SUPERS[id].nm:"Super";}
const nm=s=>shortName(G.st.beasts[s]);

function beginMatch(home,away,decks,onEnd){
  const diff=(decks&&decks.diff)||1;
  const st=freshMatch({...home},{...away},diff);
  const relics=new Set((decks&&decks.relics)||[]);
  if(relics.has("coracao")){ st.staMax.home=STA_MAX+20; st.sta.home=st.staMax.home; }
  const pDeck=[...(decks?decks.pAtk:DECK_ATK),...(decks?decks.pDef:DECK_DEF)];
  const oDeck=[...(decks?decks.oAtk:DECK_ATK),...(decks?decks.oDef:DECK_DEF)];
  G={st,bars:st.bars,barMax:st.barMax,saves:st.saves,relics,onEnd,busy:false,
     deck:shuffle(pDeck.slice()),discard:[],hand:[],
     oDeck:oDeck.slice(),oLive:shuffle(oDeck.slice()),oDiscard:[],oEnergy:ENERGY+((decks&&decks.oEnergy)||0),
     energy:ENERGY,energyMax:ENERGY+(relics.has("vento")?1:0),
     played:[],enemyPlan:null,fury:0,superName:home.super||null,superArmed:null,shake:0};
  log("sys",`🏟️ ${home.crest} ${shortName(home)} x ${shortName(away)} ${away.crest} · ${TURNS} turnos`);
  log("sys","Encha as barras com cartas (energia 3/turno). Posse: foque Finalização + Controle.");
  startTurn();
}
function startGame(){ beginMatch(BEASTS.tatu,BEASTS.mino,{pAtk:DECK_ATK,pDef:DECK_DEF,oAtk:DECK_ATK,oDef:DECK_DEF,diff:1},null); }

function drawN(n){ if(G.deck.length<n){ G.deck=G.deck.concat(shuffle(G.discard.splice(0))); }
  return G.deck.splice(0,n).map(id=>({...CARDS[id],uid:Math.random().toString(36).slice(2,8)})); }
function startTurn(){
  if(G.st.over)return;
  G.busy=false; G.energy=G.energyMax; G.discard.push(...G.hand.map(c=>c.id)); G.hand=drawN(5);
  G.enemyPlan=aiPlan();
  renderMatch();
}
function applyCard(side,c){
  const b=G.bars[side], R=(side==="home")?G.relics:EMPTY;
  let F=c.F||0,C=c.C||0,D=c.D||0,E=c.E||0;
  if(R.has("fogo")&&F)F+=2; if(R.has("maestro")&&C)C+=2; if(R.has("ladrao")&&D)D+=2; if(R.has("muralha_r")&&E)E+=2;
  if(R.has("embalo")&&F)F+=2;                                  // sinergia: chutes mais fortes
  if(R.has("corrente")&&c.sta){F+=1;C+=1;D+=1;E+=1;}           // sinergia: impacto turbina tudo
  b.F=Math.min(FMAXCAP,b.F+F); b.E=Math.min(FMAXCAP,b.E+E);
  b.C=Math.min(CD_CAP,b.C+C); b.D=Math.min(CD_CAP,b.D+D);
  if(c.sta){ let dmg=c.sta; if(R.has("garras"))dmg+=3; const o=opp(side); G.st.sta[o]=clamp(G.st.sta[o]-dmg,0,G.st.staMax[o]); }
}
function playCard(uid){
  if(G.busy||G.st.over)return;
  const i=G.hand.findIndex(c=>c.uid===uid); if(i<0)return;
  const c=G.hand[i]; if(c.cost>G.energy){toast("Energia insuficiente");return;}
  G.energy-=c.cost; applyCard("home",c); G.played.push(c); G.discard.push(c.id); G.hand.splice(i,1);
  renderMatch();
}
function armSuper(){
  if(G.busy||!G.superName)return;
  if(G.superArmed){G.superArmed=null;} else { if(G.fury<100){toast("Fúria carregando");return;} G.superArmed=G.superName; toast("⚡ "+superLabel(G.superName)+" armado!"); }
  renderMatch();
}
function applySuper(id){
  const b=G.bars.home;
  if(id==="bicuda") b.F+=20;
  else if(id==="casco"){ b.E+=G.barMax.home.E; b.C+=12; G.saves.home++; }
  else if(id==="voo"){ b.D+=20; b.C+=12; }
  else if(id==="mordida"){ G.st.sta.away=clamp(G.st.sta.away-28,0,G.st.staMax.away); }
}
function aiPlan(){
  const st=G.st, hasBall=st.possession==="away";
  if(G.oLive.length<5){ G.oLive=G.oLive.concat(shuffle(G.oDiscard.splice(0))); }
  const hand=G.oLive.splice(0,5).map(id=>CARDS[id]);
  G.oDiscard.push(...hand.map(c=>c.id));   // mesma disciplina de baralho do jogador
  const prio=c=> hasBall?((c.F||0)*2+(c.C||0)+(c.sta?1:0)) : ((c.D||0)*2+(c.E||0)+(c.sta?2:0));
  const sorted=hand.slice().sort((a,b)=>prio(b)-prio(a));
  let e=G.oEnergy, cards=[];
  for(const c of sorted){ if(c.cost<=e){ e-=c.cost; cards.push(c); } }
  const tot={F:0,C:0,D:0,E:0}; for(const c of cards){tot.F+=c.F||0;tot.C+=c.C||0;tot.D+=c.D||0;tot.E+=c.E||0;}
  let best="C",bv=-1; for(const k of ["F","C","D","E"]){if(tot[k]>bv){bv=tot[k];best=k;}}
  const willShoot=hasBall&&(st.bars?0:0,(G.bars.away.F+tot.F)>=G.barMax.away.F);
  const icon=willShoot?"🥅":{F:"🎯",C:"⚽",D:"🦵",E:"🛡️"}[best];
  return {cards,icon};
}
function endTurn(){
  if(G.busy||G.st.over)return; G.busy=true;
  if(G.superArmed){ applySuper(G.superArmed); G.fury=0; G.superArmed=null; G.shake=18; log("ko","⚡ SUPER: "+superLabel(G.superName)+"!"); }
  for(const c of (G.enemyPlan?G.enemyPlan.cards:[])) applyCard("away",c);
  if(G.enemyPlan&&G.enemyPlan.cards.length) log("sys",`${G.st.beasts.away.crest} ${nm("away")}: ${G.enemyPlan.cards.map(c=>c.ic).join(" ")}`);
  resolveTurn();
}
function resolveTurn(){
  const st=G.st; st._goalH=false; st._goalA=false;
  // 1) ROUBO: desarme do sem-bola > controle do com-bola
  let poss=st.possession, def=opp(poss);
  if(G.bars[def].D>G.bars[poss].C){ st.possession=def; G.bars[poss].C=0; G.bars[def].D=0; log("good",`✋ ${nm(def)} ROUBOU a bola!`); G.shake=10; }
  const p=st.possession, d=opp(p);
  // 2) FINALIZAÇÃO: barra cheia -> chute (defesa guardada bloqueia)
  if(G.bars[p].F>=G.barMax[p].F){
    G.bars[p].F=0;
    if(G.saves[d]>0){ G.saves[d]--; log("miss",`🧤 ${nm(d)} DEFENDEU o chute!`); }
    else { st.score[p]++; if(p==="home")st._goalH=true; else st._goalA=true;
      if(p==="home"&&G.relics.has("chuteira")) st.sta.home=clamp(st.sta.home+10,0,st.staMax.home);
      st.sta[d]=clamp(st.sta[d]-3,0,st.staMax[d]);
      log("goal",`⚽ GOOOL de ${nm(p)}! ${st.score.home} x ${st.score.away}`); G.shake=18; }
  }
  // 3) DEFESA: barra cheia -> guarda um chute (acumula)
  for(const s of ["home","away"]){ if(G.bars[s].E>=G.barMax[s].E){ G.bars[s].E=0; G.saves[s]++; if(s==="home")log("sys",`🛡️ Defesa pronta (guardadas: ${G.saves[s]})`); } }
  // 4) fôlego
  st.sta.home=clamp(st.sta.home-FATIGUE,0,st.staMax.home); st.sta.away=clamp(st.sta.away-FATIGUE,0,st.staMax.away);
  G.fury=Math.min(100,G.fury+22);
  renderMatch();
  st.turn++;
  const ended=checkEnd(st);
  setTimeout(()=>{ if(ended) showResult(st); else startTurn(); }, 750);
}

/* ------------------------------- HUD ------------------------------------- */
const KITC={home:"#3f86ad",away:"#e07a3a"};
function barRow(side,key,ic,name,desc,cur,max,active){
  const segs=14, fill=Math.round(clamp(cur/Math.max(1,max),0,1)*segs);
  let s=""; for(let i=0;i<segs;i++) s+=`<span class="seg ${i<fill?('on '+key):''}"></span>`;
  return `<div class="barbox ${active?'act':''}">
    <div class="barhd"><span class="bn ${key}">${ic} ${name}</span><span class="bv">${Math.round(cur)}/${max}</span></div>
    <div class="bar">${s}</div><div class="bardesc">${desc}</div></div>`;
}
function barsHTML(side){
  const b=G.bars[side],bm=G.barMax[side],has=G.st.possession===side;
  return barRow(side,"F","🎯","FINALIZAÇÃO","Encher para chutar ao gol",b.F,bm.F,has)
    + barRow(side,"C","⚽","CONTROLE DE BOLA","Mantém a posse da bola",b.C,CD_CAP,has)
    + barRow(side,"D","🦵","DESARME","Rouba a bola do oponente",b.D,CD_CAP,!has)
    + barRow(side,"E","🛡️","DEFESA",`Bloqueia o chute (guardadas: ${G.saves[side]})`,b.E,bm.E,!has);
}
function minimapHTML(){
  const ph=G.st.possession==="home"; let dots="";
  const home=[[18,30],[18,55],[30,42],[42,30],[42,55]], away=[[58,30],[58,55],[70,42],[82,30],[82,55]];
  home.forEach(([x,y])=>dots+=`<span class="mdot h" style="left:${x}%;top:${y}%"></span>`);
  away.forEach(([x,y])=>dots+=`<span class="mdot a" style="left:${x}%;top:${y}%"></span>`);
  dots+=`<span class="mdot gk h" style="left:8%;top:42%">GK</span><span class="mdot gk a" style="left:88%;top:42%">GK</span>`;
  dots+=`<span class="mball" style="left:${ph?34:62}%;top:42%"></span>`;
  return `<div class="minimap">${dots}</div>`;
}
function renderMatch(){
  const st=G.st, posH=st.possession==="home";
  const intentIcon=G.enemyPlan?G.enemyPlan.icon:"";
  app.innerHTML=`<div class="screen mt ${G.shake>0?'shk':''}">
    <div class="mtopbar">
      <div class="mtitle">⚔ ARENA DOS MITOS</div>
      <div class="micons"><span id="ic-book" title="Baralho">📖</span><span id="ic-gear" title="Sair">⚙️</span></div>
    </div>
    <div class="mtop frame">
      <div class="mteam">
        <div class="mnm"><span class="kit" style="background:${KITC.home}"></span>${shortName(st.beasts.home)} <span class="muted" style="font-size:9px">(você)</span></div>
        <div class="folegobar"><div class="ff h" style="width:${st.sta.home/st.staMax.home*100}%"></div><span>${Math.round(st.sta.home)}/${st.staMax.home}</span></div>
      </div>
      <div class="mscore"><div class="sc">${st.score.home} <span class="muted">:</span> ${st.score.away}</div>
        <div class="trn">TURNO ${Math.min(st.turn,TURNS)} / ${TURNS}${st.suddenDeath?" · MORTE SÚBITA":""}</div>${minimapHTML()}</div>
      <div class="mteam away">
        <div class="mnm">${shortName(st.beasts.away)}<span class="kit" style="background:${KITC.away};margin:0 0 0 5px"></span></div>
        <div class="folegobar"><div class="ff a" style="width:${st.sta.away/st.staMax.away*100}%"></div><span>${Math.round(st.sta.away)}/${st.staMax.away}</span></div>
      </div>
    </div>
    <div class="marena">
      <div class="mside">${barsHTML("home")}</div>
      <div class="mcenter">
        <div class="mchar">${posH?`<div class="possmark">⚽ POSSE DE BOLA</div>`:""}<div class="mbeast" style="background:${KITC.home}">${st.beasts.home.crest}</div>${posH?`<div class="ballfeet">⚽</div>`:""}</div>

  RUN={beast:b,atk:b.atk.slice(),def:b.def.slice(),relics:[],gold:7,act:0,lives:1,map:null,node:null,curNode:null,shop:null,history:[],_relicChoices:null,_relicThen:null}; }

// ----- MAPA randômico (3 trilhas, bifurcações sobe/desce, gerado toda vez) -----
function generateMap(act){
  const COLS=4, ROWS=3, nodes={}, edges={};
  const key=(c,r)=>c+"_"+r;
  const ensure=(c,r)=>{const k=key(c,r); if(!nodes[k])nodes[k]={c,r,id:k,type:null,done:false}; return k;};
  const addEdge=(c,r,nr)=>{const k=key(c,r),nk=key(c+1,nr); edges[k]=edges[k]||[]; if(!edges[k].includes(nk))edges[k].push(nk);};
  for(let p=0;p<6;p++){ let r=ri(0,ROWS-1); ensure(0,r);
    for(let c=0;c<COLS-1;c++){ const nr=clamp(r+pick([-1,0,1]),0,ROWS-1); ensure(c+1,nr); addEdge(c,r,nr); r=nr; } }
  nodes["boss"]={c:COLS,r:1,id:"boss",type:"boss",done:false};
  const byCol={}; for(const k in nodes){ const n=nodes[k]; if(n.type==="boss")continue; (byCol[n.c]=byCol[n.c]||[]).push(k); }
  for(const k in nodes){ if(nodes[k].c===COLS-1) edges[k]=["boss"]; }
  byCol[0].forEach(k=>nodes[k].type="match");
  for(let c=1;c<COLS;c++){ if(!byCol[c])continue; for(const k of byCol[c]){
    const x=Math.random(); nodes[k].type = x<0.42?"match" : x<0.70?"event" : (x<0.84&&c>=2)?"elite" : x<0.93?"shop":"match"; } }
  const midCol=Math.floor(COLS/2); if(byCol[midCol]) nodes[pick(byCol[midCol])].type="treasure";   // baú garantido no meio
  const all=Object.values(nodes);
  if(!all.some(n=>n.type==="shop")&&byCol[COLS-1]) nodes[pick(byCol[COLS-1])].type="shop";
  if(!all.some(n=>n.type==="event")&&byCol[1]) nodes[pick(byCol[1])].type="event";
  return {nodes,edges,COLS,ROWS,boss:"boss",startKeys:byCol[0]};
}
function startAct(){ RUN.map=generateMap(RUN.act); RUN.node=null; RUN.shop=null; screenMap(); }
function reachable(){ return RUN.node==null ? RUN.map.startKeys : (RUN.map.edges[RUN.node]||[]); }

function makeOpponent(node){
  const act=RUN.act, isBoss=node.type==="boss", isElite=node.type==="elite";
  let b = (isBoss&&act===ACTS-1)?BOSS : ROSTER[pick(Object.keys(ROSTER).filter(k=>k!==RUN.beast.key))];
  const beast={...b};
  // dificuldade: barra do jogador cresce com a dificuldade do inimigo (mais difícil encher/defender)
  const diff = 0.80 + act*0.15 + (isElite?0.12:0) + (isBoss?0.22:0);
  const oEnergy = (isBoss?2:isElite?1:0);
  const atk=b.atk.slice(), def=b.def.slice();
  const premA=["bicuda","voleio","caneta","visao"], premD=["muralha","botinha","solada"];
  const prem=(isBoss?2:isElite?1:0)+(act>=2?1:0);
  for(let i=0;i<prem;i++){ atk.push(pick(premA)); def.push(pick(premD)); }
  return {beast,atk,def,diff,oEnergy};
}
function completeNode(){ const n=RUN.curNode; if(n){n.done=true;RUN.node=n.id;RUN.curNode=null;} RUN._relicChoices=null; screenMap(); }
function enterNode(key){ const node=RUN.map.nodes[key]; if(node.done&&node.type!=="boss")return; RUN.curNode=node;
  if(node.type==="match"||node.type==="elite"||node.type==="boss") startNodeMatch(node);
  else if(node.type==="event") screenEvent();
  else if(node.type==="treasure") screenRelicReward(completeNode);
  else if(node.type==="shop"){ RUN.shop=null; screenShop(); }
}
function startNodeMatch(node){ const o=makeOpponent(node); RUN.opp=o;
  beginMatch(RUN.beast,o.beast,{pAtk:RUN.atk,pDef:RUN.def,oAtk:o.atk,oDef:o.def,relics:RUN.relics,diff:o.diff,oEnergy:o.oEnergy},onNodeMatchEnd); }
function onNodeMatchEnd(end){
  const win=end.winner==="home", node=RUN.curNode;
  RUN.history.push(win);
  if(!win){
    if(node.type!=="boss" && RUN.lives>0){ RUN.lives--; node.done=true; RUN.node=node.id; RUN.curNode=null; screenStageResult(end,"saved"); return; }
    screenStageResult(end,"out"); return;
  }
  if(node.type==="boss"){ RUN.gold+=15;
    if(RUN.act>=ACTS-1){ screenChampion(); return; }
    RUN.act++; RUN.node=null; screenStageResult(end,"act"); return;
  }
  RUN.gold += node.type==="elite"?10:6;
  node.done=true; RUN.node=node.id; RUN.curNode=null;
  if(node.type==="elite"){ screenRelicReward(screenMap); return; }   // elite dá relíquia
  screenStageResult(end,"win");
}

function screenRelicReward(then){
  RUN._relicThen=then||completeNode;
  if(!RUN._relicChoices) RUN._relicChoices=randomRelics(3,RUN.relics);
  const go=()=>{const f=RUN._relicThen;RUN._relicThen=null;RUN._relicChoices=null;f();};
  if(!RUN._relicChoices.length){ RUN.gold+=6; toast("Sem relíquias novas · +6🪙"); go(); return; }
  const cards=RUN._relicChoices.map(id=>`<div class="card-ui relicpick" data-id="${id}" style="cursor:pointer;text-align:center;border-color:var(--gold)">
    <div style="font-size:34px">${RELICS[id].ic}</div><div style="font-weight:800;font-size:13px">${RELICS[id].nm}</div>
    <div class="muted" style="font-size:11px;margin-top:4px">${RELICS[id].ds}</div></div>`).join("");
  app.innerHTML=`<div class="screen center"><h2>🎁 Baú de Relíquia</h2>
    <p class="muted" style="font-size:12px">Escolha 1 — efeito passivo pela corrida inteira.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px">${cards}</div>
    <button class="btn ghost full" id="skip" style="margin-top:10px">Pular (+4🪙)</button></div>`;
  app.querySelectorAll(".relicpick").forEach(el=>el.onclick=()=>{ RUN.relics.push(el.dataset.id); toast("Relíquia: "+RELICS[el.dataset.id].nm); go(); });
  $("#skip").onclick=()=>{ RUN.gold+=4; go(); };
}
function screenEvent(){
  if(!RUN._event) RUN._event=pick(EVENTS);
  const ev=RUN._event;
  const opts=ev.opts.map((o,i)=>{ const can=!o.need||RUN.gold>=o.need;
    return `<button class="btn full" data-opt="${i}" ${can?'':'disabled'} style="margin-top:8px;white-space:normal;text-align:left;height:auto;padding:10px 14px">${o.l}</button>`; }).join("");
  app.innerHTML=`<div class="screen"><h2>${ev.t}</h2><div class="card-ui"><p style="color:var(--txt)">${ev.d}</p></div>${opts}</div>`;
  app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{ const o=ev.opts[+b.dataset.opt]; if(o.need&&RUN.gold<o.need)return; o.fx(); RUN._event=null; completeNode(); });
}
function screenShop(){
  if(!RUN.shop){ const pool=shuffle(SHOP_POOL.slice()).slice(0,4); RUN.shop=pool.map(([id,c])=>({id,c,sold:false})); }
  const items=RUN.shop.map((it,idx)=>{
    if(it.sold) return "";
    const c=CARDS[it.id];
    const v=[]; if(c.F)v.push("🎯"+c.F); if(c.C)v.push("⚽"+c.C); if(c.D)v.push("🦵"+c.D); if(c.E)v.push("🛡️"+c.E);
    if(c.pierce)v.push("fura "+c.pierce); if(c.sta)v.push("💥"+c.sta); v.push(c.cost+"⚡");
    const can=RUN.gold>=it.c;
    return `<div class="card-ui" style="display:flex;align-items:center;gap:10px;padding:10px">
      <div style="font-size:24px">${c.ic}</div>
      <div style="flex:1"><div style="font-weight:800;font-size:13px">${c.nm} <span class="pill">${typeLabel(c.type)} · ${c.mode==="atk"?"ataque":"defesa"}</span></div>
        <div style="font-size:11px;color:#9cd6ff">${v.join(" · ")}</div><div style="font-size:11px;color:var(--muted)">${c.ds}</div></div>
      <button class="btn ${can?'primary':''}" data-buy="${idx}" ${can?"":"disabled"}>🪙 ${it.c}</button>
    </div>`;
  }).join("");
  app.innerHTML=`<div class="screen">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h2 style="margin:0">🛒 Mercado</h2><div class="gold" style="font-weight:800">🪙 ${RUN.gold}</div></div>
    <p class="muted" style="font-size:12px;margin-bottom:8px">Compre cartas para o seu baralho (vão para Ataque ou Defesa conforme o tipo).</p>
    <div style="display:flex;flex-direction:column;gap:8px">${items||'<p class="muted center">Tudo comprado.</p>'}</div>
    <div class="card-ui" style="margin-top:10px;font-size:12px">
      <b>Ataque</b> (${RUN.atk.length}): ${deckBreak(RUN.atk)}<br><b>Defesa</b> (${RUN.def.length}): ${deckBreak(RUN.def)}</div>
    <div class="controls"><button class="btn full" id="rem">🗑️ Enxugar baralho (🪙3)</button>
      <button class="btn primary full" id="back">✔ Pronto</button></div>
  </div>`;
  app.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{
    const it=RUN.shop[+b.dataset.buy]; if(it.sold||RUN.gold<it.c)return;
    RUN.gold-=it.c; (CARDS[it.id].mode==="atk"?RUN.atk:RUN.def).push(it.id); it.sold=true;
    toast(CARDS[it.id].nm+" comprada!"); screenShop();
  });
  $("#rem").onclick=()=>{ if(RUN.gold<3){toast("Ouro insuficiente");return;} screenRemove(); };
  $("#back").onclick=completeNode;
}
function screenRemove(){
  const mk=(ids,which)=>ids.map((id,i)=>{const c=CARDS[id];
    return `<button class="btn" style="padding:7px 9px;font-size:12px" data-rm="${which}:${i}">${c.ic} ${c.nm}</button>`;}).join(" ");
  app.innerHTML=`<div class="screen">
    <h2>🗑️ Enxugar baralho <span class="muted" style="font-size:13px">(🪙3 · remove 1)</span></h2>
    <p class="muted" style="font-size:12px">Tirar cartas fracas deixa as boas saírem mais. Toque na carta a remover.</p>
    <div class="card-ui" style="margin-top:8px"><div style="font-weight:700;font-size:12px;margin-bottom:6px">Ataque</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${mk(RUN.atk,"atk")}</div></div>
    <div class="card-ui" style="margin-top:8px"><div style="font-weight:700;font-size:12px;margin-bottom:6px">Defesa</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${mk(RUN.def,"def")}</div></div>
    <button class="btn ghost full" id="back" style="margin-top:10px">← Voltar</button>
  </div>`;
  app.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{
    const [w,i]=b.dataset.rm.split(":"); const arr=w==="atk"?RUN.atk:RUN.def;
    if(arr.length<=6){toast("Baralho no mínimo");return;}
    arr.splice(+i,1); RUN.gold-=3; toast("Carta removida"); screenShop();
  });
  $("#back").onclick=screenShop;
}
function screenStageResult(end,mode){   // mode: "win" | "act" | "out" | "saved"
  const reason={KO:"por nocaute de fôlego 💀",TIME:"no placar",GOLDEN:"com gol de ouro ✨",GOLEADA:"por goleada 🔥"}[end.reason];
  const out=mode==="out", act=mode==="act", saved=mode==="saved";
  const icon=out?"💀":act?"👑":saved?"🩹":"✅";
  const title=out?"Eliminado":act?"ATO VENCIDO!":saved?"Repescagem!":"Vitória!";
  const sub=out
    ? `<p class="muted">A corrida termina aqui. Caminho: ${RUN.history.map(w=>w?"🟢":"🔴").join(" ")}</p>`
    : saved
      ? `<p class="gold">Você caiu, mas uma <b>vida extra</b> te salvou e te leva adiante! (vidas restantes: ${RUN.lives})</p>`
    : act
      ? `<p class="gold">Você superou a final do ${(ACT_NAME[RUN.act-1]||"Ato").split("—")[0].trim()}! +🪙 ouro. Um novo mapa o aguarda.</p>`
      : `<p class="gold">+🪙 ouro · siga pelo mapa.</p>`;
  app.innerHTML=`<div class="screen center" style="padding-top:6vh">
    <div style="font-size:56px">${icon}</div>
    <h1 class="${out?'bad':saved?'good':'gold'}">${title}</h1>
    <p>${G.st.score.home} <span class="muted">x</span> ${G.st.score.away} · ${reason}</p>
    ${sub}
    <button class="btn primary full" id="next" style="margin-top:16px;max-width:300px">${out?"↻ Nova campanha":act?"➡ Próximo Ato":"Continuar →"}</button>
  </div>`;
  $("#next").onclick=out?screenTitle:act?startAct:screenMap;
}
function screenChampion(){
  app.innerHTML=`<div class="screen center" style="padding-top:7vh">
    <div style="font-size:70px">🏆</div><h1 class="gold">CAMPEÃ DOS MIL ANOS!</h1>
    <p style="max-width:440px;margin:6px auto">${shortName(RUN.beast)} derrotou a Serpente Imortal e reinará pela próxima era.</p>
    <div class="card-ui" style="display:inline-block;margin-top:12px"><p style="font-weight:800">Caminho perfeito: ${RUN.history.map(w=>w?"🟢":"🔴").join(" ")}</p></div>
    <button class="btn primary full" id="again" style="margin-top:16px;max-width:300px">↻ Nova campanha</button>
  </div>`;
  $("#again").onclick=screenTitle;
}

if(typeof module!=="undefined"&&module.exports){
  module.exports={freshMatch,checkEnd,beginMatch,startTurn,playCard,endTurn,applyCard,aiPlan,resolveTurn,drawHand,
    CARDS,BEASTS,STA_MAX,DECK_ATK,DECK_DEF,
    ROSTER,BOSS,RELICS,RELIC_IDS,EVENTS,ACTS,newRun,makeOpponent,generateMap,getRun:()=>RUN,setRun:r=>RUN=r,
    getG:()=>G,setG:g=>G=g,
    set:o=>{if(o.IMPACT_DMG!=null){IMPACT_DMG=o.IMPACT_DMG;CARDS.pancada.sta=o.IMPACT_DMG;CARDS.carrinho.sta=o.IMPACT_DMG;}
      if(o.FATIGUE!=null)FATIGUE=o.FATIGUE; if(o.TURNS!=null)TURNS=o.TURNS;}};
}
if(typeof document!=="undefined") screenTitle();
</script>
</body>
