<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>World Cup Beasts — Duelo de Cartas (Parte 1)</title>
<style>
  :root{
    --bg:#0a0e1a; --panel:#131a2e; --panel2:#1b2540; --line:#2a3556;
    --txt:#e8edf7; --muted:#8a96b8; --gold:#f5c451; --good:#4fd18b; --bad:#ff6b6b;
    --home:#4fb0d1; --away:#d14f4f;
    --shadow:0 8px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:radial-gradient(120% 80% at 50% 0%,#161d33,#070a14);
    color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow-x:hidden}
  body{display:flex;justify-content:center}
  #app{width:100%;max-width:780px;min-height:100vh;padding:12px 12px 30px;position:relative}
  h1,h2,h3{margin:0 0 .35em;font-weight:800} h1{font-size:26px} h2{font-size:20px}
  p{line-height:1.5;color:var(--muted);margin:.3em 0}
  .center{text-align:center} .muted{color:var(--muted)} .gold{color:var(--gold)}
  .good{color:var(--good)} .bad{color:var(--bad)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(180deg,#2b3a63,#202c4e);color:var(--txt);border:1px solid var(--line);
    padding:11px 16px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
    transition:transform .06s,filter .15s;user-select:none}
  .btn:hover{filter:brightness(1.12)} .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(180deg,#f5c451,#e0a72f);color:#241a00;border-color:#caa033}
  .btn.ghost{background:transparent} .btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
  .btn.full{width:100%}
  .card-ui{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}

  /* scoreboard */
  .scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:6px}
  .team{display:flex;flex-direction:column;gap:4px}.team.away{align-items:flex-end}
  .team .nm{font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px}
  .stabar{height:13px;border-radius:8px;background:#2a1414;overflow:hidden;border:1px solid var(--line);width:100%}
  .stabar>div{height:100%;transition:width .5s}
  .team .stabar>div{background:linear-gradient(90deg,#2e9c66,var(--good))}
  .scoremid{text-align:center}.scoremid .sc{font-size:28px;font-weight:900}.scoremid .turn{font-size:12px;color:var(--muted)}
  .possess{display:flex;justify-content:center;gap:8px;margin:4px 0;font-size:12px;font-weight:700}
  .possess .on{color:var(--gold)}

  #pitch{width:100%;display:block;border-radius:12px;border:2px solid #0c4a20;
    box-shadow:inset 0 0 40px rgba(0,0,0,.5);margin-bottom:8px;background:#1a6b32}

  /* zona de jogada e mão */
  .zonelabel{font-size:12px;color:var(--muted);margin:2px 2px 5px;display:flex;justify-content:space-between}
  .playzone{min-height:96px;border:2px dashed var(--line);border-radius:12px;padding:7px;
    display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:#0e142480}
  .playzone.empty::before{content:"Toque nas cartas abaixo para montar sua jogada";
    color:#5b6688;font-size:12px;margin:auto}
  .hand{display:flex;gap:7px;overflow-x:auto;padding:8px 2px 2px;scrollbar-width:thin}
  .pcard{flex:0 0 auto;width:88px;min-height:118px;border-radius:11px;border:2px solid var(--line);
    background:linear-gradient(180deg,#1d2742,#161e34);padding:7px 6px;cursor:pointer;position:relative;
    transition:transform .1s,border-color .15s;user-select:none}
  .pcard:hover{transform:translateY(-3px)}
  .pcard .ic{font-size:26px;text-align:center;line-height:1.1}
  .pcard .nm{font-size:11px;font-weight:800;text-align:center;margin-top:2px}
  .pcard .ds{font-size:9px;color:var(--muted);line-height:1.25;margin-top:4px}
  .pcard .tag{position:absolute;top:5px;right:5px;font-size:8px;font-weight:800;padding:1px 5px;border-radius:6px}
  .pcard.finish{border-color:#c9803a}.pcard.finish .tag{background:#5a3a1d;color:#ffc890}
  .pcard.support .tag{background:#1d3a4a;color:#9cd6ff}
  .pcard.impact{border-color:#a8403a}.pcard.impact .tag{background:#4a1d1d;color:#ff9c9c}
  .pcard.block .tag,.pcard.tackle .tag,.pcard.pressure .tag{background:#1d4a2c;color:#9cffb6}
  .pcard.mini{width:62px;min-height:84px}
  .pcard.mini .ic{font-size:20px}.pcard.mini .nm{font-size:9px}.pcard.mini .ds{display:none}
  .pcard.disabled{opacity:.35;pointer-events:none;filter:grayscale(.6)}

  #log{height:74px;overflow-y:auto;background:#0c1120;border:1px solid var(--line);border-radius:12px;
    padding:8px;font-size:13px;line-height:1.5;margin-top:8px}
  #log .e{margin-bottom:2px}
  #log .goal{color:var(--gold);font-weight:800}#log .ko{color:var(--bad);font-weight:800}
  #log .good{color:var(--good)}#log .sys{color:#c0a0ff}#log .miss{color:#ffb07a}

  #banner{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(60% 60% at 50% 50%,rgba(10,14,26,.15),rgba(5,8,15,.9));pointer-events:none}
  #banner .big{text-align:center;animation:zoomin 1s ease both}
  #banner .t1{font-size:13px;letter-spacing:4px;color:var(--muted);font-weight:800}
  #banner .t2{font-size:38px;font-weight:900;text-shadow:0 4px 24px rgba(0,0,0,.8)}
  @keyframes zoomin{0%{transform:scale(2);opacity:0;filter:blur(5px)}40%{transform:scale(1);opacity:1;filter:blur(0)}100%{opacity:.92}}
  .toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:#000d;border:1px solid var(--gold);
    color:var(--gold);padding:8px 15px;border-radius:10px;font-weight:800;z-index:99;animation:fade .25s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .screen{animation:fade .3s ease}
  .controls{display:flex;gap:8px;margin-top:8px}
  @media(max-width:520px){#pitch{height:auto} .pcard{width:80px} }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ===========================================================================
   WORLD CUP BEASTS — Parte 1: DUELO DE CARTAS (com campo animado)
   Posse define ataque/defesa. A cada turno você monta uma JOGADA com cartas:
   no máximo 1 FINALIZAÇÃO por turno; o resto empilha, salvo regra própria.
   A jogada é animada no campo (bola + personagens se movendo). STA = vida.
   Vitória: placar nos 9 turnos (empate->morte súbita) · 5 gols de diferença ·
   nocaute por STA (vale na morte súbita).
   Lógica de resolução é pura (testável headless), separada do render/animação.
   ========================================================================= */
const $=(s,el=document)=>el.querySelector(s);
const app=$("#app");
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[ri(0,a.length-1)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ------------------------------- AJUSTES --------------------------------- */
const TURNS=9, STA_MAX=100, MERCY=5, HAND=5, MAXPLAY=3;  // até 3 cartas por jogada
let IMPACT_DMG=15;   // dano de STA bruto por impacto (reduzido por defesa/drible no cálculo)
let FATIGUE=2;       // STA perdida por time a cada turno (cansaço)
let GOAL_TH=2.7;     // ataque - defesa necessário p/ a finalização virar gol

/* ------------------------------- CARTAS ---------------------------------- */
// type: support/finish/impact (ataque) · block/tackle/pressure/impact (defesa)
// REGRA GLOBAL: máx. 1 carta type==='finish' por turno. Demais empilham.
const CARDS={
  // ---- ataque ----
  passe   :{id:"passe",mode:"atk",type:"support",nm:"Tabela",ic:"🅿️",q:2,keep:true,ds:"+2 qualidade. Jogada segura."},
  drible  :{id:"drible",mode:"atk",type:"support",nm:"Drible",ic:"👟",q:3,risk:.08,ds:"+3 qualidade; leve risco."},
  lancamento:{id:"lancamento",mode:"atk",type:"support",nm:"Lançamento",ic:"⚡",q:4,risk:.18,ds:"+4 qualidade; risco de perder a posse."},
  visao   :{id:"visao",mode:"atk",type:"support",nm:"Visão de Jogo",ic:"🧠",q:1,prec:4,ds:"+1 qualidade e +4 precisão na finalização."},
  finaliza:{id:"finaliza",mode:"atk",type:"finish",nm:"Finalização",ic:"⚽",power:6,prec:6,ds:"Chute ao gol equilibrado."},
  colocado:{id:"colocado",mode:"atk",type:"finish",nm:"Chute Colocado",ic:"🪄",power:4,prec:10,ds:"Muita precisão, pouca força."},
  bicuda  :{id:"bicuda",mode:"atk",type:"finish",nm:"Bicuda",ic:"💥",power:10,prec:3,impact:1,ds:"Força bruta: fere quem está no caminho (💥). Pouca precisão."},
  pancada :{id:"pancada",mode:"atk",type:"impact",nm:"Pancada",ic:"💢",sta:IMPACT_DMG,ds:"Acerta a bola num adversário: dano de STA. NÃO é finalização."},
  // ---- defesa ----
  defesa  :{id:"defesa",mode:"def",type:"block",nm:"Defesa",ic:"🧤",d:5,ds:"+5 defesa contra o gol."},
  bloqueio:{id:"bloqueio",mode:"def",type:"block",nm:"Bloqueio",ic:"🧱",d:3,ds:"+3 defesa; corta a jogada."},
  desarme :{id:"desarme",mode:"def",type:"tackle",nm:"Desarme",ic:"✋",steal:6,ds:"Tenta roubar a bola."},
  marcacao:{id:"marcacao",mode:"def",type:"pressure",nm:"Marcação",ic:"😖",d:1,force:.45,ds:"Pressiona: chance de forçar o erro."},
  carrinho:{id:"carrinho",mode:"def",type:"impact",nm:"Carrinho",ic:"💢",sta:IMPACT_DMG,steal:3,risk:.2,ds:"Entrada dura: dano de STA + chance de roubo; risco de vacilo."},
};
const ATK_DECK=[["passe",3],["drible",2],["lancamento",2],["visao",2],["finaliza",2],["colocado",1],["bicuda",1],["pancada",3]];
const DEF_DECK=[["defesa",3],["bloqueio",2],["desarme",3],["marcacao",2],["carrinho",2]];
function buildDeck(spec){ const d=[]; for(const [id,n] of spec) for(let i=0;i<n;i++) d.push(id); return d; }
function drawHand(mode){ const deck=shuffle(buildDeck(mode==="atk"?ATK_DECK:DEF_DECK));
  return deck.slice(0,HAND).map(id=>({...CARDS[id],uid:Math.random().toString(36).slice(2,8)})); }

/* ------------------------------- FERAS ----------------------------------- */
const BEASTS={
  tatu:{key:"tatu",name:"Couraça, o Tatu de Guerra",crest:"🛡️",color:"#7a6a4a",ATK:5,DEF:5,TEC:4},
  mino:{key:"mino",name:"Górtax, Minotauro de Ônix",crest:"🐂",color:"#2e3340",ATK:5,DEF:5,TEC:4},
};

/* ===================== LÓGICA PURA (testável headless) ==================== */
function freshState(home,away){
  return {beasts:{home,away},turn:1,possession:"home",score:{home:0,away:0},
    sta:{home:STA_MAX,away:STA_MAX},momentum:{home:0,away:0},
    suddenDeath:false,over:false,winner:null,reason:null};
}
// IA escolhe até MAXPLAY cartas do lado que o jogador não controla (respeita 1 finalização)
function aiPick(hand,mode){
  const prio=mode==="atk"
    ? {finaliza:6,colocado:6,bicuda:5,passe:4,drible:4,lancamento:3,visao:4,pancada:3}
    : {desarme:5,defesa:5,bloqueio:4,marcacao:4,carrinho:4};
  const sorted=hand.slice().sort((a,b)=>(prio[b.id]||0)-(prio[a.id]||0));
  const play=[]; let fin=false;
  for(const c of sorted){ if(play.length>=MAXPLAY) break;
    if(c.type==="finish"){ if(fin)continue; fin=true; } play.push(c); }
  return play;
}
// resolução SIMÉTRICA: o atacante (quem tem a posse) joga atkCards; o defensor joga defCards.
function resolveContest(st,atkCards,defCards){
  const aSide=st.possession, dSide=aSide==="home"?"away":"home";
  const A=st.beasts[aSide], D=st.beasts[dSide];
  const sup=atkCards.filter(c=>c.type==="support");
  const fin=atkCards.find(c=>c.type==="finish");
  const aImp=atkCards.filter(c=>c.type==="impact");
  const block=defCards.filter(c=>c.type==="block");
  const tackle=defCards.filter(c=>c.type==="tackle");
  const press=defCards.filter(c=>c.type==="pressure");
  const dImp=defCards.filter(c=>c.type==="impact");
  const Q=sup.reduce((s,c)=>s+(c.q||0),0);
  const precB=sup.reduce((s,c)=>s+(c.prec||0),0);
  const Dval=block.reduce((s,c)=>s+(c.d||0),0)+press.reduce((s,c)=>s+(c.d||0),0);
  const steal=tackle.reduce((s,c)=>s+(c.steal||0),0)+dImp.reduce((s,c)=>s+(c.steal||0),0);
  let force=0; for(const c of press) force=Math.max(force,c.force||0);
  const mom=st.momentum[aSide]||0;
  const rawDef=aImp.reduce((s,c)=>s+(c.sta||0),0)+((fin&&fin.impact)?IMPACT_DMG:0);
  let defVacilo=false; for(const c of dImp) if(c.risk&&Math.random()<c.risk) defVacilo=true;
  const rawAtk=defVacilo?0:dImp.reduce((s,c)=>s+(c.sta||0),0);
  let atkRisk=false; for(const c of sup) if(c.risk&&Math.random()<c.risk) atkRisk=true;

  let outcome;
  const atkControl=Q+mom+A.TEC*0.35+(fin?2:0)+rnd(0,3);
  if(!defVacilo&&steal>0&&steal+D.TEC*0.3>=atkControl) outcome="TURNOVER";
  else if(!defVacilo&&force>0&&Math.random()<force&&(!fin||atkRisk)) outcome="FORCE";
  else if(fin){
    const attackScore=fin.power+(Q+mom)*0.5+(fin.prec+precB)*0.35+A.ATK*0.4+rnd(0,4);
    const defenseScore=Dval*0.8+D.DEF*0.6+rnd(0,4);
    outcome=(attackScore-defenseScore)>=GOAL_TH?"GOAL":"MISS";
  } else outcome= atkRisk?"LOSEBALL":"BUILD";

  // embalo: construir sem finalizar acumula; qualquer outra coisa zera
  st.momentum[aSide]= outcome==="BUILD"?Math.min(12,mom+Q):0;

  // impacto tem CONTRAJOGO: só conecta se o ataque chegou (não em roubo/erro),
  // e é reduzido pela defesa do alvo (bloqueios) e pela habilidade do atacante (drible/passe)
  const connect=(outcome==="GOAL"||outcome==="MISS"||outcome==="BUILD");
  const staToDef=connect?Math.round(rawDef*clamp(1-Dval*0.05,0.35,1)):0;
  const staToAtk=Math.round(rawAtk*clamp(1-Q*0.05,0.4,1));
  const staD={home:0,away:0}; staD[dSide]-=staToDef; staD[aSide]-=staToAtk;
  if(outcome==="GOAL") staD[dSide]-=3;
  const r={goalHome:0,goalAway:0,staHome:staD.home,staAway:staD.away,possession:dSide,type:"",text:""};
  const hA=aSide==="home";
  if(outcome==="GOAL"){ hA?r.goalHome=1:r.goalAway=1; r.type=hA?"GOAL":"CONCEDE"; r.text=hA?"GOOOL!":"Sofreu um gol... ⚽"; }
  else if(outcome==="MISS"){ r.type=hA?"MISS":"DEFEND"; r.text=hA?pick(["Na trave! 😤","O goleiro defendeu! 🧤","Pra fora! 😩"]):"🧤 Defendeu e recuperou a bola!"; }
  else if(outcome==="TURNOVER"){ r.type=hA?"LOSE":"STEAL"; r.text=hA?"Perdeu a bola no desarme. ✋":"✋ Roubou a bola!"; }
  else if(outcome==="FORCE"){ r.type=hA?"LOSE":"FORCE"; r.text=hA?"A pressão te fez errar. 😖":"😖 Forçou o erro do rival!"; }
  else if(outcome==="LOSEBALL"){ r.type=hA?"LOSE":"FORCE"; r.text=hA?"Perdeu a posse na tentativa. 🔄":"Rival se atrapalhou — bola recuperada!"; }
  else { r.possession=aSide; r.type=hA?"KEEP":"BEATEN"; r.text=hA?"Construção paciente — mantém a posse e ganha embalo. 👟":"O adversário mantém a posse e o embalo."; }

  const dmgAway=(dSide==="away"?staToDef:0)+(aSide==="away"?staToAtk:0);
  const dmgHome=(dSide==="home"?staToDef:0)+(aSide==="home"?staToAtk:0);
  if(dmgAway>0) r.text+=` 💥 -${dmgAway} no Górtax`;
  if(dmgHome>0) r.text+=` 💢 você -${dmgHome}`;
  return r;
}
function applyTurn(st,res){
  st.score.home+=res.goalHome; st.score.away+=res.goalAway;
  st.sta.home=clamp(st.sta.home+res.staHome-FATIGUE,0,STA_MAX);
  st.sta.away=clamp(st.sta.away+res.staAway-FATIGUE,0,STA_MAX);
  st.possession=res.possession; st.turn++;
}
function finish(st,w,reason){ st.over=true; st.winner=w; st.reason=reason; return {over:true,winner:w,reason}; }
function checkEnd(st,res){
  if(st.sta.away<=0) return finish(st,"home","KO");
  if(st.sta.home<=0) return finish(st,"away","KO");
  const diff=st.score.home-st.score.away;
  if(diff>=MERCY) return finish(st,"home","GOLEADA");
  if(diff<=-MERCY) return finish(st,"away","GOLEADA");
  if(st.suddenDeath){
    if(res.goalHome) return finish(st,"home","GOLDEN");
    if(res.goalAway) return finish(st,"away","GOLDEN");
    return {over:false};
  }
  if(st.turn>TURNS){
    if(st.score.home!==st.score.away) return finish(st,st.score.home>st.score.away?"home":"away","TIME");
    st.suddenDeath=true;
  }
  return {over:false};
}

/* ============================== JOGO (UI) ================================ */
let G=null;
const FW=620,FH=300,MID=310;
const GMY1=110,GMY2=190;

function startGame(){
  const st=freshState({...BEASTS.tatu},{...BEASTS.mino});
  G={st,ctx:null,canvas:null,busy:false,play:[],hand:[],
     players:[],ball:{x:MID,y:FH/2},vfx:[],shake:0,anim:null,raf:0,animPoss:"home"};
  setupPlayers();
  renderMatch();
  log("sys",`🏟️ ${st.beasts.home.crest} ${st.beasts.home.name} <span class="muted">vs</span> ${st.beasts.away.crest} ${st.beasts.away.name}`);
  log("sys","Monte sua jogada com cartas: só 1 FINALIZAÇÃO por turno; o resto empilha. STA é vida — zerou, é nocaute.");
  loopStart();
  nextTurn();
}
function setupPlayers(){
  G.players=[
    {team:"home",role:"GK",ax:40,ay:150,x:40,y:150},
    {team:"home",role:"D",ax:160,ay:95,x:160,y:95},
    {team:"home",role:"D",ax:160,ay:205,x:160,y:205},
    {team:"home",role:"F",star:true,ax:285,ay:150,x:285,y:150},
    {team:"away",role:"GK",ax:580,ay:150,x:580,y:150},
    {team:"away",role:"D",ax:460,ay:95,x:460,y:95},
    {team:"away",role:"D",ax:460,ay:205,x:460,y:205},
    {team:"away",role:"F",star:true,ax:335,ay:150,x:335,y:150},
  ];
  G.ball.x=MID; G.ball.y=FH/2;
}

function nextTurn(){
  if(G.st.over) return;
  G.busy=true; G.play=[]; renderHud();
  banner(()=>{ G.hand=drawHand(G.st.possession==="home"?"atk":"def"); G.busy=false; renderHandArea(); });
}

function executePlay(){
  if(G.busy||G.st.over) return;
  const atk=G.st.possession==="home";
  if(G.play.length===0){ toast(atk?"Jogue ao menos uma carta":"Jogue ao menos uma carta de defesa"); return; }
  G.busy=true;
  // a IA joga o outro lado a partir de uma mão sorteada
  const aiMode=atk?"def":"atk";
  const aiPlay=aiPick(drawHand(aiMode),aiMode);
  const atkCards=atk?G.play:aiPlay;
  const defCards=atk?aiPlay:G.play;
  const res=resolveContest(G.st,atkCards,defCards);
  log("sys",`${G.st.beasts.away.crest} Górtax: ${aiPlay.length?aiPlay.map(c=>c.ic).join(" "):"—"}`);
  const anim=buildAnim(atkCards,defCards,res,G.st);
  runAnim(anim,()=>{
    // VFX final + texto
    const cls=res.goalHome?"goal":res.goalAway?"miss":(res.type==="STEAL"||res.type==="DEFEND"||res.type==="FORCE"||res.type==="KEEP")?"good":res.type==="MISS"?"miss":"";
    log(cls,`T${Math.min(G.st.turn,TURNS)}: ${res.text}`);
    applyTurn(G.st,res); renderHud();
    const end=checkEnd(G.st,res);
    setTimeout(()=>{ if(end.over) showResult(end); else nextTurn(); }, 650);
  });
}

/* ------------------------- ANIMAÇÃO (eventos) ---------------------------- */
function buildAnim(atkCards,defCards,res,st){
  const atk=st.possession==="home";
  const wps=[];
  if(atk){
    const sup=atkCards.filter(c=>c.type==="support");
    const fin=atkCards.find(c=>c.type==="finish");
    const imp=atkCards.filter(c=>c.type==="impact");
    let start={x:285,y:150};
    wps.push({x:start.x,y:start.y,dur:.25,poss:"home"});
    // passes/dribles avançam a bola
    sup.forEach((c,i)=>wps.push({x:330+Math.min(i,3)*55,y:150+(i%2?-48:48),dur:.4,poss:"home",fx:"pass"}));
    // impactos: bola dispara num zagueiro adversário e volta
    imp.forEach(()=>{ const d=pick(G.players.filter(p=>p.team==="away"&&p.role==="D"));
      wps.push({x:d.x,y:d.y,dur:.3,poss:"home",fx:"impact",tgt:"away"});
      wps.push({x:420,y:150,dur:.25,poss:"home"}); });
    if(fin){
      if(fin.impact){ const d=pick(G.players.filter(p=>p.team==="away"&&p.role==="D"));
        wps.push({x:d.x,y:d.y,dur:.22,poss:"home",fx:"impact",tgt:"away"}); }
      wps.push({x:600,y:clamp(150+rnd(-30,30),GMY1+6,GMY2-6),dur:.28,poss:"home",fx:res.goalHome?"goal":"save"});
    } else {
      wps.push({x:res.type==="LOSE"?MID:380,y:150,dur:.35,poss:res.type==="LOSE"?"away":"home",fx:res.type==="LOSE"?"turnover":"keep"});
    }
  } else {
    const imp=defCards.filter(c=>c.type==="impact");
    wps.push({x:335,y:150,dur:.25,poss:"away"});
    wps.push({x:200,y:150+rnd(-30,30),dur:.5,poss:"away",fx:"advance"});
    imp.forEach(()=>{ const s=G.players.find(p=>p.team==="away"&&p.role==="F");
      wps.push({x:s.x,y:s.y,dur:.25,poss:"away",fx:"impact",tgt:"awayStar"});
      wps.push({x:200,y:150,dur:.2,poss:"away"}); });
    if(res.possession==="home"&&!res.goalAway){
      wps.push({x:150,y:150,dur:.25,poss:"away",fx:"contest"});
      wps.push({x:300,y:150,dur:.4,poss:"home",fx:"recover"});
    } else if(res.goalAway){
      wps.push({x:18,y:clamp(150+rnd(-25,25),GMY1+6,GMY2-6),dur:.3,poss:"away",fx:"concede"});
    } else {
      wps.push({x:150,y:150,dur:.3,poss:"away",fx:"hold"});
    }
  }
  return {wps};
}
function runAnim(anim,cb){
  G.anim={wps:anim.wps,i:0,t:0,from:{...G.ball},cb,done:false};
  // primeiro waypoint define posse visual
  if(anim.wps[0]) G.animPoss=anim.wps[0].poss;
}
function stepAnim(dt){
  const a=G.anim; if(!a||a.done) return;
  const wp=a.wps[a.i]; if(!wp){ a.done=true; const cb=a.cb; G.anim=null; cb&&cb(); return; }
  a.t+=dt/wp.dur;
  const k=clamp(a.t,0,1), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; // easeInOut
  G.ball.x=a.from.x+(wp.x-a.from.x)*e;
  G.ball.y=a.from.y+(wp.y-a.from.y)*e;
  G.animPoss=wp.poss;
  if(a.t>=1){
    G.ball.x=wp.x; G.ball.y=wp.y;
    triggerFx(wp);
    a.from={x:wp.x,y:wp.y}; a.i++; a.t=0;
  }
}
function triggerFx(wp){
  if(!wp.fx) return;
  if(wp.fx==="impact"){ G.shake=10; burst(G.ball.x,G.ball.y,"#ff7b2d",16);
    const t=G.players.find(p=> wp.tgt==="awayStar"?(p.team==="away"&&p.role==="F"):(Math.abs(p.x-wp.x)<6&&Math.abs(p.y-wp.y)<6));
    if(t){ const dx=t.x<G.ball.x?-1:1; t.x+=14*dx; t.flinch=0.5; } }
  else if(wp.fx==="goal"){ G.shake=16; burst(600,wp.y,"#f5c451",30); }
  else if(wp.fx==="save"){ G.shake=6; burst(595,wp.y,"#8fd6ff",14); }
  else if(wp.fx==="concede"){ G.shake=14; burst(18,wp.y,"#ff6b6b",24); }
  else if(wp.fx==="recover"||wp.fx==="contest"){ burst(G.ball.x,G.ball.y,"#9cffb6",10); }
}

/* ------------------------------- CANVAS ---------------------------------- */
function loopStart(){ const f=()=>{ drawFrame(); G.raf=requestAnimationFrame(f); }; G.raf=requestAnimationFrame(f); }
function burst(x,y,c,n){ for(let i=0;i<n;i++){ const a=Math.random()*7,s=rnd(40,180);
  G.vfx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.7,max:.7,c,sz:rnd(2,5)}); } }
let LAST=0;
function drawFrame(ts){
  const ctx=G.ctx; if(!ctx)return;
  const now=(ts||performance.now())/1000; let dt=now-(LAST||now); LAST=now; dt=Math.min(dt,.05);
  if(G.anim) stepAnim(dt);
  steerPlayers(dt);
  // vfx
  for(let i=G.vfx.length-1;i>=0;i--){ const v=G.vfx[i]; v.x+=v.vx*dt;v.y+=v.vy*dt;v.vx*=0.92;v.vy*=0.92;v.life-=dt; if(v.life<=0)G.vfx.splice(i,1); }
  for(const p of G.players) if(p.flinch>0) p.flinch-=dt;
  drawPitch(ctx);
}
function steerPlayers(dt){
  const b=G.ball, poss=G.animPoss;
  const nearest={home:null,away:null};
  for(const t of ["home","away"]){ let bd=1e9; for(const p of G.players){ if(p.team!==t||p.role==="GK")continue;
    const d=Math.hypot(p.x-b.x,p.y-b.y); if(d<bd){bd=d;nearest[t]=p;} } }
  for(const p of G.players){
    let tx,ty;
    if(p.role==="GK"){ tx=p.ax; ty=clamp(b.y,GMY1+8,GMY2-8); }
    else if(p.team===poss){ if(p===nearest[p.team]){ tx=b.x-(p.team==="home"?16:-16); ty=b.y; }
      else { tx=p.ax+(p.team==="home"?40:-40); ty=p.ay*0.6+b.y*0.4; } }
    else { if(p===nearest[p.team]){ tx=(p.x+b.x)/2; ty=(p.y+b.y)/2; }
      else { tx=p.ax-(p.team==="home"?15:-15); ty=p.ay*0.55+b.y*0.45; } }
    const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy)||1, spd=150;
    if(d>2){ p.x+=dx/d*Math.min(spd*dt,d); p.y+=dy/d*Math.min(spd*dt,d); }
    p.x=clamp(p.x,14,FW-14); p.y=clamp(p.y,16,FH-16);
  }
}
function drawPitch(ctx){
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,FW,FH);
  ctx.save();
  if(G.shake>0.3){ ctx.translate(rnd(-G.shake,G.shake),rnd(-G.shake,G.shake)); G.shake*=0.86; }
  for(let i=0;i<8;i++){ ctx.fillStyle=i%2?"#176028":"#1a6b32"; ctx.fillRect(i*FW/8,0,FW/8+1,FH); }
  ctx.strokeStyle="rgba(255,255,255,.4)"; ctx.lineWidth=2;
  ctx.strokeRect(8,8,FW-16,FH-16);
  ctx.beginPath(); ctx.moveTo(MID,8); ctx.lineTo(MID,FH-8); ctx.stroke();
  ctx.beginPath(); ctx.arc(MID,FH/2,34,0,7); ctx.stroke();
  ctx.strokeRect(8,GMY1-14,46,(GMY2-GMY1)+28); ctx.strokeRect(FW-54,GMY1-14,46,(GMY2-GMY1)+28);
  ctx.fillStyle="rgba(255,255,255,.85)"; ctx.fillRect(2,GMY1,6,GMY2-GMY1); ctx.fillRect(FW-8,GMY1,6,GMY2-GMY1);
  for(const p of G.players) drawPlayer(ctx,p);
  drawBall(ctx,G.ball.x,G.ball.y);
  for(const v of G.vfx){ ctx.globalAlpha=clamp(v.life/v.max,0,1); ctx.fillStyle=v.c;
    ctx.beginPath(); ctx.arc(v.x,v.y,v.sz,0,7); ctx.fill(); } ctx.globalAlpha=1;
  ctx.restore();
}
function px(ctx,x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }
function drawPlayer(ctx,p){
  const owner=G.players.every(q=>Math.hypot(q.x-G.ball.x,q.y-G.ball.y)>=Math.hypot(p.x-G.ball.x,p.y-G.ball.y));
  ctx.fillStyle="rgba(0,0,0,.28)"; ctx.beginPath(); ctx.ellipse(p.x,p.y+11,11,4,0,0,7); ctx.fill();
  if(owner){ ctx.strokeStyle="#f5c451"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p.x,p.y,15,0,7); ctx.stroke(); }
  if(p.star){ p.team==="home"?drawTatu(ctx,p.x,p.y,p.flinch>0):drawMino(ctx,p.x,p.y,p.flinch>0); return; }
  const col=p.team==="home"?"#3f7fa0":"#a04545";
  ctx.fillStyle=p.flinch>0?"#fff":col; ctx.beginPath(); ctx.arc(p.x,p.y,10,0,7); ctx.fill();
  ctx.fillStyle="rgba(0,0,0,.5)"; ctx.font="bold 9px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(p.role,p.x,p.y);
}
function drawBall(ctx,x,y){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle="#e9dcc4"; ctx.beginPath(); ctx.arc(0,0,7,0,7); ctx.fill();
  ctx.strokeStyle="#5a4a36"; ctx.lineWidth=1.4; ctx.stroke();
  ctx.strokeStyle="#ff3b3b"; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(0,0,4,0,7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6.5,0);ctx.lineTo(6.5,0);ctx.moveTo(0,-6.5);ctx.lineTo(0,6.5); ctx.stroke();
  ctx.restore();
}
function drawTatu(ctx,cx,cy,fl){ ctx.save(); ctx.translate(cx,cy); ctx.scale(.62,.62); if(fl){ctx.globalAlpha=.8;}
  px(ctx,-20,-6,40,42,fl?"#cfc0a0":"#7a6a4a"); for(let i=-16;i<18;i+=8)px(ctx,i,-6,2,42,"#5a4d34");
  px(ctx,-6,6,12,3,"#b3372f"); px(ctx,-12,-28,24,24,"#8a7a58"); px(ctx,-12,-28,24,7,"#5a4d34");
  px(ctx,4,-18,8,5,"#c9b889"); px(ctx,-7,-17,4,4,"#39d0ff");
  px(ctx,-26,0,8,20,"#7a6a4a"); px(ctx,18,0,8,20,"#7a6a4a"); ctx.restore(); }
function drawMino(ctx,cx,cy,fl){ ctx.save(); ctx.translate(cx,cy); ctx.scale(.62,.62); if(fl){ctx.globalAlpha=.8;}
  px(ctx,-22,-8,44,44,fl?"#9aa0ac":"#2e3340"); px(ctx,-7,6,14,3,"#c0392b");
  px(ctx,-13,-30,26,24,"#3a4150"); px(ctx,-20,-32,8,5,"#cbb58a"); px(ctx,12,-32,8,5,"#cbb58a");
  px(ctx,-9,-20,5,5,"#ff5151"); px(ctx,4,-20,5,5,"#ff5151");
  px(ctx,-30,-2,9,22,"#2e3340"); px(ctx,21,-2,9,22,"#2e3340"); ctx.restore(); }

function cardEl(c,mini,onclick){
  const el=document.createElement("div");
  el.className=`pcard ${c.type} ${mini?"mini":""}`;
  el.innerHTML=`<div class="tag">${typeLabel(c.type)}</div><div class="ic">${c.ic}</div>
    <div class="nm">${c.nm}</div><div class="ds">${c.ds}</div>`;
  el.onclick=onclick;
  return el;
}
function typeLabel(t){return {support:"APOIO",finish:"FINAL.",impact:"IMPACTO",block:"DEFESA",tackle:"DESARME",pressure:"PRESSÃO"}[t]||t;}
function renderHandArea(){
  const atk=G.st.possession==="home";
  $("#zoneTitle").textContent= atk?"Sua jogada (ataque)":"Sua jogada (defesa)";
  $("#zoneRule").textContent= (atk?"máx. 1 finalização · ":"")+"até "+MAXPLAY+" cartas ("+G.play.length+"/"+MAXPLAY+")";
  $("#handHint").textContent= atk?"toque p/ jogar":"toque p/ jogar";
  // playzone
  const pz=$("#playzone"); pz.innerHTML=""; pz.classList.toggle("empty",G.play.length===0);
  G.play.forEach((c,idx)=>pz.appendChild(cardEl(c,true,()=>{ if(G.busy)return; G.play.splice(idx,1); renderHandArea(); })));
  // hand
  const hd=$("#hand"); hd.innerHTML="";
  G.hand.forEach((c)=>{
    const used=G.play.includes(c);
    const finishBlocked=c.type==="finish"&&G.play.some(x=>x.type==="finish");
    const el=cardEl(c,false,()=>{
      if(G.busy)return;
      if(used){ G.play=G.play.filter(x=>x!==c); }
      else { if(G.play.length>=MAXPLAY){ toast("Máximo de "+MAXPLAY+" cartas por jogada"); return; }
        if(c.type==="finish"&&G.play.some(x=>x.type==="finish")){ toast("Só 1 finalização por turno!"); return; } G.play.push(c); }
      renderHandArea();
    });
    if(used) el.style.outline="2px solid var(--gold)";
    if(finishBlocked&&!used) el.classList.add("disabled");
    hd.appendChild(el);
  });
}
function renderHud(){
  const st=G.st, set=(id,v)=>{const e=$("#"+id);if(e)e.textContent=v;};
  set("scH",st.score.home); set("scA",st.score.away);
  set("staHn",Math.round(st.sta.home)); set("staAn",Math.round(st.sta.away));
  const sh=$("#staH"); if(sh)sh.style.width=(st.sta.home/STA_MAX*100)+"%";
  const sa=$("#staA"); if(sa)sa.style.width=(st.sta.away/STA_MAX*100)+"%";
  set("turnLbl",st.suddenDeath?"MORTE SÚBITA":`Turno ${Math.min(st.turn,TURNS)} / ${TURNS}`);
  const ph=$("#posH"),pa=$("#posA"); if(ph)ph.className=st.possession==="home"?"on":""; if(pa)pa.className=st.possession==="away"?"on":"";
}
function banner(cb){
  const atk=G.st.possession==="home";
  const ov=document.createElement("div"); ov.id="banner";
  ov.innerHTML=`<div class="big"><div class="t1">${G.st.suddenDeath?"MORTE SÚBITA":"TURNO "+Math.min(G.st.turn,TURNS)+" / "+TURNS}</div>
    <div class="t2" style="color:${atk?'var(--home)':'var(--away)'}">${atk?"⚔️ SEU ATAQUE":"🛡️ DEFENDA!"}</div></div>`;
  document.body.appendChild(ov);
  setTimeout(()=>{ ov.remove(); cb&&cb(); },1050);
}

    <div style="font-size:58px">${win?"🏆":"💀"}</div>
    <h1 class="${win?'gold':'bad'}">${win?"VITÓRIA!":"Derrota"}</h1>

/* -------------------------------- UTIL ----------------------------------- */
function log(cls,html){ const box=$("#log"); if(!box)return;
  const d=document.createElement("div"); d.className="e "+(cls||""); d.innerHTML=html;
  box.appendChild(d); box.scrollTop=box.scrollHeight; }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),1400); }
