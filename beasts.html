<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>World Cup Beasts — Duelo de Cartas (determinístico + zonas)</title>
<style>
  :root{
    --bg:#0a0e1a; --panel:#131a2e; --panel2:#1b2540; --line:#2a3556;
    --txt:#e8edf7; --muted:#8a96b8; --gold:#f5c451; --good:#4fd18b; --bad:#ff6b6b;
    --home:#4fb0d1; --away:#d14f4f; --shadow:0 8px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:radial-gradient(120% 80% at 50% 0%,#161d33,#070a14);
    color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow-x:hidden}
  body{display:flex;justify-content:center}
  #app{width:100%;max-width:780px;min-height:100vh;padding:12px 12px 30px;position:relative}
  h1,h2,h3{margin:0 0 .35em;font-weight:800} h1{font-size:26px} h2{font-size:20px}
  p{line-height:1.5;color:var(--muted);margin:.3em 0}
  .center{text-align:center} .muted{color:var(--muted)} .gold{color:var(--gold)}
  .good{color:var(--good)} .bad{color:var(--bad)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(180deg,#2b3a63,#202c4e);color:var(--txt);border:1px solid var(--line);
    padding:11px 16px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
    transition:transform .06s,filter .15s;user-select:none}
  .btn:hover{filter:brightness(1.12)} .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(180deg,#f5c451,#e0a72f);color:#241a00;border-color:#caa033}
  .btn.ghost{background:transparent} .btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
  .btn.full{width:100%}
  .card-ui{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}

  .scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:6px}
  .team{display:flex;flex-direction:column;gap:4px}.team.away{align-items:flex-end}
  .team .nm{font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px}
  .stabar{height:13px;border-radius:8px;background:#2a1414;overflow:hidden;border:1px solid var(--line);width:100%}
  .stabar>div{height:100%;transition:width .5s}
  .team .stabar>div{background:linear-gradient(90deg,#2e9c66,var(--good))}
  .scoremid{text-align:center}.scoremid .sc{font-size:28px;font-weight:900}.scoremid .turn{font-size:12px;color:var(--muted)}

  /* barra de zonas do campo */
  .zonebar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 0 6px}
  .zcell{position:relative;border:1px solid var(--line);border-radius:9px;padding:6px 2px;text-align:center;
    background:#0e1424;font-size:10px;font-weight:700;color:var(--muted);min-height:40px}
  .zcell .zl{display:block;font-size:9px;opacity:.8}
  .zcell.ball{box-shadow:inset 0 0 0 2px var(--gold)}
  .zcell.shoot{background:#2a2410}
  .zcell .b{font-size:18px;line-height:1}
  .dir{font-size:11px;text-align:center;color:var(--muted);margin-bottom:4px}

  #pitch{width:100%;display:block;border-radius:12px;border:2px solid #0c4a20;
    box-shadow:inset 0 0 40px rgba(0,0,0,.5);margin-bottom:8px;background:#1a6b32}

  .zonelabel{font-size:12px;color:var(--muted);margin:2px 2px 5px;display:flex;justify-content:space-between}
  .playzone{min-height:96px;border:2px dashed var(--line);border-radius:12px;padding:7px;
    display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:#0e142480}
  .playzone.empty::before{content:"Toque nas cartas para montar a jogada";color:#5b6688;font-size:12px;margin:auto}
  .hand{display:flex;gap:7px;overflow-x:auto;padding:8px 2px 2px;scrollbar-width:thin}
  .pcard{flex:0 0 auto;width:90px;min-height:120px;border-radius:11px;border:2px solid var(--line);
    background:linear-gradient(180deg,#1d2742,#161e34);padding:7px 6px;cursor:pointer;position:relative;
    transition:transform .1s,border-color .15s;user-select:none}
  .pcard:hover{transform:translateY(-3px)}
  .pcard .ic{font-size:24px;text-align:center;line-height:1.1}
  .pcard .nm{font-size:11px;font-weight:800;text-align:center;margin-top:2px}
  .pcard .vals{font-size:9px;color:#9cd6ff;text-align:center;margin-top:3px;line-height:1.3}
  .pcard .ds{font-size:8.5px;color:var(--muted);line-height:1.22;margin-top:3px}
  .pcard .tag{position:absolute;top:5px;right:5px;font-size:8px;font-weight:800;padding:1px 5px;border-radius:6px}
  .pcard.finish{border-color:#c9803a}.pcard.finish .tag{background:#5a3a1d;color:#ffc890}
  .pcard.support .tag{background:#1d3a4a;color:#9cd6ff}
  .pcard.impact{border-color:#a8403a}.pcard.impact .tag{background:#4a1d1d;color:#ff9c9c}
  .pcard.block .tag,.pcard.tackle .tag,.pcard.pressure .tag{background:#1d4a2c;color:#9cffb6}
  .pcard.mini{width:64px;min-height:80px}.pcard.mini .ic{font-size:20px}.pcard.mini .nm{font-size:9px}.pcard.mini .ds,.pcard.mini .vals{display:none}
  .pcard.disabled{opacity:.32;pointer-events:none;filter:grayscale(.6)}

  #log{height:74px;overflow-y:auto;background:#0c1120;border:1px solid var(--line);border-radius:12px;
    padding:8px;font-size:13px;line-height:1.5;margin-top:8px}
  #log .e{margin-bottom:2px}
  #log .goal{color:var(--gold);font-weight:800}#log .ko{color:var(--bad);font-weight:800}
  #log .good{color:var(--good)}#log .sys{color:#c0a0ff}#log .miss{color:#ffb07a}#log .adv{color:#9cd6ff}

  #banner{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(60% 60% at 50% 50%,rgba(10,14,26,.15),rgba(5,8,15,.9));pointer-events:none}
  #banner .big{text-align:center;animation:zoomin 1s ease both}
  #banner .t1{font-size:13px;letter-spacing:4px;color:var(--muted);font-weight:800}
  #banner .t2{font-size:36px;font-weight:900;text-shadow:0 4px 24px rgba(0,0,0,.8)}
  @keyframes zoomin{0%{transform:scale(2);opacity:0;filter:blur(5px)}40%{transform:scale(1);opacity:1;filter:blur(0)}100%{opacity:.92}}
  .toast{position:fixed;left:50%;top:12px;transform:translateX(-50%);background:#000d;border:1px solid var(--gold);
    color:var(--gold);padding:8px 15px;border-radius:10px;font-weight:800;z-index:99;animation:fade .25s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .screen{animation:fade .3s ease}
  .controls{display:flex;gap:8px;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ===========================================================================
   WORLD CUP BEASTS — Duelo de cartas DETERMINÍSTICO com ZONAS de campo.
   - Sem sorte na resolução: tudo é "valor X vs alvo X" (ou X seu vs X do rival).
     A variância vem só do sorteio das cartas -> builds funcionam de forma fiável.
   - Campo em 4 zonas. Para FINALIZAR é preciso estar na zona de ataque do rival.
   - Roubo = seu controle vs desarme do rival. Avanço = avanço vs guarda.
     Gol = chute vs guarda(GK). Impacto = STA (só conecta se o lance vingou).
   - 3 vias de vitória: placar (empate->morte súbita) · 5 gols dif. · nocaute STA.
   Lógica pura separada do render (testável headless).
   ========================================================================= */
const $=(s,el=document)=>el.querySelector(s);
const app=$("#app");
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[ri(0,a.length-1)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ------------------------------- AJUSTES --------------------------------- */
let TURNS=15, STA_MAX=100; const MERCY=5, HAND=5, MAXPLAY=3;   // 15 turnos: recomendado por simulação
let IMPACT_DMG=8;    // dano de STA por carta de impacto (determinístico; só conecta se o lance vingou)
let FATIGUE=1;       // STA perdida por time a cada turno (cansaço leve)
const BIGSTEP=6;     // margem acima do alvo para avançar 2 zonas de uma vez
const ADV_TH=7;      // ALVO de avanço: atingiu -> avança de zona (não é barrado pela guarda)
const MOMCAP=6;      // teto do embalo (momentum), que ajuda no chute

/* ------------------------------- CARTAS ---------------------------------- */
// ATAQUE: adv=avanço, ctrl=controle (resiste a roubo), shot=potência/precisão de chute
// DEFESA: guard=guarda (barra avanço e chute), steal=desarme (rouba), sta=impacto
const CARDS={
  passe   :{id:"passe",mode:"atk",type:"support",nm:"Tabela",ic:"🅿️",adv:3,ctrl:5,ds:"Avanço seguro: muito controle (resiste a roubo)."},
  drible  :{id:"drible",mode:"atk",type:"support",nm:"Drible",ic:"👟",adv:5,ctrl:2,ds:"Bom avanço; controle médio."},
  lancamento:{id:"lancamento",mode:"atk",type:"support",nm:"Lançamento",ic:"⚡",adv:7,ctrl:0,ds:"Avanço grande; expõe a bola (roubável)."},
  visao   :{id:"visao",mode:"atk",type:"support",nm:"Visão de Jogo",ic:"🧠",adv:2,ctrl:3,shot:6,ds:"Pouco avanço, muita precisão na finalização."},
  finaliza:{id:"finaliza",mode:"atk",type:"finish",nm:"Finalização",ic:"⚽",shot:9,ds:"Chute equilibrado (só na zona de ataque)."},
  colocado:{id:"colocado",mode:"atk",type:"finish",nm:"Chute Colocado",ic:"🪄",shot:6,pierce:5,ds:"Fura a defesa (ignora parte da guarda)."},
  bicuda  :{id:"bicuda",mode:"atk",type:"finish",nm:"Bicuda",ic:"💥",shot:12,impact:1,ds:"Chute forte que fere quem estiver no caminho (💥)."},
  pancada :{id:"pancada",mode:"atk",type:"impact",nm:"Pancada",ic:"💢",adv:3,sta:IMPACT_DMG,ds:"Avança batendo a bola num rival: dano de STA. NÃO é finalização."},
  defesa  :{id:"defesa",mode:"def",type:"block",nm:"Defesa",ic:"🧤",guard:7,ds:"Muita guarda: barra avanço e chute."},
  bloqueio:{id:"bloqueio",mode:"def",type:"block",nm:"Bloqueio",ic:"🧱",guard:4,ds:"Guarda média."},
  desarme :{id:"desarme",mode:"def",type:"tackle",nm:"Desarme",ic:"✋",steal:5,ds:"Tenta roubar: seu desarme vs o controle do rival."},
  marcacao:{id:"marcacao",mode:"def",type:"pressure",nm:"Marcação",ic:"😖",guard:2,steal:2,ds:"Mistura guarda e desarme."},
  carrinho:{id:"carrinho",mode:"def",type:"impact",nm:"Carrinho",ic:"💢",steal:3,sta:IMPACT_DMG,ds:"Entrada dura: desarme + dano de STA."},
};
const ATK_DECK=[["passe",3],["drible",2],["lancamento",2],["visao",2],["finaliza",2],["colocado",1],["bicuda",1],["pancada",3]];
const DEF_DECK=[["defesa",3],["bloqueio",2],["desarme",3],["marcacao",2],["carrinho",2]];
function buildDeck(spec){const d=[];for(const[id,n]of spec)for(let i=0;i<n;i++)d.push(id);return d;}
function drawHand(mode){const deck=shuffle(buildDeck(mode==="atk"?ATK_DECK:DEF_DECK));
  return deck.slice(0,HAND).map(id=>({...CARDS[id],uid:Math.random().toString(36).slice(2,8)}));}

/* ------------------------------- FERAS ----------------------------------- */
const BEASTS={
  tatu:{key:"tatu",name:"Couraça, o Tatu de Guerra",crest:"🛡️",color:"#7a6a4a",ATK:5,DEF:5,TEC:4},
  mino:{key:"mino",name:"Górtax, Minotauro de Ônix",crest:"🐂",color:"#2e3340",ATK:5,DEF:5,TEC:4},
};

/* =================== LÓGICA PURA (determinística) ======================== */
// Zonas (absolutas): 0=Defesa Couraça · 1=Meio Couraça · 2=Meio Górtax · 3=Defesa Górtax
const ZNAMES=["Defesa 🛡️","Meio 🟦","Meio 🟥","Ataque ⚽"];
const zoneAdvance=(side,pos,step)=> side==="home"?Math.min(3,pos+step):Math.max(0,pos-step);
const inShootZone=(side,pos)=> side==="home"?pos===3:pos===0;
const kickoffPos=side=> side==="home"?1:2;   // recomeço no próprio meio
const opp=s=>s==="home"?"away":"home";

function freshState(home,away){
  return {beasts:{home,away},turn:1,possession:"home",pos:kickoffPos("home"),
    score:{home:0,away:0},sta:{home:STA_MAX,away:STA_MAX},momentum:{home:0,away:0},
    suddenDeath:false,over:false,winner:null,reason:null};
}
// IA escolhe até MAXPLAY cartas, ciente do lado e da zona
function aiPick(hand,mode,st,side){
  side=side||"away";
  if(mode==="atk"){
    const zone=inShootZone(side,st.pos);
    const prio=c=> c.type==="finish"?(zone?(c.id==="bicuda"?8:c.id==="colocado"?8:7):-1)
      : c.type==="support"?(zone?(c.shot?6:1):((c.adv||0)+(c.ctrl||0)*0.5)) : c.type==="impact"?3:0;
    const sorted=hand.slice().filter(c=>prio(c)>=0).sort((a,b)=>prio(b)-prio(a));
    const play=[];let fin=false;
    for(const c of sorted){ if(play.length>=MAXPLAY)break; if(c.type==="finish"){if(fin||!zone)continue;fin=true;} play.push(c); }
    return play;
  }
  // defesa: se o atacante já está perto de chutar -> guarda; senão -> desarme (corta o avanço)
  const threat=inShootZone(opp(side),st.pos);
  const prio=c=> threat
    ? (c.type==="block"?6:c.type==="impact"?4:c.type==="tackle"?3:c.type==="pressure"?3:0)
    : (c.type==="tackle"?6:c.type==="impact"?5:c.type==="pressure"?4:c.type==="block"?2:0);
  return hand.slice().sort((a,b)=>prio(b)-prio(a)).slice(0,MAXPLAY);
}

function resolveContest(st,atkCards,defCards){
  const aSide=st.possession, dSide=opp(aSide);
  const A=st.beasts[aSide], D=st.beasts[dSide];
  const sup=atkCards.filter(c=>c.type==="support");
  let fin=atkCards.find(c=>c.type==="finish");
  const aImp=atkCards.filter(c=>c.type==="impact");
  const block=defCards.filter(c=>c.type==="block");
  const tackle=defCards.filter(c=>c.type==="tackle");
  const press=defCards.filter(c=>c.type==="pressure");
  const dImp=defCards.filter(c=>c.type==="impact");
  const mom=st.momentum[aSide]||0;
  const inZone=inShootZone(aSide,st.pos);
  if(fin&&!inZone) fin=null;            // só finaliza na zona de ataque

  const advanceVal=atkCards.reduce((s,c)=>s+(c.adv||0),0)+A.ATK*0.5+mom;
  const controlVal=sup.reduce((s,c)=>s+(c.ctrl||0),0)+A.TEC+(fin?3:0);
  const shotBonus =sup.reduce((s,c)=>s+(c.shot||0),0);
  const guardVal  =block.reduce((s,c)=>s+(c.guard||0),0)+press.reduce((s,c)=>s+(c.guard||0),0)+D.DEF*0.7;
  const stealVal  =tackle.reduce((s,c)=>s+(c.steal||0),0)+dImp.reduce((s,c)=>s+(c.steal||0),0)+press.reduce((s,c)=>s+(c.steal||0),0)+D.TEC*0.3;
  const rawImpToD =aImp.reduce((s,c)=>s+(c.sta||0),0)+((fin&&fin.impact)?IMPACT_DMG:0);
  const rawImpToA =dImp.reduce((s,c)=>s+(c.sta||0),0);

  let outcome,newPos=st.pos,newPoss=aSide,impToD=0,impToA=0;
  if(stealVal>controlVal){                         // ROUBO: X seu vs X do rival
    outcome="TURNOVER"; newPoss=dSide; impToA=rawImpToA; st.momentum[aSide]=0;
  } else if(fin){                                  // FINALIZAÇÃO (na zona)
    const target=Math.max(0,guardVal-(fin.pierce||0));
    const shotVal=fin.shot+shotBonus+A.ATK*0.5+mom;
    outcome= shotVal>=target?"GOAL":"MISS";
    impToD=rawImpToD; newPoss=dSide;
    newPos= outcome==="GOAL"?kickoffPos(dSide):kickoffPos(dSide);
    st.momentum[aSide]=0;
  } else {                                         // AVANÇO: seu valor vs ALVO fixo (defesa para via roubo)
    if(advanceVal>=ADV_TH){
      const step=(advanceVal-ADV_TH>=BIGSTEP)?2:1;
      newPos=zoneAdvance(aSide,st.pos,step); outcome="ADVANCE"; impToD=rawImpToD;
      st.momentum[aSide]=Math.min(MOMCAP,mom+1);
    } else { outcome="STUFF"; st.momentum[aSide]=Math.max(0,mom-1); }
  }
  const staD={home:0,away:0}; staD[dSide]-=impToD; staD[aSide]-=impToA;
  if(outcome==="GOAL") staD[dSide]-=2;
  const r={goalHome:0,goalAway:0,staHome:staD.home,staAway:staD.away,possession:newPoss,pos:newPos,type:"",text:"",outcome};
  const hA=aSide==="home";
  if(outcome==="GOAL"){ hA?r.goalHome=1:r.goalAway=1; r.type=hA?"GOAL":"CONCEDE"; r.text=hA?"GOOOL!":"Sofreu um gol... ⚽"; }
  else if(outcome==="MISS"){ r.type=hA?"MISS":"DEFEND"; r.text=hA?"Defendeu! 🧤":"🧤 Você defendeu e recuperou a bola!"; }
  else if(outcome==="TURNOVER"){ r.type=hA?"LOSE":"STEAL"; r.text=hA?"Roubaram sua bola! ✋":"✋ Você roubou a bola!"; }
  else if(outcome==="ADVANCE"){ r.type=hA?"ADVANCE":"PRESSURED"; r.text=hA?`Avançou para ${ZNAMES[newPos]}. 👟`:`O rival avançou para ${ZNAMES[newPos]}.`; }
  else { r.type=hA?"STUFF":"HELD"; r.text=hA?"A defesa segurou seu avanço. 🧱":"🧱 Você segurou o avanço do rival."; }
  const dmgAway=(dSide==="away"?impToD:0)+(aSide==="away"?impToA:0);
  const dmgHome=(dSide==="home"?impToD:0)+(aSide==="home"?impToA:0);
  if(dmgAway>0) r.text+=` 💥 -${dmgAway} no Górtax`;
  if(dmgHome>0) r.text+=` 💢 você -${dmgHome}`;
  return r;
}
function applyTurn(st,res){
  st.score.home+=res.goalHome; st.score.away+=res.goalAway;
  st.sta.home=clamp(st.sta.home+res.staHome-FATIGUE,0,STA_MAX);
  st.sta.away=clamp(st.sta.away+res.staAway-FATIGUE,0,STA_MAX);
  st.possession=res.possession; st.pos=res.pos; st.turn++;
}
function finish(st,w,reason){st.over=true;st.winner=w;st.reason=reason;return{over:true,winner:w,reason};}
function checkEnd(st,res){
  if(st.sta.away<=0) return finish(st,"home","KO");
  if(st.sta.home<=0) return finish(st,"away","KO");
  const diff=st.score.home-st.score.away;
  if(diff>=MERCY) return finish(st,"home","GOLEADA");
  if(diff<=-MERCY) return finish(st,"away","GOLEADA");
  if(st.suddenDeath){
    if(res.goalHome) return finish(st,"home","GOLDEN");
    if(res.goalAway) return finish(st,"away","GOLDEN");
    return {over:false};
  }
  if(st.turn>TURNS){
    if(st.score.home!==st.score.away) return finish(st,st.score.home>st.score.away?"home":"away","TIME");
    st.suddenDeath=true;
  }
  return {over:false};
}

/* ============================== JOGO (UI) ================================ */
let G=null;
const FW=620,FH=240,GMY1=90,GMY2=150;
const ZONEX=[FW*0.125,FW*0.375,FW*0.625,FW*0.875];

function startGame(){
  const st=freshState({...BEASTS.tatu},{...BEASTS.mino});
  G={st,ctx:null,canvas:null,busy:false,play:[],hand:[],players:[],ball:{x:ZONEX[st.pos],y:FH/2},
     vfx:[],shake:0,anim:null,raf:0,animPoss:"home"};
  setupPlayers();
  renderMatch();
  log("sys",`🏟️ ${st.beasts.home.crest} ${st.beasts.home.name} vs ${st.beasts.away.crest} ${st.beasts.away.name}`);
  log("sys",`Sem sorte na resolução: tudo é valor vs valor. Avance até a Zona de Ataque para finalizar. ${TURNS} turnos.`);
  loopStart(); nextTurn();
}
function setupPlayers(){
  G.players=[
    {team:"home",role:"GK",ax:30,ay:120,x:30,y:120},
    {team:"home",role:"D",ax:120,ay:120,x:120,y:120,star:true},
    {team:"away",role:"GK",ax:590,ay:120,x:590,y:120},
    {team:"away",role:"D",ax:500,ay:120,x:500,y:120,star:true},
  ];
  G.ball.x=ZONEX[G.st.pos]; G.ball.y=FH/2;
}
function nextTurn(){
  if(G.st.over)return;
  G.busy=true; G.play=[]; renderHud();
  banner(()=>{ G.hand=drawHand(G.st.possession==="home"?"atk":"def"); G.busy=false; renderHandArea(); });
}
function executePlay(){
  if(G.busy||G.st.over)return;
  if(G.play.length===0){ toast("Jogue ao menos uma carta"); return; }
  G.busy=true;
  const atk=G.st.possession==="home";
  const aiMode=atk?"def":"atk";
  const aiPlay=aiPick(drawHand(aiMode),aiMode,G.st,"away");
  const atkCards=atk?G.play:aiPlay, defCards=atk?aiPlay:G.play;
  const oldPos=G.st.pos;
  const res=resolveContest(G.st,atkCards,defCards);
  log("sys",`${G.st.beasts.away.crest} Górtax: ${aiPlay.length?aiPlay.map(c=>c.ic).join(" "):"—"}`);
  const anim=buildAnim(res,oldPos);
  runAnim(anim,()=>{
    const cls=res.goalHome?"goal":res.goalAway?"miss":(res.type==="STEAL"||res.type==="DEFEND"||res.type==="HELD")?"good":(res.type==="ADVANCE")?"adv":(res.type==="MISS"||res.type==="LOSE")?"miss":"";
    log(cls,`T${Math.min(G.st.turn,TURNS)}: ${res.text}`);
    applyTurn(G.st,res); renderHud();
    const end=checkEnd(G.st,res);
    setTimeout(()=>{ if(end.over) showResult(end); else nextTurn(); }, 600);
  });
}

/* ------------------------- ANIMAÇÃO (zonas) ------------------------------ */
function buildAnim(res,oldPos){
  const aSide=G.st.possession;
  const wps=[{x:ZONEX[oldPos],y:FH/2,dur:.2,poss:aSide}];
  if(res.outcome==="GOAL"||res.outcome==="MISS"){
    const goalX=aSide==="home"?FW-14:14;
    wps.push({x:goalX,y:clamp(120+rnd(-20,20),GMY1+6,GMY2-6),dur:.3,poss:aSide,fx:res.outcome==="GOAL"?"goal":"save"});
    wps.push({x:ZONEX[res.pos],y:FH/2,dur:.3,poss:res.possession});
  } else if(res.outcome==="TURNOVER"){
    wps.push({x:ZONEX[res.pos],y:FH/2,dur:.3,poss:res.possession,fx:"steal"});
  } else if(res.outcome==="ADVANCE"){
    if(res.staAway<0||res.staHome<0) wps.push({x:(ZONEX[oldPos]+ZONEX[res.pos])/2,y:FH/2,dur:.2,poss:aSide,fx:"impact"});
    wps.push({x:ZONEX[res.pos],y:FH/2,dur:.35,poss:aSide});
  } else { // STUFF
    wps.push({x:ZONEX[res.pos]+(aSide==="home"?14:-14),y:FH/2,dur:.18,poss:aSide,fx:"stuff"});
    wps.push({x:ZONEX[res.pos],y:FH/2,dur:.2,poss:res.possession});
  }
  return {wps};
}
function runAnim(anim,cb){ G.anim={wps:anim.wps,i:0,t:0,from:{...G.ball},cb}; if(anim.wps[0])G.animPoss=anim.wps[0].poss; }
function stepAnim(dt){
  const a=G.anim; if(!a)return;
  const wp=a.wps[a.i]; if(!wp){const cb=a.cb;G.anim=null;cb&&cb();return;}
  a.t+=dt/wp.dur; const k=clamp(a.t,0,1),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  G.ball.x=a.from.x+(wp.x-a.from.x)*e; G.ball.y=a.from.y+(wp.y-a.from.y)*e; G.animPoss=wp.poss;
  if(a.t>=1){ G.ball.x=wp.x;G.ball.y=wp.y; triggerFx(wp); a.from={x:wp.x,y:wp.y}; a.i++; a.t=0; }
}
function triggerFx(wp){
  if(wp.fx==="goal"){G.shake=16;burst(G.ball.x,G.ball.y,"#f5c451",28);}
  else if(wp.fx==="save"){G.shake=6;burst(G.ball.x,G.ball.y,"#8fd6ff",14);}
  else if(wp.fx==="impact"){G.shake=10;burst(G.ball.x,G.ball.y,"#ff7b2d",16);}
  else if(wp.fx==="steal"){burst(G.ball.x,G.ball.y,"#9cffb6",12);}
}

/* ------------------------------- CANVAS ---------------------------------- */
function loopStart(){const f=t=>{drawFrame(t);G.raf=requestAnimationFrame(f);};G.raf=requestAnimationFrame(f);}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*7,s=rnd(40,170);
  G.vfx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.7,max:.7,c,sz:rnd(2,5)});}}
let LAST=0;
function drawFrame(ts){
  const ctx=G.ctx;if(!ctx)return;
  const now=(ts||0)/1000;let dt=now-(LAST||now);LAST=now;dt=Math.min(dt||0.016,.05);
  if(G.anim)stepAnim(dt); steerPlayers(dt);
  for(let i=G.vfx.length-1;i>=0;i--){const v=G.vfx[i];v.x+=v.vx*dt;v.y+=v.vy*dt;v.vx*=0.92;v.vy*=0.92;v.life-=dt;if(v.life<=0)G.vfx.splice(i,1);}
  for(const p of G.players)if(p.flinch>0)p.flinch-=dt;
  drawPitch(ctx);
}
function steerPlayers(dt){
  const b=G.ball,poss=G.animPoss;
  for(const p of G.players){
    let tx,ty;
    if(p.role==="GK"){tx=p.ax;ty=clamp(b.y,GMY1+6,GMY2-6);}
    else if(p.team===poss){tx=b.x-(p.team==="home"?18:-18);ty=b.y;}
    else {tx=(p.x+b.x)/2;ty=(p.y+b.y)/2;}
    const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy)||1,spd=170;
    if(d>2){p.x+=dx/d*Math.min(spd*dt,d);p.y+=dy/d*Math.min(spd*dt,d);}
    p.x=clamp(p.x,14,FW-14);p.y=clamp(p.y,18,FH-18);
  }
}
function drawPitch(ctx){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,FW,FH);
  ctx.save(); if(G.shake>0.3){ctx.translate(rnd(-G.shake,G.shake),rnd(-G.shake,G.shake));G.shake*=0.86;}
  for(let i=0;i<4;i++){ctx.fillStyle=i%2?"#176028":"#1a6b32";ctx.fillRect(i*FW/4,0,FW/4+1,FH);}
  // zona de ataque atual destacada
  const sz=inShootZone(G.animPoss,Math.round((G.ball.x/FW)*4-0.5));
  ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=2;ctx.strokeRect(8,8,FW-16,FH-16);
  for(let i=1;i<4;i++){ctx.setLineDash([4,5]);ctx.beginPath();ctx.moveTo(i*FW/4,8);ctx.lineTo(i*FW/4,FH-8);ctx.stroke();ctx.setLineDash([]);}
  ctx.beginPath();ctx.arc(FW/2,FH/2,26,0,7);ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.85)";ctx.fillRect(2,GMY1,6,GMY2-GMY1);ctx.fillRect(FW-8,GMY1,6,GMY2-GMY1);
  for(const p of G.players)drawPlayer(ctx,p);
  drawBall(ctx,G.ball.x,G.ball.y);
  for(const v of G.vfx){ctx.globalAlpha=clamp(v.life/v.max,0,1);ctx.fillStyle=v.c;ctx.beginPath();ctx.arc(v.x,v.y,v.sz,0,7);ctx.fill();}ctx.globalAlpha=1;
  ctx.restore();
}
function px(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function drawPlayer(ctx,p){
  ctx.fillStyle="rgba(0,0,0,.28)";ctx.beginPath();ctx.ellipse(p.x,p.y+11,11,4,0,0,7);ctx.fill();
  const owner=Math.hypot(p.x-G.ball.x,p.y-G.ball.y)<22;
  if(owner){ctx.strokeStyle="#f5c451";ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,15,0,7);ctx.stroke();}
  if(p.star){p.team==="home"?drawTatu(ctx,p.x,p.y,p.flinch>0):drawMino(ctx,p.x,p.y,p.flinch>0);return;}
  ctx.fillStyle=p.team==="home"?"#3f7fa0":"#a04545";ctx.beginPath();ctx.arc(p.x,p.y,10,0,7);ctx.fill();
  ctx.fillStyle="rgba(0,0,0,.5)";ctx.font="bold 9px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("GK",p.x,p.y);
}
function drawBall(ctx,x,y){ctx.save();ctx.translate(x,y);
  ctx.fillStyle="#e9dcc4";ctx.beginPath();ctx.arc(0,0,7,0,7);ctx.fill();ctx.strokeStyle="#5a4a36";ctx.lineWidth=1.4;ctx.stroke();
  ctx.strokeStyle="#ff3b3b";ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,0,4,0,7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-6.5,0);ctx.lineTo(6.5,0);ctx.moveTo(0,-6.5);ctx.lineTo(0,6.5);ctx.stroke();ctx.restore();}
function drawTatu(ctx,cx,cy,fl){ctx.save();ctx.translate(cx,cy);ctx.scale(.6,.6);if(fl)ctx.globalAlpha=.8;
  px(ctx,-20,-6,40,42,fl?"#cfc0a0":"#7a6a4a");for(let i=-16;i<18;i+=8)px(ctx,i,-6,2,42,"#5a4d34");
  px(ctx,-6,6,12,3,"#b3372f");px(ctx,-12,-28,24,24,"#8a7a58");px(ctx,-12,-28,24,7,"#5a4d34");
  px(ctx,4,-18,8,5,"#c9b889");px(ctx,-7,-17,4,4,"#39d0ff");px(ctx,-26,0,8,20,"#7a6a4a");px(ctx,18,0,8,20,"#7a6a4a");ctx.restore();}
function drawMino(ctx,cx,cy,fl){ctx.save();ctx.translate(cx,cy);ctx.scale(.6,.6);if(fl)ctx.globalAlpha=.8;
  px(ctx,-22,-8,44,44,fl?"#9aa0ac":"#2e3340");px(ctx,-7,6,14,3,"#c0392b");px(ctx,-13,-30,26,24,"#3a4150");
  px(ctx,-20,-32,8,5,"#cbb58a");px(ctx,12,-32,8,5,"#cbb58a");px(ctx,-9,-20,5,5,"#ff5151");px(ctx,4,-20,5,5,"#ff5151");
  px(ctx,-30,-2,9,22,"#2e3340");px(ctx,21,-2,9,22,"#2e3340");ctx.restore();}

/* ----------------------------- RENDER UI --------------------------------- */
function renderMatch(){
  app.innerHTML=`<div class="screen">
    <div class="scoreboard">
      <div class="team home"><div class="nm">${G.st.beasts.home.crest} Couraça</div>
        <div class="stabar"><div id="staH" style="width:100%"></div></div>
        <div style="font-size:10px" class="muted">STA <span id="staHn">100</span></div></div>
      <div class="scoremid"><div class="sc"><span id="scH">0</span> <span class="muted">:</span> <span id="scA">0</span></div>
        <div class="turn" id="turnLbl">Turno 1 / ${TURNS}</div></div>
      <div class="team away"><div class="nm">Górtax ${G.st.beasts.away.crest}</div>
        <div class="stabar"><div id="staA" style="width:100%;background:linear-gradient(90deg,#c0392b,#ff6b6b)"></div></div>
        <div style="font-size:10px;text-align:right" class="muted">STA <span id="staAn">100</span></div></div>
    </div>
    <div class="dir" id="dir"></div>
    <div class="zonebar" id="zonebar"></div>
    <canvas id="pitch" width="${FW}" height="${FH}"></canvas>
    <div class="card-ui">
      <div class="zonelabel"><span id="zoneTitle">Sua jogada</span><span id="zoneRule" class="muted"></span></div>
      <div class="playzone empty" id="playzone"></div>
      <div class="controls"><button class="btn primary full" id="exec">▶ Executar jogada</button>
        <button class="btn ghost" id="clearp">limpar</button></div>
      <div class="zonelabel" style="margin-top:8px"><span>Sua mão</span><span class="muted" id="handHint"></span></div>
      <div class="hand" id="hand"></div>
    </div>
    <div id="log"></div>
    <button class="btn ghost full" id="restart" style="margin-top:8px">↻ Reiniciar</button>
  </div>`;
  G.canvas=$("#pitch");G.ctx=G.canvas.getContext("2d");
  $("#exec").onclick=executePlay;
  $("#clearp").onclick=()=>{if(G.busy)return;G.play=[];renderHandArea();};
  $("#restart").onclick=()=>{cancelAnimationFrame(G.raf);startGame();};
  renderHud();
}
function renderZonebar(){
  const zb=$("#zonebar");if(!zb)return; const atk=G.st.possession;
  zb.innerHTML=ZNAMES.map((nm,i)=>{
    const ball=i===G.st.pos, shoot=inShootZone(atk,i);
    return `<div class="zcell ${ball?'ball':''} ${shoot?'shoot':''}"><span class="zl">${nm}</span><span class="b">${ball?'⚽':''}</span></div>`;
  }).join("");
  const d=$("#dir"); if(d) d.innerHTML = G.st.possession==="home"
    ? `${G.st.beasts.home.crest} Couraça ataca →  <span class="muted">(precisa chegar em <b>Ataque ⚽</b> p/ finalizar)</span>`
    : `<span class="muted">(defenda!)</span>  ← ataca Górtax ${G.st.beasts.away.crest}`;
}
function cardEl(c,mini,onclick,disabled){
  const el=document.createElement("div");
  el.className=`pcard ${c.type} ${mini?"mini":""} ${disabled?"disabled":""}`;
  const vals=[]; if(c.adv)vals.push("avanço "+c.adv); if(c.shot)vals.push("chute "+c.shot);
  if(c.guard)vals.push("guarda "+c.guard); if(c.steal)vals.push("desarme "+c.steal);
  if(c.pierce)vals.push("fura "+c.pierce); if(c.sta)vals.push("💥STA "+c.sta);
  el.innerHTML=`<div class="tag">${typeLabel(c.type)}</div><div class="ic">${c.ic}</div>
    <div class="nm">${c.nm}</div><div class="vals">${vals.join(" · ")}</div><div class="ds">${c.ds}</div>`;
  el.onclick=onclick; return el;
}
function typeLabel(t){return{support:"AVANÇO",finish:"FINAL.",impact:"IMPACTO",block:"GUARDA",tackle:"DESARME",pressure:"PRESSÃO"}[t]||t;}
function renderHandArea(){
  renderZonebar();
  const atk=G.st.possession==="home";
  const inZone=inShootZone("home",G.st.pos);
  $("#zoneTitle").textContent= atk?"Sua jogada (ataque)":"Sua jogada (defesa)";
  $("#zoneRule").textContent= (atk?(inZone?"pode finalizar! · ":"avance até Ataque p/ finalizar · "):"")+`até ${MAXPLAY} (${G.play.length}/${MAXPLAY})`;
  $("#handHint").textContent="toque p/ jogar";
  const pz=$("#playzone");pz.innerHTML="";pz.classList.toggle("empty",G.play.length===0);
  G.play.forEach((c,idx)=>pz.appendChild(cardEl(c,true,()=>{if(G.busy)return;G.play.splice(idx,1);renderHandArea();})));
  const hd=$("#hand");hd.innerHTML="";
  G.hand.forEach(c=>{
    const used=G.play.includes(c);
    const finishBlocked=c.type==="finish"&&(!inZone||G.play.some(x=>x.type==="finish"));
    const capBlocked=!used&&G.play.length>=MAXPLAY;
    const el=cardEl(c,false,()=>{
      if(G.busy)return;
      if(used){G.play=G.play.filter(x=>x!==c);}
      else{
        if(c.type==="finish"&&!inZone){toast("Só dá pra finalizar na Zona de Ataque!");return;}
        if(c.type==="finish"&&G.play.some(x=>x.type==="finish")){toast("Só 1 finalização por turno!");return;}
        if(G.play.length>=MAXPLAY){toast("Máximo de "+MAXPLAY+" cartas");return;}
        G.play.push(c);
      }
      renderHandArea();
    },(finishBlocked||capBlocked)&&!used);
    if(used)el.style.outline="2px solid var(--gold)";
    hd.appendChild(el);
  });
}
function renderHud(){
  const st=G.st,set=(id,v)=>{const e=$("#"+id);if(e)e.textContent=v;};
  set("scH",st.score.home);set("scA",st.score.away);set("staHn",Math.round(st.sta.home));set("staAn",Math.round(st.sta.away));
  const sh=$("#staH");if(sh)sh.style.width=(st.sta.home/STA_MAX*100)+"%";
  const sa=$("#staA");if(sa)sa.style.width=(st.sta.away/STA_MAX*100)+"%";
  set("turnLbl",st.suddenDeath?"MORTE SÚBITA":`Turno ${Math.min(st.turn,TURNS)} / ${TURNS}`);
  renderZonebar();
}
function banner(cb){
  const atk=G.st.possession==="home";
  const ov=document.createElement("div");ov.id="banner";
  ov.innerHTML=`<div class="big"><div class="t1">${G.st.suddenDeath?"MORTE SÚBITA":"TURNO "+Math.min(G.st.turn,TURNS)+" / "+TURNS}</div>
    <div class="t2" style="color:${atk?'var(--home)':'var(--away)'}">${atk?"⚔️ SEU ATAQUE":"🛡️ DEFENDA!"}</div></div>`;
  document.body.appendChild(ov);setTimeout(()=>{ov.remove();cb&&cb();},950);
}
function showResult(end){
  cancelAnimationFrame(G.raf);
  const win=end.winner==="home";
  const names={home:"Couraça",away:"Górtax"};
  const reason={KO:"por NOCAUTE de STA! 💀",TIME:"no placar ao fim dos turnos.",GOLDEN:"com GOL DE OURO na morte súbita! ✨",GOLEADA:"por GOLEADA (5 de diferença)! 🔥"}[end.reason];
  app.innerHTML=`<div class="screen center" style="padding-top:6vh">
    <div style="font-size:58px">${win?"🏆":"💀"}</div>
    <h1 class="${win?'gold':'bad'}">${win?"VITÓRIA!":"Derrota"}</h1>
    <p>${names[end.winner]} venceu ${reason}</p>
    <div class="card-ui" style="margin-top:14px;display:inline-block;min-width:260px">
      <h3>Placar final</h3>
      <p style="font-size:22px;font-weight:900;color:var(--txt)">${G.st.score.home} <span class="muted">x</span> ${G.st.score.away}</p>
      <p class="muted" style="font-size:12px">STA — Couraça ${Math.round(G.st.sta.home)} · Górtax ${Math.round(G.st.sta.away)}</p>
    </div>
    <button class="btn primary full" id="again" style="margin-top:16px;max-width:300px">↻ Jogar de novo</button>
    <p class="muted" style="font-size:11px;margin-top:16px">World Cup Beasts · Cartas determinísticas + zonas (Parte 1)</p>
  </div>`;
  $("#again").onclick=startGame;
}
function log(cls,html){const box=$("#log");if(!box)return;const d=document.createElement("div");d.className="e "+(cls||"");d.innerHTML=html;box.appendChild(d);box.scrollTop=box.scrollHeight;}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1400);}

function screenTitle(){
  app.innerHTML=`<div class="screen center" style="padding-top:6vh">
    <div style="font-size:54px">🛡️⚽</div><h1>WORLD CUP BEASTS</h1>
    <p style="max-width:450px;margin:6px auto">Duelo de cartas onde tudo é <b>valor vs valor</b> — sem sorte na resolução.
      Você comanda <b class="gold">Couraça, o Tatu de Guerra</b>.</p>
    <div class="card-ui" style="max-width:440px;margin:14px auto;text-align:left">
      <h3>Como funciona</h3>
      <p>• <b>${TURNS} turnos.</b> Quem tem a bola <b>ataca</b>; o outro <b>defende</b>.</p>
      <p>• <b>Campo em 4 zonas.</b> Avance (avanço vs guarda) até a <b>Zona de Ataque</b> para poder <b>finalizar</b>.</p>
      <p>• <b>Tudo é número:</b> roubo = seu controle vs desarme do rival · gol = chute vs guarda · atingiu o alvo, <b>acontece</b>.</p>
      <p>• Regras: <b>1 finalização</b>/turno, resto empilha (até ${MAXPLAY}). <b>STA = vida</b> (💥); zerou = nocaute.</p>
      <p>• Vitória: placar (empate→morte súbita) · <b>5 de diferença</b> · <b>nocaute</b>.</p>
    </div>
    <button class="btn primary" id="play" style="max-width:300px;width:100%">▶ Entrar em campo</button>
    <p class="muted" style="font-size:11px;margin-top:16px">Parte 1 — cartas determinísticas + zonas</p>
  </div>`;
  $("#play").onclick=startGame;
}

/* --------- exporta lógica pura p/ teste headless -------------------------- */
if(typeof module!=="undefined"&&module.exports){
  module.exports={freshState,resolveContest,aiPick,applyTurn,checkEnd,drawHand,inShootZone,CARDS,BEASTS,
    set:o=>{if(o.IMPACT_DMG!=null){IMPACT_DMG=o.IMPACT_DMG;CARDS.pancada.sta=o.IMPACT_DMG;CARDS.carrinho.sta=o.IMPACT_DMG;}
      if(o.FATIGUE!=null)FATIGUE=o.FATIGUE; if(o.TURNS!=null)TURNS=o.TURNS;}};
}
if(typeof document!=="undefined") screenTitle();
</script>
