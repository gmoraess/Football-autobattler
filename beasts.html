<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>World Cup Beasts — Sandbox do Slot (Parte 1)</title>
<style>
  :root{
    --bg:#0a0e1a; --panel:#131a2e; --panel2:#1b2540; --line:#2a3556;
    --txt:#e8edf7; --muted:#8a96b8; --gold:#f5c451; --good:#4fd18b; --bad:#ff6b6b;
    --home:#4fb0d1; --away:#d14f4f; --reel:#0c1120;
    --shadow:0 8px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:radial-gradient(120% 80% at 50% 0%,#161d33,#070a14);
    color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    overflow-x:hidden}
  body{display:flex;justify-content:center}
  #app{width:100%;max-width:760px;min-height:100vh;padding:12px 12px 40px;position:relative}
  h1,h2,h3{margin:0 0 .35em;font-weight:800}
  h1{font-size:26px} h2{font-size:20px}
  p{line-height:1.5;color:var(--muted);margin:.3em 0}
  .center{text-align:center} .muted{color:var(--muted)} .gold{color:var(--gold)}
  .good{color:var(--good)} .bad{color:var(--bad)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(180deg,#2b3a63,#202c4e);color:var(--txt);border:1px solid var(--line);
    padding:12px 16px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
    transition:transform .06s,filter .15s;user-select:none}
  .btn:hover{filter:brightness(1.12)} .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(180deg,#f5c451,#e0a72f);color:#241a00;border-color:#caa033}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
  .btn.full{width:100%}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
  .screen{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* scoreboard */
  .scoreboard{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:8px}
  .team{display:flex;flex-direction:column;gap:5px}
  .team.away{align-items:flex-end}
  .team .nm{font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px}
  .stabar{height:14px;border-radius:8px;background:#2a1414;overflow:hidden;border:1px solid var(--line);width:100%}
  .stabar>div{height:100%;transition:width .4s}
  .team .stabar>div{background:linear-gradient(90deg,#2e9c66,var(--good))}
  .scoremid{text-align:center}
  .scoremid .sc{font-size:30px;font-weight:900}
  .scoremid .turn{font-size:12px;color:var(--muted)}
  .possess{display:flex;justify-content:center;gap:8px;margin:6px 0;font-size:12px;font-weight:700}
  .possess .on{color:var(--gold)}

  /* canvas pitch */
  #pitch{width:100%;display:block;border-radius:12px;border:2px solid #0c4a20;
    box-shadow:inset 0 0 40px rgba(0,0,0,.5);margin-bottom:8px;background:#1a6b32}

  /* slot */
  .slot{display:flex;justify-content:center;gap:10px;margin:6px 0 4px}
  .reel{width:74px;height:74px;border-radius:14px;background:var(--reel);border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:40px;
    box-shadow:inset 0 4px 10px rgba(0,0,0,.6)}
  .reel.land{animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(1.18);border-color:var(--gold)}100%{transform:scale(1)}}
  .payline{text-align:center;min-height:22px;font-weight:800;font-size:15px;margin:2px 0 8px}

  .actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .act{padding:12px 6px;font-size:13px;line-height:1.25;text-align:center;flex-direction:column}
  .act small{display:block;color:var(--muted);font-size:10px;margin-top:3px;font-weight:600}
  .act.atk{border-color:#3a5a8a} .act.def{border-color:#8a5a3a}

  #log{height:104px;overflow-y:auto;background:#0c1120;border:1px solid var(--line);border-radius:12px;
    padding:9px;font-size:13px;line-height:1.5;margin-top:10px}
  #log .e{margin-bottom:3px}
  #log .goal{color:var(--gold);font-weight:800} #log .ko{color:var(--bad);font-weight:800}
  #log .good{color:var(--good)} #log .sys{color:#c0a0ff} #log .miss{color:#ffb07a}

  /* slow-mo overlay */
  #slowmo{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(60% 60% at 50% 50%,rgba(10,14,26,.2),rgba(5,8,15,.92));
    pointer-events:none}
  #slowmo .big{text-align:center;animation:zoomin 1.1s ease both}
  #slowmo .t1{font-size:14px;letter-spacing:4px;color:var(--muted);font-weight:800}
  #slowmo .t2{font-size:40px;font-weight:900;text-shadow:0 4px 24px rgba(0,0,0,.8)}
  #slowmo .t3{font-size:12px;color:var(--muted);margin-top:6px}
  @keyframes zoomin{0%{transform:scale(2.2);opacity:0;filter:blur(6px)}
    35%{transform:scale(1);opacity:1;filter:blur(0)}80%{opacity:1}100%{opacity:.92}}

  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#000c;border:1px solid var(--gold);
    color:var(--gold);padding:9px 16px;border-radius:10px;font-weight:800;z-index:99;animation:fade .25s}
  .hidden{display:none!important}
  .legend{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:8px}
  .legend span{font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px 6px}
  @media(max-width:520px){ .reel{width:62px;height:62px;font-size:32px} #slowmo .t2{font-size:32px} }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ===========================================================================
   WORLD CUP BEASTS — Parte 1: Sandbox da MÁQUINA DE SLOT
   Duelo de futebol por turnos. Posse define ataque/defesa. O slot resolve o
   lance. STA = vida: zerou, é NOCAUTE (derrota imediata). 9 turnos; empate ->
   morte súbita (primeiro a marcar OU zerar a STA do adversário).
   A lógica de resolução é pura (testável headless), separada do render.
   ========================================================================= */
const $=(s,el=document)=>el.querySelector(s);
const app=$("#app");
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[ri(0,a.length-1)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ------------------------------- AJUSTES --------------------------------- */
const TURNS=9, STA_MAX=100, MERCY=5;   // MERCY = diferença de gols que encerra por goleada
let IMPACT_DMG=8;     // dano de STA por símbolo 💥
let FATIGUE=3;        // STA perdida por time a cada turno (cansaço)
let GOAL_TH=3.4;      // limiar de eficácia p/ converter chute em gol

/* ------------------------------- SÍMBOLOS -------------------------------- */
const SYM={
  "G":{ic:"⚽",nm:"Gol"}, "T":{ic:"🎯",nm:"Mira"}, "D":{ic:"👟",nm:"Drible"},
  "P":{ic:"🔁",nm:"Passe"}, "X":{ic:"⭕",nm:"Erro"}, "B":{ic:"💥",nm:"Impacto"},
  "S":{ic:"🧤",nm:"Defesa"}, "R":{ic:"✋",nm:"Desarme"}, "L":{ic:"🧱",nm:"Bloqueio"},
  "F":{ic:"😖",nm:"Pressão"}, "V":{ic:"⚠️",nm:"Vacilo"},
};
const ATK_POOL=["G","T","D","P","X","B"];
const DEF_POOL=["S","R","L","F","V","B"];

const ATK_ACTIONS={
  finalizar:{label:"⚽ Finalizar",hint:"vai pro gol",weights:{G:5,T:3,X:3,D:1,P:1,B:1}},
  driblar  :{label:"👟 Driblar",  hint:"cria e mantém",weights:{D:5,T:2,P:2,G:1,X:2,B:1}},
  bicuda   :{label:"💥 Bicuda",   hint:"força + dano STA",weights:{B:4,G:3,T:1,X:3,D:1,P:0}},
};
const DEF_ACTIONS={
  desarmar:{label:"✋ Desarmar",   hint:"rouba a bola",weights:{R:5,F:2,V:3,S:1,L:1,B:1}},
  defender:{label:"🧤 Defender",   hint:"segura o lance",weights:{S:4,L:4,F:1,V:2,R:1,B:0}},
  marcacao:{label:"💥 Marcação Dura",hint:"pressão + dano STA",weights:{B:4,F:3,V:3,L:1,R:1,S:0}},
};

/* ------------------------------- FERAS ----------------------------------- */
const BEASTS={
  tatu :{key:"tatu", name:"Couraça, o Tatu de Guerra", crest:"🛡️", color:"var(--home)", ATK:5,DEF:6,TEC:5},
  mino :{key:"mino", name:"Górtax, Minotauro de Ônix", crest:"🐂", color:"var(--away)", ATK:6,DEF:4,TEC:4},
};

/* ===================== LÓGICA PURA (testável headless) ==================== */
function freshState(home,away){
  return {beasts:{home,away}, turn:1, possession:"home",
    score:{home:0,away:0}, sta:{home:STA_MAX,away:STA_MAX},
    suddenDeath:false, over:false, winner:null, reason:null};
}
function countSyms(arr){ const c={}; for(const s of arr) c[s]=(c[s]||0)+1; return c; }
function buildWeights(base,actorSta,mode){
  const w={...base};
  const tired=1-actorSta/STA_MAX;          // cansaço injeta erros
  const failKey=mode==="atk"?"X":"V";
  w[failKey]=(w[failKey]||0)+tired*4;
  return w;
}
function spinOne(w){ let tot=0; for(const k in w) tot+=w[k]; let r=Math.random()*tot;
  for(const k in w){ r-=w[k]; if(r<=0) return k; } return Object.keys(w)[0]; }
function spin(w){ return [spinOne(w),spinOne(w),spinOne(w)]; }

function resolveAttack(sym,st){
  const home=st.beasts.home, away=st.beasts.away, c=countSyms(sym);
  const goal=2*(c.G||0)+(c.T||0);
  const pos=(c.D||0)+2*(c.P||0);
  const fail=2*(c.X||0);
  const impact=(c.B||0);
  const r={goalHome:0,goalAway:0,staHome:0,staAway:0,possession:"away",type:"",text:""};
  r.staAway-=impact*IMPACT_DMG;
  const defF=away.DEF*0.5*(0.5+0.5*st.sta.away/STA_MAX);
  const eff=goal+home.ATK*0.2-defF;
  if((c.G||0)>=3){ r.goalHome=1; r.type="GOAL"; r.text="⚽⚽⚽ GOL CERTEIRO!"; }
  else if(goal>0&&eff>=GOAL_TH){ r.goalHome=1; r.type="GOAL"; r.text="GOOOL!"; }
  else if(goal>0){ r.type="MISS"; r.text=pick(["Na trave! 😤","Pra fora! 😩","O goleiro defendeu! 🧤"]); }
  else if(pos>0&&pos>=fail){ r.type="KEEP"; r.possession="home"; r.text="Boa jogada — mantém a posse. 👟"; }
  else { r.type="LOSE"; r.text="Perdeu a bola. 🔄"; }
  if(impact>0) r.text+=` 💥 (-${impact*IMPACT_DMG} STA do adversário)`;
  return r;
}
function resolveDefense(sym,st){
  const home=st.beasts.home, away=st.beasts.away, c=countSyms(sym);
  const def=2*(c.S||0)+2*(c.L||0)+(c.F||0);
  const steal=2*(c.R||0);
  const force=(c.F||0);
  const fail=2*(c.V||0);
  const impact=(c.B||0);
  const r={goalHome:0,goalAway:0,staHome:0,staAway:0,possession:"away",type:"",text:""};
  r.staAway-=impact*IMPACT_DMG;
  const atkP=away.ATK*0.6*(0.5+0.5*st.sta.away/STA_MAX)+rnd(0,3);
  if(steal>0&&steal+home.TEC*0.3>=atkP){ r.type="STEAL"; r.possession="home"; r.text="✋ ROUBOU A BOLA!"; }
  else if(def>0&&def+home.DEF*0.3>=atkP){ r.type="DEFEND"; r.possession="home"; r.text="🧤 Defendeu e recuperou a bola!"; }
  else if(force>0&&Math.random()<0.55){ r.type="FORCE"; r.possession="home"; r.text="😖 Sua pressão forçou o erro!"; }
  else {
    const concede=Math.random()<clamp(0.35+(atkP-def)*0.05+fail*0.05,0.12,0.82);
    if(concede){ r.goalAway=1; r.possession="home"; r.staHome-=4; r.type="CONCEDE"; r.text="Sofreu um gol... ⚽"; }
    else { r.possession="away"; r.staHome-=2; r.type="BEATEN"; r.text="O adversário mantém a pressão."; }
  }
  if(impact>0) r.text+=` 💥 (-${impact*IMPACT_DMG} STA do adversário)`;
  return r;
}
function computeTurn(st,action){
  let symbols,res;
  if(st.possession==="home"){
    symbols=spin(buildWeights(ATK_ACTIONS[action].weights,st.sta.home,"atk"));
    res=resolveAttack(symbols,st);
  } else {
    symbols=spin(buildWeights(DEF_ACTIONS[action].weights,st.sta.home,"def"));
    res=resolveDefense(symbols,st);
  }
  res.symbols=symbols; return res;
}
function applyTurn(st,res){
  st.score.home+=res.goalHome; st.score.away+=res.goalAway;
  st.sta.home=clamp(st.sta.home+res.staHome-FATIGUE,0,STA_MAX);
  st.sta.away=clamp(st.sta.away+res.staAway-FATIGUE,0,STA_MAX);
  st.possession=res.possession;
  st.turn++;
}
function checkEnd(st,res){
  // 1) STA zerada = NOCAUTE (vale inclusive na morte súbita)
  if(st.sta.away<=0){ return finish(st,"home","KO"); }
  if(st.sta.home<=0){ return finish(st,"away","KO"); }
  // 2) 5 gols de diferença = GOLEADA (vitória imediata)
  const diff=st.score.home-st.score.away;
  if(diff>=MERCY) return finish(st,"home","GOLEADA");
  if(diff<=-MERCY) return finish(st,"away","GOLEADA");
  if(st.suddenDeath){
    if(res.goalHome) return finish(st,"home","GOLDEN");
    if(res.goalAway) return finish(st,"away","GOLDEN");
    return {over:false};
  }
  if(st.turn>TURNS){
    if(st.score.home!==st.score.away)
      return finish(st,st.score.home>st.score.away?"home":"away","TIME");
    st.suddenDeath=true; // empate -> morte súbita
  }
  return {over:false};
}
function finish(st,winner,reason){ st.over=true; st.winner=winner; st.reason=reason; return {over:true,winner,reason}; }

/* ============================== JOGO (UI) ================================ */
let G=null;   // estado da partida atual + refs visuais

function startGame(){
  const st=freshState({...BEASTS.tatu},{...BEASTS.mino});
  G={st, ctx:null, canvas:null, busy:false, vfx:[], shake:0, ballAnim:0, raf:0};
  renderMatch();
  log("sys",`🏟️ ${G.st.beasts.home.crest} ${G.st.beasts.home.name} <span class="muted">vs</span> ${G.st.beasts.away.crest} ${G.st.beasts.away.name}`);
  log("sys","STA é vida: zerou, é NOCAUTE. 9 turnos — empate vira morte súbita.");
  loopStart();
  nextTurn();
}

function nextTurn(){
  if(G.st.over) return;
  G.busy=true; renderHud(); setActionsEnabled(false);
  slowmoIntro(()=>{ setActions(); G.busy=false; });
}

function onAction(action){
  if(G.busy||G.st.over) return;
  G.busy=true; setActionsEnabled(false);
  const res=computeTurn(G.st,action);
  const pool=G.st.possession==="home"?ATK_POOL:DEF_POOL;
  $("#payline").textContent="";
  animateReels(res.symbols,pool,()=>revealResult(res));
}

function revealResult(res){
  // VFX por tipo
  if(res.goalHome||res.goalAway){ G.shake=14; burst(res.goalHome?"home":"away","#f5c451",26); }
  else if(res.type==="MISS"){ G.shake=4; }
  if(res.staAway<0){ G.shake=Math.max(G.shake,9); burst("away","#ff7b2d",16); }
  const cls=res.goalHome?"goal":res.goalAway?"miss":res.type==="STEAL"||res.type==="DEFEND"||res.type==="FORCE"||res.type==="KEEP"?"good":res.type==="MISS"?"miss":"";
  $("#payline").innerHTML=`<span class="${cls}">${res.symbols.map(s=>SYM[s].ic).join(" ")} — ${res.text}</span>`;
  log(cls,`T${G.st.turn}: ${res.text}`);
  applyTurn(G.st,res);
  renderHud();
  const end=checkEnd(G.st,res);
  setTimeout(()=>{
    if(end.over) showResult(end);
    else nextTurn();
  },1050);
}

/* ----------------------------- RENDER ------------------------------------ */
function renderMatch(){
  app.innerHTML=`<div class="screen">
    <div class="scoreboard">
      <div class="team home">
        <div class="nm">${G.st.beasts.home.crest} <span>Couraça</span></div>
        <div class="stabar"><div id="staH" style="width:100%"></div></div>
        <div style="font-size:10px" class="muted">STA <span id="staHn">100</span></div>
      </div>
      <div class="scoremid">
        <div class="sc"><span id="scH">0</span> <span class="muted">:</span> <span id="scA">0</span></div>
        <div class="turn" id="turnLbl">Turno 1 / ${TURNS}</div>
      </div>
      <div class="team away">
        <div class="nm"><span>Górtax</span> ${G.st.beasts.away.crest}</div>
        <div class="stabar"><div id="staA" style="width:100%;background:linear-gradient(90deg,#c0392b,#ff6b6b)"></div></div>
        <div style="font-size:10px;text-align:right" class="muted">STA <span id="staAn">100</span></div>
      </div>
    </div>
    <div class="possess"><span id="posH">⚔️ Você ataca</span><span class="muted">·</span><span id="posA">🛡️ Você defende</span></div>
    <canvas id="pitch" width="600" height="220"></canvas>
    <div class="card">
      <div class="slot">
        <div class="reel" id="r0">❔</div><div class="reel" id="r1">❔</div><div class="reel" id="r2">❔</div>
      </div>
      <div class="payline" id="payline">Escolha sua ação e gire!</div>
      <div class="actions" id="actions"></div>
    </div>
    <div id="log"></div>
    <div class="legend" id="legend"></div>
    <button class="btn ghost full" id="restart" style="margin-top:10px">↻ Reiniciar partida</button>
  </div>`;
  G.canvas=$("#pitch"); G.ctx=G.canvas.getContext("2d");
  $("#restart").onclick=()=>{ cancelAnimationFrame(G.raf); startGame(); };
  renderLegend();
  renderHud();
}
function renderLegend(){
  const mode=G.st.possession==="home"?ATK_POOL:DEF_POOL;
  $("#legend").innerHTML=mode.map(s=>`<span>${SYM[s].ic} ${SYM[s].nm}</span>`).join("");
}
function setActions(){
  const atk=G.st.possession==="home";
  const acts=atk?ATK_ACTIONS:DEF_ACTIONS;
  $("#actions").innerHTML=Object.entries(acts).map(([k,a])=>
    `<button class="btn act ${atk?'atk':'def'}" data-act="${k}">${a.label}<small>${a.hint}</small></button>`).join("");
  app.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>onAction(b.dataset.act));
  renderLegend();
  $("#payline").textContent = atk?"Sua posse: escolha como atacar.":"Posse do rival: escolha como defender.";
}
function setActionsEnabled(on){ app.querySelectorAll("[data-act]").forEach(b=>b.disabled=!on); }
function renderHud(){
  const st=G.st;
  const set=(id,v)=>{const e=$("#"+id);if(e)e.textContent=v;};
  set("scH",st.score.home); set("scA",st.score.away);
  set("staHn",Math.round(st.sta.home)); set("staAn",Math.round(st.sta.away));
  const sh=$("#staH"); if(sh)sh.style.width=(st.sta.home/STA_MAX*100)+"%";
  const sa=$("#staA"); if(sa)sa.style.width=(st.sta.away/STA_MAX*100)+"%";
  set("turnLbl",st.suddenDeath?"MORTE SÚBITA":`Turno ${Math.min(st.turn,TURNS)} / ${TURNS}`);
  const ph=$("#posH"),pa=$("#posA");
  if(ph)ph.className=st.possession==="home"?"on":""; if(pa)pa.className=st.possession==="away"?"on":"";
}

/* ------------------------- ANIMAÇÃO DO SLOT ------------------------------ */
function animateReels(symbols,pool,cb){
  const reels=[$("#r0"),$("#r1"),$("#r2")];
  const spinning=[true,true,true];
  const iv=setInterval(()=>{ reels.forEach((r,i)=>{ if(spinning[i]) r.textContent=SYM[pick(pool)].ic; }); },70);
  symbols.forEach((s,i)=>setTimeout(()=>{
    spinning[i]=false; reels[i].textContent=SYM[s].ic;
    reels[i].classList.add("land"); setTimeout(()=>reels[i].classList.remove("land"),300);
    if(i===2){ clearInterval(iv); setTimeout(cb,360); }
  },520+i*430));
}

/* --------------------------- SLOW-MO INTRO ------------------------------- */
function slowmoIntro(cb){
  const atk=G.st.possession==="home";
  const ov=document.createElement("div"); ov.id="slowmo";
  ov.innerHTML=`<div class="big">
    <div class="t1">${G.st.suddenDeath?"MORTE SÚBITA":"TURNO "+Math.min(G.st.turn,TURNS)+" / "+TURNS}</div>
    <div class="t2" style="color:${atk?'var(--home)':'var(--away)'}">${atk?"⚔️ SEU ATAQUE":"🛡️ DEFENDA!"}</div>
    <div class="t3">câmera lenta — prepare a jogada</div></div>`;
  document.body.appendChild(ov);
  setTimeout(()=>{ ov.remove(); cb(); },1150);
}

/* ------------------------------- CANVAS ---------------------------------- */
function loopStart(){ const f=()=>{ drawPitch(); G.raf=requestAnimationFrame(f); }; G.raf=requestAnimationFrame(f); }
function burst(side,color,n){ const x=side==="home"?150:450,y=150;
  for(let i=0;i<n;i++){ const a=Math.random()*7,s=rnd(40,180);
    G.vfx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.7,max:.7,color,size:rnd(2,5)}); } }
function drawPitch(){
  const ctx=G.ctx,W=600,H=220; if(!ctx)return;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);
  ctx.save();
  if(G.shake>0.3){ ctx.translate(rnd(-G.shake,G.shake),rnd(-G.shake,G.shake)); G.shake*=0.85; }
  for(let i=0;i<8;i++){ ctx.fillStyle=i%2?"#176028":"#1a6b32"; ctx.fillRect(i*W/8,0,W/8+1,H); }
  ctx.strokeStyle="rgba(255,255,255,.4)"; ctx.lineWidth=2;
  ctx.strokeRect(8,8,W-16,H-16);
  ctx.beginPath(); ctx.moveTo(W/2,8); ctx.lineTo(W/2,H-8); ctx.stroke();
  ctx.beginPath(); ctx.arc(W/2,H/2,34,0,7); ctx.stroke();
  ctx.fillStyle="rgba(255,255,255,.85)"; ctx.fillRect(2,H/2-34,6,68); ctx.fillRect(W-8,H/2-34,6,68);
  // feras
  drawTatu(ctx,150,150,G.st.possession==="home");
  drawMino(ctx,450,150,G.st.possession==="away");
  // bola (perto de quem tem a posse) com runa de alvo
  const bx=G.st.possession==="home"?215:385;
  drawBall(ctx,bx,158);
  // vfx
  for(let i=G.vfx.length-1;i>=0;i--){ const v=G.vfx[i]; v.x+=v.vx*0.016;v.y+=v.vy*0.016;v.vx*=0.92;v.vy*=0.92;v.life-=0.016;
    if(v.life<=0){G.vfx.splice(i,1);continue;} ctx.globalAlpha=clamp(v.life/v.max,0,1); ctx.fillStyle=v.color;
    ctx.beginPath();ctx.arc(v.x,v.y,v.size,0,7);ctx.fill(); } ctx.globalAlpha=1;
  ctx.restore();
}
function px(ctx,x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }
function drawTatu(ctx,cx,cy,active){
  ctx.save(); ctx.translate(cx,cy); if(active){ctx.shadowColor="#4fb0d1";ctx.shadowBlur=16;}
  // sombra
  ctx.shadowBlur=active?16:0; px(ctx,-22,42,44,8,"rgba(0,0,0,.3)");
  // corpo (couraça)
  px(ctx,-20,-6,40,46,"#7a6a4a"); px(ctx,-20,-6,40,10,"#9c8a64");
  for(let i=-16;i<18;i+=8){ px(ctx,i,-6,2,46,"#5a4d34"); } // placas
  // peito runa vermelha
  px(ctx,-6,8,12,3,"#b3372f"); px(ctx,-2,4,3,18,"#b3372f");
  // cabeça
  px(ctx,-12,-30,24,26,"#8a7a58"); px(ctx,-12,-30,24,8,"#5a4d34"); // capacete couraça
  px(ctx,4,-20,8,5,"#c9b889"); // focinho
  px(ctx,-7,-19,4,4,"#39d0ff"); // olho azul
  // braços
  px(ctx,-26,0,8,22,"#7a6a4a"); px(ctx,18,0,8,22,"#7a6a4a");
  // pernas
  px(ctx,-14,40,9,12,"#3a3f55"); px(ctx,5,40,9,12,"#3a3f55");
  ctx.restore();
}
function drawMino(ctx,cx,cy,active){
  ctx.save(); ctx.translate(cx,cy); if(active){ctx.shadowColor="#ff6b6b";ctx.shadowBlur=16;}
  px(ctx,-24,42,48,8,"rgba(0,0,0,.3)");
  px(ctx,-22,-8,44,48,"#2e3340"); px(ctx,-22,-8,44,10,"#3c4252");
  px(ctx,-7,6,14,3,"#c0392b"); // runa
  px(ctx,-13,-32,26,26,"#3a4150"); // cabeça
  // chifres
  px(ctx,-20,-34,8,5,"#cbb58a"); px(ctx,12,-34,8,5,"#cbb58a");
  px(ctx,-22,-39,5,6,"#cbb58a"); px(ctx,17,-39,5,6,"#cbb58a");
  px(ctx,-9,-22,5,5,"#ff5151"); px(ctx,4,-22,5,5,"#ff5151"); // olhos vermelhos
  px(ctx,-2,-16,8,4,"#6a3030"); // focinho
  px(ctx,-30,-2,9,24,"#2e3340"); px(ctx,21,-2,9,24,"#2e3340");
  px(ctx,-15,40,10,12,"#23272f"); px(ctx,6,40,10,12,"#23272f");
  ctx.restore();
}
function drawBall(ctx,x,y){
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle="#cdb89a"; ctx.beginPath(); ctx.arc(0,0,9,0,7); ctx.fill();
  ctx.strokeStyle="#5a4a36"; ctx.lineWidth=1.5; ctx.stroke();
  // runa de alvo vermelha
  ctx.strokeStyle="#ff3b3b"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(0,0,5,0,7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-8,0);ctx.lineTo(8,0);ctx.moveTo(0,-8);ctx.lineTo(0,8); ctx.stroke();
  ctx.restore();
}

/* ------------------------------ RESULTADO -------------------------------- */
function showResult(end){
  cancelAnimationFrame(G.raf);
  const win=end.winner==="home";
  const names={home:"Couraça, o Tatu de Guerra",away:"Górtax, Minotauro de Ônix"};
  const reasonTxt={KO:"por NOCAUTE de stamina! 💀",TIME:"no placar ao fim dos 9 turnos.",GOLDEN:"com um GOL DE OURO na morte súbita! ✨",GOLEADA:"por GOLEADA (5 gols de diferença)! 🔥"}[end.reason];
  app.innerHTML=`<div class="screen center" style="padding-top:6vh">
    <div style="font-size:60px">${win?"🏆":"💀"}</div>
    <h1 class="${win?'gold':'bad'}">${win?"VITÓRIA!":"Derrota"}</h1>
    <p>${names[end.winner]} venceu ${reasonTxt}</p>
    <div class="card" style="margin-top:14px;display:inline-block;min-width:260px">
      <h3>Placar final</h3>
      <p style="font-size:22px;font-weight:900;color:var(--txt)">${G.st.score.home} <span class="muted">x</span> ${G.st.score.away}</p>
      <p class="muted" style="font-size:12px">STA final — Couraça ${Math.round(G.st.sta.home)} · Górtax ${Math.round(G.st.sta.away)}</p>
    </div>
    <button class="btn primary full" id="again" style="margin-top:16px;max-width:300px">↻ Jogar de novo</button>
    <p class="muted" style="font-size:11px;margin-top:18px">World Cup Beasts · Sandbox do Slot (Parte 1) — protótipo de validação</p>
  </div>`;
  $("#again").onclick=startGame;
}

/* -------------------------------- UTIL ----------------------------------- */
function log(cls,html){ const box=$("#log"); if(!box)return;
  const d=document.createElement("div"); d.className="e "+(cls||""); d.innerHTML=html;
  box.appendChild(d); box.scrollTop=box.scrollHeight; }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),1500); }
