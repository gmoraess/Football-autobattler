<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Mundial dos Mitos — MVP</title>
<style>
  :root{
    --bg:#0a0e1a; --panel:#131a2e; --panel2:#1b2540; --line:#2a3556;
    --txt:#e8edf7; --muted:#8a96b8; --gold:#f5c451; --good:#4fd18b; --bad:#ff6b6b;
    --sol:#ff8a3d; --brumas:#8a6bff; --prof:#1fc3b0; --tormentas:#f5d33d;
    --shadow:0 8px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    overflow-x:hidden}
  body{display:flex;justify-content:center}
  #app{width:100%;max-width:780px;min-height:100vh;position:relative;padding:14px 14px 40px}
  h1,h2,h3{margin:0 0 .4em;font-weight:800;letter-spacing:.3px}
  h1{font-size:30px} h2{font-size:21px} h3{font-size:16px}
  p{line-height:1.5;color:var(--muted);margin:.3em 0}
  .center{text-align:center}
  .muted{color:var(--muted)}
  .gold{color:var(--gold)}
  .good{color:var(--good)} .bad{color:var(--bad)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;
    background:var(--panel2);border:1px solid var(--line)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(180deg,#2b3a63,#202c4e);color:var(--txt);border:1px solid var(--line);
    padding:12px 18px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
    transition:transform .06s ease, filter .15s ease;user-select:none}
  .btn:hover{filter:brightness(1.12)} .btn:active{transform:translateY(1px) scale(.99)}
  .btn.primary{background:linear-gradient(180deg,#f5c451,#e0a72f);color:#241a00;border-color:#caa033}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
  .btn.full{width:100%}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;
    box-shadow:var(--shadow)}
  .row{display:flex;gap:10px} .col{display:flex;flex-direction:column;gap:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .wrap{flex-wrap:wrap}
  .screen{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
  .topbar .res{display:flex;gap:14px;align-items:center;font-weight:700;font-size:14px}

  /* nation cards */
  .nation{cursor:pointer;border-radius:16px;border:2px solid var(--line);padding:16px;
    background:var(--panel);transition:transform .1s,border-color .15s;position:relative;overflow:hidden}
  .nation:hover{transform:translateY(-3px)}
  .nation .crest{font-size:40px;line-height:1}
  .nation.sel{border-color:var(--gold)}
  .nation .glow{position:absolute;inset:0;opacity:.14;pointer-events:none}

  /* unit cards */
  .unit{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px;
    position:relative}
  .unit .nm{font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
  .unit .arch{font-size:11px;color:var(--muted);margin:2px 0 7px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px}
  .stat{background:#0e1426;border-radius:7px;padding:4px 2px;text-align:center}
  .stat b{display:block;font-size:13px}
  .role{position:absolute;top:9px;right:9px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px}
  .role.ATA{background:#4a1d1d;color:#ff9c9c} .role.MEI{background:#1d3a4a;color:#8fd6ff}
  .role.DEF{background:#1d4a2c;color:#9cffb6} .role.GOL{background:#4a401d;color:#ffe39c}
  .rar{font-size:10px;font-weight:800}
  .rar.Comum{color:#9fb0d6} .rar.Raro{color:#6fb6ff} .rar.Lendário{color:var(--gold)}
  .abil{font-size:11px;color:#b9c4e6;margin-top:8px;line-height:1.35;min-height:30px}
  .starter-tag{position:absolute;bottom:9px;right:9px;font-size:10px;font-weight:800;color:var(--good)}

  /* bracket */
  .bracket{display:flex;flex-direction:column;gap:8px}
  .stage{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;background:var(--panel)}
  .stage.done{opacity:.5} .stage.cur{border-color:var(--gold);background:var(--panel2)}
  .stage .ic{font-size:22px;width:30px;text-align:center}
  .stage .nm{font-weight:800} .stage .sub{font-size:12px;color:var(--muted)}
  .stage .mark{margin-left:auto;font-weight:800}

  /* field */
  #field{position:relative;width:100%;height:200px;border-radius:14px;overflow:hidden;
    background:
      repeating-linear-gradient(90deg,#1f7a3a 0 9.99%,#1c7136 10% 19.99%);
    border:2px solid #0c4a20;box-shadow:inset 0 0 40px rgba(0,0,0,.4)}
  #field .midline{position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.5)}
  #field .circle{position:absolute;left:50%;top:50%;width:64px;height:64px;border:2px solid rgba(255,255,255,.5);
    border-radius:50%;transform:translate(-50%,-50%)}
  #field .goal{position:absolute;top:50%;transform:translateY(-50%);width:8px;height:64px;
    background:rgba(255,255,255,.85)}
  #field .goal.l{left:0;border-radius:0 4px 4px 0} #field .goal.r{right:0;border-radius:4px 0 0 4px}
  #field .area{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:120px;
    border:2px solid rgba(255,255,255,.4)}
  #field .area.l{left:0;border-left:none} #field .area.r{right:0;border-right:none}
  #ball{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#cfd6e4);box-shadow:0 2px 6px rgba(0,0,0,.5);
    transform:translate(-50%,-50%);transition:left .35s ease, top .35s ease;z-index:3}
  .crowd{position:absolute;left:0;right:0;height:14px;background:repeating-linear-gradient(90deg,#0c1326 0 6px,#15203b 6px 12px)}
  .crowd.top{top:0} .crowd.bot{bottom:0}

  .scoreboard{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0;
    font-weight:900;font-size:26px}
  .scoreboard .tn{font-size:13px;font-weight:800;max-width:120px;text-align:center}
  .clock{background:#000;color:#5fffa0;font-family:ui-monospace,Menlo,monospace;
    padding:3px 10px;border-radius:8px;font-size:16px}
  .momentum{height:10px;border-radius:6px;background:#3a1d1d;overflow:hidden;border:1px solid var(--line)}
  .momentum>div{height:100%;background:linear-gradient(90deg,var(--good),#2e9c66);transition:width .35s}

  .energybar{height:14px;border-radius:8px;background:#0e1426;overflow:hidden;border:1px solid var(--line)}
  .energybar>div{height:100%;background:linear-gradient(90deg,#f5c451,#ff8a3d);transition:width .25s}
  .tactics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
  .tactic{font-size:12px;padding:10px 6px;line-height:1.25;text-align:center}
  .tactic small{display:block;color:var(--muted);font-size:10px;margin-top:2px}

  #log{height:120px;overflow-y:auto;background:#0c1120;border:1px solid var(--line);border-radius:12px;
    padding:10px;font-size:13px;line-height:1.55}
  #log .e{margin-bottom:3px} #log .goal{color:var(--gold);font-weight:800}
  #log .save{color:#8fd6ff} #log .turn{color:var(--muted)} #log .sys{color:#c0a0ff}

  .shopitem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;
    padding:10px;background:var(--panel2)}
  .shopitem .ic{font-size:26px} .shopitem .info{flex:1}
  .shopitem .info .t{font-weight:800;font-size:14px} .shopitem .info .d{font-size:12px;color:var(--muted)}

  .speedctl{display:flex;gap:6px}
  .speedctl .btn{padding:8px 12px;font-size:13px}
  .seg.on{outline:2px solid var(--gold)}

  .relicrow{display:flex;gap:6px;flex-wrap:wrap}
  .relic{font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 8px}

  .fab{position:fixed;bottom:12px;right:12px;z-index:50}
  .hidden{display:none!important}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#000c;border:1px solid var(--gold);
    color:var(--gold);padding:10px 18px;border-radius:10px;font-weight:800;z-index:99;animation:fade .25s}
  @media(max-width:520px){
    h1{font-size:24px} .grid2{grid-template-columns:1fr} #field{height:170px}
    .scoreboard{font-size:22px}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* ============================================================================
   MUNDIAL DOS MITOS — MVP roguelike autobattler de futebol mítico
   Loop: escolher nação -> estrutura de Copa -> loja roguelike -> partida ao vivo
   ========================================================================== */

const $ = (s,el=document)=>el.querySelector(s);
const app = $("#app");
const rnd = (a,b)=>a+Math.random()*(b-a);
const ri = (a,b)=>Math.floor(rnd(a,b+1));
const pick = arr=>arr[ri(0,arr.length-1)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const id=()=>Math.random().toString(36).slice(2,9);

/* ---------------------------------- DADOS --------------------------------- */
const NATIONS = {
  sol:{key:"sol",name:"Reino do Sol Eterno",crest:"☀️",color:"var(--sol)",
    style:"Agressivo / Ofensivo",
    desc:"Futebol que cresce em chamas: a cada gol marcado a seleção ganha mais força de ataque.",
    bonus:{atk:3},passive:"momentum",
    tactic:{name:"Aurora Flamejante",cost:60,kind:"atk",mag:2.0,dur:3,
      desc:"Explosão ofensiva: ataque dobrado por alguns lances."}},
  brumas:{key:"brumas",name:"República das Brumas",crest:"🌫️",color:"var(--brumas)",
    style:"Controle / Ilusão",
    desc:"Domina a posse e confunde o adversário, roubando a bola com magia.",
    bonus:{ctrl:3},passive:"steal",
    tactic:{name:"Véu de Névoa",cost:55,kind:"steal",dur:2,
      desc:"Rouba a posse de bola e reduz a precisão adversária."}},
  prof:{key:"prof",name:"Confederação das Profundezas",crest:"🔱",color:"var(--prof)",
    style:"Defensivo / Resiliente",
    desc:"Muralha que vence por desgaste: regenera fôlego e cansa o oponente.",
    bonus:{def:3},passive:"regen",
    tactic:{name:"Maré Profunda",cost:55,kind:"def",mag:2.0,dur:3,
      desc:"Defesa dobrada e drena o fôlego do adversário."}},
  tormentas:{key:"tormentas",name:"Clã das Tormentas",crest:"⚡",color:"var(--tormentas)",
    style:"Velocidade / Caos",
    desc:"Alto risco e alta recompensa: contra-ataques relâmpago que decidem em segundos.",
    bonus:{vel:3},passive:"counter",
    tactic:{name:"Olho da Tempestade",cost:50,kind:"counter",dur:2,
      desc:"Contra-ataque fulminante: chance enorme de gol imediato."}},
};

// Arquétipos de jogadores (pool de recrutamento). r = orçamento/raridade.
const ARCH = [
  // Goleiros
  {a:"Goleira de Cristal",role:"GOL",ic:"🧊",rar:"Lendário",base:{atk:0,def:9,ctrl:3,vel:3},
    pa:"cristal",ab:"Defende quase tudo, mas trinca a cada defesa — perde força se sobrecarregada."},
  {a:"Guardião de Pedra",role:"GOL",ic:"🛡️",rar:"Comum",base:{atk:0,def:6,ctrl:2,vel:2},
    pa:null,ab:"Goleiro sólido e constante, sem surpresas."},
  {a:"Sentinela das Marés",role:"GOL",ic:"🌊",rar:"Raro",base:{atk:0,def:7,ctrl:4,vel:2},
    pa:"regen",ab:"Acalma o jogo: o time recupera fôlego mais rápido."},
  // Defensores
  {a:"Sentinela de Ferro",role:"DEF",ic:"⚙️",rar:"Comum",base:{atk:1,def:6,ctrl:2,vel:2},
    pa:null,ab:"Defesa confiável de retaguarda."},
  {a:"Muralha Ancestral",role:"DEF",ic:"🗿",rar:"Raro",base:{atk:1,def:7,ctrl:2,vel:1},
    pa:"slow",ab:"Reduz a velocidade do ataque adversário."},
  {a:"Couraça de Abismo",role:"DEF",ic:"🐚",rar:"Raro",base:{atk:1,def:8,ctrl:3,vel:1},
    pa:null,ab:"Bloqueio pesado das profundezas."},
  // Meio-campo
  {a:"Meia Ancião",role:"MEI",ic:"🧙",rar:"Lendário",base:{atk:2,def:2,ctrl:9,vel:1},
    pa:"maestro",ab:"Fraco fisicamente, mas dita o ritmo: +controle a todos os companheiros."},
  {a:"Maestro das Brumas",role:"MEI",ic:"🎴",rar:"Raro",base:{atk:3,def:2,ctrl:6,vel:3},
    pa:"steal",ab:"Tece ilusões: chance de roubar a posse adversária."},
  {a:"Vendaval",role:"MEI",ic:"🌀",rar:"Comum",base:{atk:3,def:2,ctrl:3,vel:6},
    pa:null,ab:"Liga defesa e ataque com velocidade."},
  // Atacantes
  {a:"Centroavante de Fogo",role:"ATA",ic:"🔥",rar:"Lendário",base:{atk:9,def:1,ctrl:2,vel:4},
    pa:"calor",ab:"Cada gol aumenta o calor do campo, queimando o fôlego dos dois times."},
  {a:"Lâmina Veloz",role:"ATA",ic:"🗡️",rar:"Raro",base:{atk:6,def:1,ctrl:2,vel:6},
    pa:"counter",ab:"Mestre do contra-ataque em alta velocidade."},
  {a:"Caçador Sombrio",role:"ATA",ic:"🌑",rar:"Raro",base:{atk:7,def:1,ctrl:3,vel:4},
    pa:null,ab:"Finalizador imprevisível e letal."},
  {a:"Aríete Solar",role:"ATA",ic:"🌟",rar:"Comum",base:{atk:6,def:1,ctrl:2,vel:3},
    pa:"momentum",ab:"Cresce conforme marca: ganha força a cada gol."},
];

const RELICS = [
  {key:"ambar",ic:"🟠",name:"Bola de Âmbar",desc:"+18% de chance de gol em todas as finalizações.",
    cost:5,eff:{shot:0.18}},
  {key:"vento",ic:"👟",name:"Chuteiras do Vento",desc:"+25% de velocidade da equipe.",
    cost:5,eff:{velMul:1.25}},
  {key:"amuleto",ic:"📿",name:"Amuleto do Guardião",desc:"+30% de defesa do goleiro.",
    cost:5,eff:{gk:1.30}},
  {key:"tambor",ic:"🥁",name:"Tambor de Guerra",desc:"A energia das táticas enche 60% mais rápido.",
    cost:4,eff:{energy:1.6}},
  {key:"calice",ic:"🏆",name:"Cálice da Resistência",desc:"Recupera fôlego: stamina cai 40% mais devagar.",
    cost:4,eff:{stam:0.6}},
  {key:"coroa",ic:"👑",name:"Coroa do Artilheiro",desc:"+20% de ataque global da equipe.",
    cost:6,eff:{atkMul:1.20}},
];

const STAGES = [
  {key:"g1",name:"Fase de Grupos — Jogo 1",ic:"🟢",diff:0.70,reward:9,boss:false},
  {key:"g2",name:"Fase de Grupos — Jogo 2",ic:"🟢",diff:0.78,reward:9,boss:false},
  {key:"g3",name:"Fase de Grupos — Jogo 3",ic:"🟢",diff:0.86,reward:10,boss:false},
  {key:"r16",name:"Oitavas de Final",ic:"⚔️",diff:0.94,reward:11,boss:false,ko:true},
  {key:"qf",name:"Quartas de Final",ic:"⚔️",diff:1.02,reward:13,boss:false,ko:true},
  {key:"sf",name:"Semifinal",ic:"🔥",diff:1.10,reward:15,boss:false,ko:true},
  {key:"final",name:"A FINAL — Seleção Imortal",ic:"👑",diff:1.18,reward:0,boss:true,ko:true},
];

const ENEMY_NAMES = ["Horda de Cinzas","Legião de Vidro","Ordem do Eclipse","Falange Errante",
  "Coral Sangrento","Estandarte Oco","Cova dos Reis","Vanguarda Lunar","Sentinelas de Ônix",
  "Filhos do Trovão","Companhia das Sombras","Bando das Dunas"];

/* --------------------------------- ESTADO --------------------------------- */
let S = null;
function newRun(nationKey){
  const n = NATIONS[nationKey];
  S = {
    nation:nationKey, gold:12, stageIdx:0, relics:[],
    roster:startingSquad(nationKey), starters:[], history:[],
  };
  // primeiros 5 jogadores viram titulares automaticamente
  S.starters = S.roster.slice(0,5).map(u=>u.uid);
}

function mkUnit(arch, lvl=1){
  const u={uid:id(),...arch,lvl,stats:{...arch.base}};
  // pequena variação para dar identidade
  for(const k in u.stats){ if(u.stats[k]>0) u.stats[k]+=ri(0,1); }
  return u;
}
function startingSquad(nationKey){
  // cada nação começa com 6 jogadores temáticos (5 titulares + 1 reserva)
  const byArch=a=>ARCH.find(x=>x.a===a);
  const sets={
    sol:["Guardião de Pedra","Sentinela de Ferro","Vendaval","Aríete Solar","Centroavante de Fogo","Caçador Sombrio"],
    brumas:["Sentinela das Marés","Sentinela de Ferro","Meia Ancião","Maestro das Brumas","Caçador Sombrio","Vendaval"],
    prof:["Sentinela das Marés","Couraça de Abismo","Muralha Ancestral","Vendaval","Aríete Solar","Caçador Sombrio"],
    tormentas:["Guardião de Pedra","Sentinela de Ferro","Vendaval","Lâmina Veloz","Caçador Sombrio","Aríete Solar"],
  };
  return sets[nationKey].map(a=>mkUnit(byArch(a)));
}

function unit(uid){return S.roster.find(u=>u.uid===uid);}
function starterUnits(){return S.starters.map(unit);}
function hasRelic(k){return S.relics.includes(k);}
function relicEff(){
  const e={shot:0,velMul:1,gk:1,energy:1,stam:1,atkMul:1};
  for(const k of S.relics){const r=RELICS.find(x=>x.key===k);if(!r)continue;
    for(const ek in r.eff){ if(ek==="shot") e.shot+=r.eff[ek];
      else e[ek]*= (ek in r.eff? r.eff[ek]:1); }}
  return e;
}

/* ----------------------- AGREGAÇÃO DE FORÇA DO TIME ----------------------- */
function teamPower(units, nationKey){
  const n = NATIONS[nationKey];
  let atk=0,def=0,ctrl=0,vel=0,gk=0;
  const maestro = units.some(u=>u.pa==="maestro");
  for(const u of units){
    const s=u.stats; const ctrlBonus = (maestro && u.pa!=="maestro")?2:0;
    const w = u.role==="ATA"?{atk:1,def:.1,ctrl:.4,vel:.6}
            : u.role==="MEI"?{atk:.6,def:.4,ctrl:1,vel:.7}
            : u.role==="DEF"?{atk:.2,def:1,ctrl:.4,vel:.4}
            : {atk:0,def:.3,ctrl:.3,vel:.2}; // GOL
    atk+=s.atk*w.atk; def+=s.def*w.def;
    ctrl+=(s.ctrl+ctrlBonus)*w.ctrl; vel+=s.vel*w.vel;
    if(u.role==="GOL") gk=Math.max(gk,s.def);
  }
  if(n){atk+=(n.bonus.atk||0);def+=(n.bonus.def||0);ctrl+=(n.bonus.ctrl||0);vel+=(n.bonus.vel||0);}
  return {atk,def,ctrl,vel,gk:gk||3};
}

/* ----------------------- GERAÇÃO DE ADVERSÁRIO (IA) ----------------------- */
function makeEnemy(stage){
  const styleNation = pick(Object.keys(NATIONS));
  const n=NATIONS[styleNation];
  let units;
  if(stage.boss){
    // boss: elenco lendário
    const leg = ARCH.filter(a=>a.rar!=="Comum");
    units=[ARCH.find(a=>a.a==="Goleira de Cristal"),
      ARCH.find(a=>a.a==="Couraça de Abismo"),
      ARCH.find(a=>a.a==="Meia Ancião"),
      ARCH.find(a=>a.a==="Centroavante de Fogo"),
      ARCH.find(a=>a.a==="Caçador Sombrio")].map(a=>mkUnit(a,2));
  } else {
    const roles=["GOL","DEF","MEI","ATA","ATA"];
    units=roles.map(r=>mkUnit(pick(ARCH.filter(a=>a.role===r))));
  }
  const power=teamPower(units, styleNation);
  // escala a força bruta pela dificuldade da fase
  const d=stage.diff;
  for(const k in power) power[k]*=d;
  return {
    name: stage.boss?"Seleção Imortal":pick(ENEMY_NAMES),
    crest: stage.boss?"💀":n.crest, color:n.color,
    nation:styleNation, units, power, boss:stage.boss,
  };
}

/* =============================== RENDER UI ================================ */
function clear(){app.innerHTML="";}
function topbar(){
  const st=STAGES[S.stageIdx];
  const relics = S.relics.map(k=>{const r=RELICS.find(x=>x.key===k);return `<span class="relic" title="${r.desc}">${r.ic}</span>`}).join("");
  return `<div class="topbar">
    <div class="res">
      <span>${NATIONS[S.nation].crest} <span class="muted">${NATIONS[S.nation].name.split(" ").slice(-1)}</span></span>
      <span class="gold">🪙 ${S.gold}</span>
    </div>
    <div class="res">
      <div class="relicrow">${relics||'<span class="muted" style="font-size:11px">sem relíquias</span>'}</div>
    </div>
  </div>`;
}
function toast(msg){
  const t=document.createElement("div");t.className="toast";t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),1700);
}

/* ------------------------------- TÍTULO ----------------------------------- */
function screenTitle(){
  clear();
  app.innerHTML=`<div class="screen center" style="padding-top:8vh">

  for(let i=0;i<3;i++){
    const arch=pick(ARCH);
    const cost = arch.rar==="Lendário"?7:arch.rar==="Raro"?4:2;
    players.push({u:mkUnit(arch),cost});

  const avail=RELICS.filter(r=>!hasRelic(r.key));
  const relics=[];
  const pool=[...avail];
  for(let i=0;i<2&&pool.length;i++){relics.push(pool.splice(ri(0,pool.length-1),1)[0]);}
  return {players,relics};
}

/* ================== A PARTIDA — MOTOR DE FÍSICA 2D (canvas) ================
   Bola como projétil real, stamina como vida (cai com o tempo e ao ser
   atingida pela bola), chutes de poder com VFX, jogadores que "caem" e
   deixam o time com um a menos. Estilo autobattler assistível: a física roda
   sozinha; o técnico intervém em 2-3 momentos-chave (táticas + chute de poder).
   ========================================================================= */
let M=null;
const FW=600, FH=340;
const GLINE=8, GMH=140, MT=(FH-GMH)/2, MB=(FH+GMH)/2;   // boca do gol
const PR=13, BR=7;
const TIMESCALE=2.0;        // minutos de jogo por segundo real (1x) -> ~45s/partida
const ENRATE=15;           // energia tática por segundo
const SHOOTDIST=255;
const CTRL_R=20, CTRL_SPD=70, STOPSPD=22;
const NORMAL_SHOT=250, POWER_SHOT=405, MAXBALLSPD=440;
const CHARGE_DUR=0.6, DRAIN=0.8, STUNTIME=3.2;

const opp = t => t==="home"?"away":"home";
function teamLabel(side){return side==="home"?M.home.name.split(" ").slice(-1):M.away.name;}

function computeHp(u,mul){
  const rb = u.role==="GOL"?60:u.role==="DEF"?28:u.role==="MEI"?8:0;
  return Math.round((55 + u.stats.def*7 + rb)*mul);
}
function mkPlayer(u,team,x,y,mul){
  const m = team==="away"?mul:1;
  const hp = computeHp(u,m);
  return {unit:u,team,role:u.role,x,y,sx:x,sy:y,ax:x,ay:y,vx:0,vy:0,kvx:0,kvy:0,
    maxHp:hp,hp, stun:0, charging:false, chargeT:0, isPowerShooter:false,
    spd:(72+u.stats.vel*7)*(team==="away"?(0.9+mul*0.1):1), atk:u.stats.atk};
}
function spawnTeam(units,team,mul){
  const byRole={GOL:[],DEF:[],MEI:[],ATA:[]};
  units.forEach(u=>(byRole[u.role]||byRole.MEI).push(u));
  const bx={GOL:0.07,DEF:0.25,MEI:0.43,ATA:0.62};
  const arr=[];
  for(const role in byRole){
    const list=byRole[role];
    list.forEach((u,i)=>{
      const fy=list.length===1?0.5:0.27+0.46*(i/(list.length-1));
      let fx=bx[role]!==undefined?bx[role]:0.43;
      if(team==="away") fx=1-fx;
      arr.push(mkPlayer(u,team,fx*FW,fy*FH,mul));
    });
  }
  return arr;
}

function startMatch(){
  S._shop=null;
  const stage=STAGES[S.stageIdx];
  const homeUnits=starterUnits();
  const away=makeEnemy(stage);
  const mul=stage.diff;
  M={
    stage,
    home:{name:NATIONS[S.nation].name,crest:NATIONS[S.nation].crest,color:NATIONS[S.nation].color,nation:S.nation,units:homeUnits},
    away:{name:away.name,crest:away.crest,color:away.color,nation:away.nation,units:away.units},
    players:[...spawnTeam(homeUnits,"home",1),...spawnTeam(away.units,"away",mul)],
    ball:{x:FW/2,y:FH/2,vx:0,vy:0,owner:null,lastTouch:"home",powered:false,trail:[],col:"#fff",shotAtk:5},
    score:{home:0,away:0}, time:0, energy:25, calor:0, cracks:0, momHome:0,
    buffs:{home:{},away:{}}, cmdPower:false, shotCd:0, shake:0, hitstop:0, vfx:[],
    speed:2, paused:false, ended:false, running:true, last:0, ctx:null, canvas:null,
  };
  renderMatch();
  log("sys",`🏟️ ${M.home.name} <span class="muted">x</span> ${M.away.name}`);
  log("sys","Apito inicial! A bola é um projétil — chutes fortes ferem o fôlego de quem for atingido.");
  M.raf=requestAnimationFrame(matchLoop);
}

function matchLoop(ts){
  if(!M||M.ended)return;
  const now=ts/1000; if(!M.last)M.last=now;
  let dt=now-M.last; M.last=now; dt=Math.min(dt,0.05);
  if(!M.paused){
    if(M.hitstop>0){ M.hitstop-=dt; }
    else { physicsStep(dt*M.speed); }
    updateVfx(dt*M.speed);
    if(M.shake>0.3) M.shake*=Math.pow(0.004,dt);
  }
  draw();
  if(!M.ended) M.raf=requestAnimationFrame(matchLoop);
}

/* ------------------------------ FÍSICA ----------------------------------- */
function nearestOutfield(team){
  let best=null,bd=1e9;
  for(const p of M.players){ if(p.team!==team||p.role==="GOL"||p.stun>0)continue;
    const d=Math.hypot(p.x-M.ball.x,p.y-M.ball.y); if(d<bd){bd=d;best=p;} }
  return best;
}
function topAttacker(team){
  let best=null,ba=-1;
  for(const p of M.players){ if(p.team!==team||p.role==="GOL"||p.stun>0)continue;
    if(p.atk>ba){ba=p.atk;best=p;} }
  if(!best) for(const p of M.players){ if(p.team===team&&p.stun<=0){best=p;break;} }
  return best;
}
function applyKnock(p,sdt){ p.x+=p.kvx*sdt; p.y+=p.kvy*sdt; const f=Math.pow(0.02,sdt); p.kvx*=f; p.kvy*=f; }

function physicsStep(sdt){
  const b=M.ball;
  M.time += sdt*TIMESCALE;
  M.energy = clamp(M.energy + sdt*ENRATE*relicEff().energy,0,100);
  M.shotCd = Math.max(0,M.shotCd-sdt);
  for(const side of ["home","away"]) for(const k in M.buffs[side]){ M.buffs[side][k]-=sdt; if(M.buffs[side][k]<=0) delete M.buffs[side][k]; }

  // stamina/vida: dreno passivo, calor, regen, recuperação de queda
  const calorF=1+M.calor*0.15;
  const homeRegen = NATIONS[S.nation].passive==="regen" || starterUnits().some(u=>u.pa==="regen");
  for(const p of M.players){
    if(p.stun>0){ p.stun-=sdt; if(p.stun<=0) p.hp=p.maxHp*0.4; continue; }
    let drain=DRAIN*calorF;
    if(p.team==="home"&&homeRegen) drain*=0.4;
    if(p.team==="away"&&M.buffs.home.drain>0) drain*=2.2;
    p.hp-=drain*sdt;
    if(p.hp<=0){ p.hp=0; p.stun=STUNTIME; p.charging=false; p.chargeT=0;
      spawnBurst(p.x,p.y,"#ff6b6b",10);
      log("turn",`💥 ${p.unit.ic} ${p.unit.a} caiu sem fôlego — ${teamLabel(p.team)} com um a menos!`); }
  }

  // dono da bola (controle quando lenta e alguém perto)
  if(b.owner && b.owner.stun>0) b.owner=null;
  if(!b.owner && Math.hypot(b.vx,b.vy)<CTRL_SPD){
    let best=null,bd=CTRL_R+6;
    for(const p of M.players){ if(p.stun>0)continue; const d=Math.hypot(p.x-b.x,p.y-b.y); if(d<bd){bd=d;best=p;} }
    if(best){ b.owner=best; b.lastTouch=best.team; b.powered=false; }
  }
  const chaser={home:nearestOutfield("home"),away:nearestOutfield("away")};

  // movimento dos jogadores (IA simples de formação + perseguição)
  for(const p of M.players){
    if(p.stun>0){ p.vx=p.vy=0; applyKnock(p,sdt); continue; }
    let tx,ty;
    const oppGoalX=p.team==="home"?FW-GLINE:GLINE;
    const ownGoalX=p.team==="home"?GLINE:FW-GLINE;
    if(p.role==="GOL"){ tx=ownGoalX+(p.team==="home"?18:-18); ty=clamp(b.y,MT+12,MB-12); }
    else if(b.owner&&b.owner.team===p.team){
      if(p===b.owner){ tx=oppGoalX; ty=FH/2+(b.y-FH/2)*0.5; }
      else { tx=p.ax+(p.team==="home"?72:-72); ty=p.ay*0.6+b.y*0.4; }
    } else if(b.owner&&b.owner.team!==p.team){
      if(p===chaser[p.team]){ tx=b.owner.x; ty=b.owner.y; }
      else { tx=p.ax-(p.team==="home"?22:-22); ty=p.ay*0.5+b.y*0.5; }
    } else {
      if(p===chaser[p.team]){ tx=b.x; ty=b.y; } else { tx=p.ax; ty=p.ay*0.6+b.y*0.4; }
    }
    let spd=p.spd*(0.5+0.5*p.hp/p.maxHp);
    if(p.team==="home"&&M.buffs.home.haste>0) spd*=1.6;
    if(p.team==="away"&&M.buffs.away.slow>0) spd*=0.5;
    const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy)||1;
    if(d>3){ p.x+=dx/d*spd*sdt; p.y+=dy/d*spd*sdt; }
    applyKnock(p,sdt);
    p.x=clamp(p.x,BR,FW-BR); p.y=clamp(p.y,8,FH-8);
  }

  // bola: presa ao dono (drible/chute) ou em voo (projétil)
  if(b.owner){
    const o=b.owner;
    const gx=(o.team==="home"?FW-GLINE:GLINE)-o.x, gy=FH/2-o.y, gd=Math.hypot(gx,gy)||1;
    b.x=o.x+gx/gd*(PR+BR+1); b.y=o.y+gy/gd*(PR+BR+1); b.vx=0; b.vy=0;
    if(o.isPowerShooter&&!o.charging){ o.charging=true; o.chargeT=0; log("sys",`✨ ${o.unit.ic} ${o.unit.a} carrega um CHUTE DE PODER!`); }
    if(o.charging){ o.chargeT+=sdt; if(o.chargeT>=CHARGE_DUR) releaseShot(o,true); }
    else if(o.role==="GOL"){ if(M.shotCd<=0) releaseShot(o,false,true); }
    else {
      const distGoal=Math.hypot((o.team==="home"?FW-GLINE:GLINE)-o.x,FH/2-o.y);
      const ch=chaser[opp(o.team)];
      const pressed=ch&&Math.hypot(ch.x-o.x,ch.y-o.y)<26;
      if(M.shotCd<=0&&distGoal<SHOOTDIST&&(Math.random()<0.045||(pressed&&Math.random()<0.07))) releaseShot(o,false);
      else if(pressed&&Math.random()<0.025) releaseShot(o,false,true);
    }
  } else {
    integrateBall(sdt);
  }

  if(M.time>=90&&M.running){ endRegulation(); }
}

function releaseShot(shooter,powered,isPass){
  const b=M.ball;
  let aimX,aimY;
  if(isPass){ aimX=shooter.team==="home"?FW*0.7:FW*0.3; aimY=clamp(shooter.y+rnd(-60,60),20,FH-20); }
  else { aimX=shooter.team==="home"?FW-GLINE+4:GLINE-4; aimY=clamp(FH/2+rnd(-(GMH/2-12),GMH/2-12),MT,MB); }
  aimY+=rnd(-1,1)*(1-shooter.hp/shooter.maxHp)*60;
  const dx=aimX-shooter.x,dy=aimY-shooter.y,d=Math.hypot(dx,dy)||1;
  if(shooter.team==="home"&&M.buffs.home.power>0) powered=true;
  const spd=isPass?185:(powered?POWER_SHOT:NORMAL_SHOT)+shooter.atk*4;
  b.vx=dx/d*spd; b.vy=dy/d*spd;
  b.owner=null; b.lastTouch=shooter.team; b.powered=powered&&!isPass; b.trail=[];
  b.shotAtk=shooter.atk; b.col=powered?shotColor(shooter):"#fff";
  shooter.charging=false; shooter.chargeT=0;
  if(shooter.isPowerShooter){ shooter.isPowerShooter=false; M.cmdPower=false; }
  M.shotCd=isPass?0.3:0.6;
  if(!isPass&&powered){ spawnBurst(shooter.x,shooter.y,b.col,16); M.shake=Math.max(M.shake,7);
    log("e",`🔥 ${teamLabel(shooter.team)}: CHUTE DE PODER de ${shooter.unit.ic} ${shooter.unit.a}!`); }
}
function shotColor(p){ return p.unit.pa==="calor"?"#ff7b2d":(p.team==="home"?M.home.color:M.away.color); }

function integrateBall(sdt){
  const b=M.ball;
  const sp=Math.hypot(b.vx,b.vy);
  const steps=Math.max(1,Math.ceil(sp*sdt/6)), h=sdt/steps;
  for(let s=0;s<steps;s++){
    b.x+=b.vx*h; b.y+=b.vy*h;
    const fr=Math.pow(0.35,h); b.vx*=fr; b.vy*=fr;
    if(b.y<BR){ b.y=BR; b.vy=-b.vy*0.7; }
    if(b.y>FH-BR){ b.y=FH-BR; b.vy=-b.vy*0.7; }
    if(handleBallCollisions()) return;
    if(checkGoal()) return;
  }
  if(b.powered){ b.trail.push({x:b.x,y:b.y}); if(b.trail.length>14) b.trail.shift(); }
  if(Math.hypot(b.vx,b.vy)<STOPSPD) b.powered=false;
}

function handleBallCollisions(){
  const b=M.ball, sp=Math.hypot(b.vx,b.vy);
  for(const p of M.players){
    if(p.stun>0) continue;
    const dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy);
    if(d>PR+BR) continue;
    if(p.team===b.lastTouch) continue;   // a bola passa pelos companheiros
    const nx=(b.x-p.x)/(d||1), ny=(b.y-p.y)/(d||1);
    if(p.role==="GOL"){
      b.vx=Math.abs(b.vx)*(p.team==="home"?1:-1)*0.6+nx*70;
      b.vy=b.vy*0.4+ny*70; b.powered=false; b.lastTouch=p.team;
      const chip=sp>200?6:2;
      if(p.unit.pa==="cristal"){ M.cracks++; p.hp-=chip+M.cracks*2; spawnBurst(p.x,p.y,"#bfe9ff",12);
        log("save",`🧊 Defesa da Goleira de Cristal — o cristal trinca! (${M.cracks})`); }
      else { p.hp-=chip; spawnBurst(p.x,p.y,"#8fd6ff",8); log("save",`🧤 Defesaça de ${teamLabel(p.team)}!`); }
      if(p.hp<=0){ p.hp=0; p.stun=STUNTIME; }
      M.shake=Math.max(M.shake,sp>250?6:3); M.hitstop=Math.max(M.hitstop,0.05);
      return false;
    } else if(sp>170){
      const e=b.powered;
      let dmg=(sp/MAXBALLSPD)*34*(e?2.3:1)*(0.7+0.06*(b.shotAtk||5));
      if(p.team==="home"&&M.buffs.home.shield>0) dmg*=0.5;
      p.hp-=dmg;
      p.kvx+=-nx*(e?170:90); p.kvy+=-ny*(e?170:90);
      b.vx=nx*sp*0.5+rnd(-40,40); b.vy=ny*sp*0.5+rnd(-40,40);
      b.powered=false; b.lastTouch=p.team;
      spawnBurst(b.x,b.y,e?"#ff7b2d":"#ffd24a",e?16:8);
      M.shake=Math.max(M.shake,e?9:4); M.hitstop=Math.max(M.hitstop,e?0.12:0.05);
      log("e",`💥 ${p.unit.ic} ${p.unit.a} levou o impacto${e?" de um chute de poder":""}! (-${Math.round(dmg)} fôlego)`);
      if(p.hp<=0){ p.hp=0; p.stun=STUNTIME; p.charging=false; log("turn",`💫 ${p.unit.ic} ${p.unit.a} foi derrubado!`); }
      return false;
    } else { b.lastTouch=p.team; return false; }
  }
  return false;
}

function checkGoal(){
  const b=M.ball;
  if(b.x<=GLINE){ if(b.y>MT&&b.y<MB){ scoreGoal("away"); } else { resetLoose("home"); } return true; }
  if(b.x>=FW-GLINE){ if(b.y>MT&&b.y<MB){ scoreGoal("home"); } else { resetLoose("away"); } return true; }
  return false;
}
function resetLoose(side){
  const b=M.ball;
  b.x=side==="home"?GLINE+44:FW-GLINE-44; b.y=clamp(b.y,30,FH-30);
  b.vx=0; b.vy=0; b.owner=null; b.powered=false; b.lastTouch=side;
}
function scoreGoal(side){
  M.score[side]++;
  const sc=topAttacker(side);
  log("goal",`⚽ GOOOL de ${teamLabel(side)}! ${sc?sc.unit.ic+" "+sc.unit.a:""} marca. (${M.score.home} x ${M.score.away})`);
  spawnBurst(side==="home"?FW-GLINE:GLINE,FH/2,"#f5c451",30);
  M.shake=Math.max(M.shake,12); M.hitstop=Math.max(M.hitstop,0.25);
  if(side==="home"&&(NATIONS[S.nation].passive==="momentum"||starterUnits().some(u=>u.pa==="momentum"))){
    M.momHome+=4; for(const p of M.players) if(p.team==="home"&&p.role==="ATA") p.atk+=2;
    log("sys","🔆 O Sol arde: seus atacantes ficam mais fortes!"); }
  if((side==="home"?starterUnits():M.away.units).some(u=>u.pa==="calor")){
    M.calor+=2; log("sys","🔥 O calor do campo aumenta — o fôlego queima mais rápido."); }
  kickoff(opp(side));
}
function kickoff(side){
  for(const p of M.players){ p.x=p.sx; p.y=p.sy; p.vx=p.vy=p.kvx=p.kvy=0; }
  const b=M.ball; b.x=FW/2; b.y=FH/2; b.owner=null; b.powered=false; b.trail=[];
  b.vx=side==="home"?-30:30; b.vy=rnd(-15,15); b.lastTouch=side;
}

/* ------------------------------ FIM / PÊNALTIS --------------------------- */
function teamRating(team,kind){
  const us=team==="home"?starterUnits():M.away.units;
  if(kind==="shoot"){ const a=us.filter(u=>u.role!=="GOL"); return a.reduce((s,u)=>s+u.stats.atk,0)/Math.max(1,a.length); }
  const g=us.find(u=>u.role==="GOL"); return g?g.stats.def:3;
}
function penalties(){
  const ha=teamRating("home","shoot"),hg=teamRating("home","gk");
  const aa=teamRating("away","shoot"),ag=teamRating("away","gk");
  let h=0,a=0;
  for(let i=0;i<5;i++){ if(Math.random()<clamp(0.5+(ha-ag)*0.02,0.25,0.85))h++; if(Math.random()<clamp(0.5+(aa-hg)*0.02,0.25,0.85))a++; }
  let guard=0; while(h===a&&guard++<10){ if(Math.random()<0.55)h++; if(h===a&&Math.random()<0.5)a++; }
  if(h===a)h++;
  log("sys",`🥅 Disputa de pênaltis: ${teamLabel("home")} ${h} x ${a} ${M.away.name}`);
  finishMatch(h>a?"home":"away");
}
function endRegulation(){
  M.running=false; if(M.raf)cancelAnimationFrame(M.raf);
  if(M.score.home===M.score.away&&M.stage.ko){ log("sys","⏱️ Empate no tempo normal — vamos aos PÊNALTIS!"); setTimeout(penalties,800); return; }
  finishMatch(M.score.home>M.score.away?"home":(M.score.home<M.score.away?"away":"draw"));
}
function finishMatch(result){
  M.ended=true; if(M.raf)cancelAnimationFrame(M.raf);
  setTimeout(()=>screenResult(result==="home",result==="draw"),800);
}

/* ------------------------------ TÁTICAS ---------------------------------- */
function useTactic(which){
  if(!M||M.ended||!M.running)return;
  const t=NATIONS[S.nation].tactic;
  if(which==="sig"){
    if(M.energy<t.cost){toast("Energia insuficiente");return;} M.energy-=t.cost;
    if(t.kind==="atk"){ M.buffs.home.power=4; log("sys",`✨ ${t.name}! Os chutes do seu time queimam por alguns segundos.`); }
    else if(t.kind==="steal"){ M.buffs.away.slow=3; if(M.ball.owner&&M.ball.owner.team==="away"){M.ball.owner=null;M.ball.lastTouch="home";} log("sys",`✨ ${t.name}! A névoa confunde e lentifica o adversário.`); }
    else if(t.kind==="def"){ M.buffs.home.shield=4; M.buffs.home.drain=4; log("sys",`✨ ${t.name}! Defesa reforçada e o adversário se esgota.`); }
    else if(t.kind==="counter"){ M.buffs.home.haste=3.5; log("sys",`✨ ${t.name}! Contra-ataque relâmpago.`); }
  } else if(which==="power"){
    if(M.energy<45){toast("Energia insuficiente");return;} M.energy-=45; M.cmdPower=true;
    const sh=topAttacker("home");
    if(sh){ for(const p of M.players)p.isPowerShooter=false; sh.isPowerShooter=true;
      toast(`${sh.unit.a} vai soltar um chute de poder!`);
      log("sys",`🎯 ${sh.unit.ic} ${sh.unit.a} foi designado para o CHUTE DE PODER (na próxima posse).`); }
  } else if(which==="heal"){
    if(M.energy<50){toast("Energia insuficiente");return;} M.energy-=50;
    for(const p of M.players) if(p.team==="home"){ if(p.stun>0){p.stun=0;p.hp=p.maxHp*0.5;} else p.hp=Math.min(p.maxHp,p.hp+p.maxHp*0.35); }
    spawnBurst(FW*0.25,FH/2,"#4fd18b",22);
    log("sys","💚 Reforço de fôlego: seu time recupera energia e reanima os caídos.");
  }
  updateHud();
}

/* ------------------------------ VFX -------------------------------------- */
function spawnBurst(x,y,color,n){
  for(let i=0;i<n;i++){ const a=Math.random()*7,s=rnd(30,170);
    M.vfx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.3,.7),max:.7,color,size:rnd(2,5)}); }
}
function updateVfx(sdt){
  for(let i=M.vfx.length-1;i>=0;i--){ const v=M.vfx[i];
    v.x+=v.vx*sdt; v.y+=v.vy*sdt; v.vx*=0.92; v.vy*=0.92; v.life-=sdt;
    if(v.life<=0) M.vfx.splice(i,1); }
}

/* ------------------------------ DESENHO ---------------------------------- */
function draw(){
  const ctx=M.ctx; if(!ctx)return;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,FW,FH);
  ctx.save();
  if(M.shake>0.3) ctx.translate(rnd(-M.shake,M.shake),rnd(-M.shake,M.shake));
  for(let i=0;i<10;i++){ ctx.fillStyle=i%2?"#1c7136":"#1f7a3a"; ctx.fillRect(i*FW/10,0,FW/10+1,FH); }
  ctx.strokeStyle="rgba(255,255,255,.45)"; ctx.lineWidth=2;
  ctx.strokeRect(6,6,FW-12,FH-12);
  ctx.beginPath(); ctx.moveTo(FW/2,6); ctx.lineTo(FW/2,FH-6); ctx.stroke();
  ctx.beginPath(); ctx.arc(FW/2,FH/2,40,0,7); ctx.stroke();
  ctx.strokeRect(6,MT-22,48,GMH+44); ctx.strokeRect(FW-54,MT-22,48,GMH+44);
  ctx.fillStyle="rgba(255,255,255,.9)"; ctx.fillRect(0,MT,GLINE,GMH); ctx.fillRect(FW-GLINE,MT,GLINE,GMH);
  for(const p of M.players) drawPlayer(ctx,p);
  const b=M.ball;
  if(b.powered&&b.trail.length){ for(let i=0;i<b.trail.length;i++){ const t=b.trail[i];
    ctx.globalAlpha=i/b.trail.length*0.6; ctx.fillStyle=b.col;
    ctx.beginPath(); ctx.arc(t.x,t.y,BR*(i/b.trail.length),0,7); ctx.fill(); } ctx.globalAlpha=1; }
  ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(b.x,b.y,BR,0,7); ctx.fill();
  ctx.strokeStyle="#33405a"; ctx.lineWidth=1; ctx.stroke();
  for(const v of M.vfx){ ctx.globalAlpha=clamp(v.life/v.max,0,1); ctx.fillStyle=v.color;
    ctx.beginPath(); ctx.arc(v.x,v.y,v.size,0,7); ctx.fill(); } ctx.globalAlpha=1;
  ctx.restore();
  updateHud();
}
function drawPlayer(ctx,p){
  ctx.fillStyle="rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(p.x,p.y+PR*0.7,PR*0.9,PR*0.4,0,0,7); ctx.fill();
  const col=p.team==="home"?M.home.color:M.away.color;
  if(p.stun>0){
    ctx.globalAlpha=0.5; ctx.fillStyle="#566"; ctx.beginPath(); ctx.arc(p.x,p.y,PR,0,7); ctx.fill(); ctx.globalAlpha=1;
    ctx.strokeStyle="#ff6b6b"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(p.x-6,p.y-6); ctx.lineTo(p.x+6,p.y+6); ctx.moveTo(p.x+6,p.y-6); ctx.lineTo(p.x-6,p.y+6); ctx.stroke();
    return;
  }
  if(p.charging){ const r=PR+4+p.chargeT/CHARGE_DUR*12; ctx.strokeStyle=shotColor(p); ctx.lineWidth=3;
    ctx.globalAlpha=0.4+0.5*Math.random(); ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.stroke(); ctx.globalAlpha=1; }
  if(p.isPowerShooter){ ctx.strokeStyle="#f5c451"; ctx.lineWidth=2; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.arc(p.x,p.y,PR+5,0,7); ctx.stroke(); ctx.setLineDash([]); }
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(p.x,p.y,PR,0,7); ctx.fill();
  ctx.fillStyle="rgba(0,0,0,.6)"; ctx.font="bold 10px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(p.role[0],p.x,p.y);
  const frac=clamp(p.hp/p.maxHp,0,1);
  ctx.strokeStyle=frac>0.5?"#4fd18b":frac>0.25?"#f5c451":"#ff6b6b"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(p.x,p.y,PR+3,-Math.PI/2,-Math.PI/2+frac*Math.PI*2); ctx.stroke();
}

/* ------------------------------ HUD / DOM -------------------------------- */
function teamLife(team){ let h=0,m=0; for(const p of M.players) if(p.team===team){h+=Math.max(0,p.hp);m+=p.maxHp;} return m?h/m:0; }
function teamDowns(team){ let n=0; for(const p of M.players) if(p.team===team&&p.stun>0)n++; return n; }

      </div>

    <div class="card" style="margin-top:10px;padding:12px">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
        <span>⚡ Energia tática</span><span class="muted">🔥 calor: <span id="cal">0</span></span>

  M.canvas=$("#pitch"); M.ctx=M.canvas.getContext("2d");

  $("#s1").onclick=()=>setSpeed(1); $("#s2").onclick=()=>setSpeed(2); $("#s3").onclick=()=>setSpeed(3);

}
function setSpeed(s){ M.speed=s; M.paused=false; const pb=$("#pause"); if(pb)pb.textContent="⏸";
  ["s1","s2","s3"].forEach(x=>{const e=$("#"+x);if(e)e.classList.remove("on");}); const e=$("#s"+s); if(e)e.classList.add("on"); }

function updateHud(){
  if(!M)return;
  const set=(id,v)=>{const e=$("#"+id);if(e)e.textContent=v;};
  set("sH",M.score.home); set("sA",M.score.away); set("clk",Math.min(90,Math.floor(M.time))+"'"); set("cal",M.calor);
  const lh=$("#lifeH"); if(lh)lh.style.width=(teamLife("home")*100).toFixed(0)+"%";
  const la=$("#lifeA"); if(la)la.style.width=(teamLife("away")*100).toFixed(0)+"%";
  const enr=$("#enr"); if(enr)enr.style.width=M.energy+"%";
  const dh=teamDowns("home"), da=teamDowns("away");
  const men=$("#men"); if(men)men.textContent=(dh||da)?`(${5-dh} x ${5-da} em campo)`:"";
  const t=NATIONS[S.nation].tactic;
  const ts=$("#tSig"); if(ts)ts.disabled=M.energy<t.cost;
  const tp=$("#tPow"); if(tp)tp.disabled=M.energy<45||M.cmdPower;
  const th=$("#tHeal"); if(th)th.disabled=M.energy<50;
}

function log(cls,html){
  const box=$("#log"); if(!box)return;
  const d=document.createElement("div"); d.className="e "+(cls||""); d.innerHTML=html;
  box.appendChild(d); box.scrollTop=box.scrollHeight;
}

/* ------------------------------- RESULTADO -------------------------------- */
function screenResult(won,drew){
  clear();
  const stage=M.stage;
  let gold=0, advance=false, eliminated=false, champion=false;
  if(won){
    gold = stage.reward;
    S.gold+=gold;
    if(stage.boss){champion=true;}
    else advance=true;
  } else if(drew && !stage.ko){
    gold = Math.floor(stage.reward/2); S.gold+=gold; advance=true;
  } else {
    eliminated=true;
  }
  S.history.push({stage:stage.name,score:`${M.score.home}-${M.score.away}`,won});

  const head = champion?`<div style="font-size:64px">🏆</div><h1 class="gold">CAMPEÕES IMORTAIS!</h1>`
    : won?`<div style="font-size:54px">✅</div><h2 class="good">Vitória!</h2>`
    : drew&&!stage.ko?`<div style="font-size:54px">🤝</div><h2>Empate — avança na fase de grupos</h2>`
    : `<div style="font-size:54px">💀</div><h2 class="bad">Eliminado</h2>`;

  let body="";
  if(champion){
    body=`<p class="center">Sua seleção venceu a <b>Seleção Imortal</b> e reinará pelos próximos mil anos.</p>`;
  } else if(eliminated){
    body=`<p class="center">A jornada termina aqui. As brumas do tempo reclamam sua seleção.</p>`;
  }

  const summary=`<div class="card" style="margin-top:12px">
    <h3>Súmula</h3>
    <p>${M.home.name} <b>${M.score.home} x ${M.score.away}</b> ${M.away.name}</p>
    ${gold?`<p class="gold">+🪙 ${gold} Ouro Místico</p>`:""}
    <p class="muted" style="font-size:12px">Caminho: ${S.history.map(h=>h.won?"🟢":"🔴").join(" ")}</p>
  </div>`;

  let btns="";
  if(advance){btns=`<button class="btn primary full" id="next" style="margin-top:14px">Avançar na Copa →</button>`;}
  else {btns=`<button class="btn primary full" id="again" style="margin-top:14px">↻ Nova corrida</button>`;}

  app.innerHTML=`<div class="screen center" style="padding-top:4vh">${head}${body}${summary}${btns}</div>`;
  if(advance){$("#next").onclick=()=>{S.stageIdx++;M=null;screenHub();};}
  else{$("#again").onclick=()=>{S=null;M=null;screenTitle();};}
}
